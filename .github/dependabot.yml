version: 2

# Weekly pull requests on Monday at 06:00 America/Phoenix, grouped production /
# development to keep the list short. Major versions are not proposed: they need a
# deliberate migration (Tailwind CSS 3 → 4 in v1.187.7 is the example) and are opened
# by hand, or by dropping the ignore rule below for one run. Every Dependabot pull
# request goes through the same CI gates as any other; none is merged automatically.

updates:
  # ── npm: server (Fastify, MQTT, etc.) ────────────────────────────────────
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Phoenix
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(server)"
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── npm: web (Vite/React/Tailwind) ───────────────────────────────────────
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Phoenix
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(web)"
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions: action versions in .github/workflows ─────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Phoenix
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── Docker: the Dockerfile's build stages (node:22-alpine) ──────────────
  # The runtime base (ghcr.io/home-assistant/{arch}-base:3.21@sha256:…) is passed in
  # as BUILD_FROM and pinned by digest in build.yaml, ci.yml and images.yml. Dependabot
  # cannot see it there, so a base update is a manual, three-file edit.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Phoenix
    commit-message:
      prefix: "deps(docker)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
