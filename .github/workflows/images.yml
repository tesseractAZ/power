name: Publish images
run-name: Publish images ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}

# Build + push multi-arch Docker images to GHCR for a release tag, then cut the
# GitHub Release that announces the version is fully installable.
#
# Flow:
#   1. tag-release.yml (which runs on every push to main) dispatches this
#      workflow right after it pushes the vX.Y.Z tag for the version
#      config.yaml declares on main, and re-dispatches it from a re-run or a
#      manual run when the tag has no Release: a tag pushed with GITHUB_TOKEN
#      does not fire the `push: tags` trigger below (only a tag pushed by hand
#      would). A manual workflow_dispatch re-runs a version. The server suite
#      runs first, then amd64 and aarch64 build in parallel, each on its own
#      native runner (ubuntu-26.04, ubuntu-26.04-arm) with no emulation. Every
#      job runs on a pinned image, never ubuntu-latest.
#   2. Each image is pushed to ghcr.io/<owner>/{arch}-ecoflow-panel as both
#      :{version} and :latest. HA Supervisor pulls these instead of building
#      on the Pi.
#   3. Once both arch builds succeed, extract the version's CHANGELOG section
#      and create the GitHub Release with it. The Release appearing = "go
#      ahead and update the Pi."
#
# First-time setup: after the very first push, open
# <https://github.com/tesseractAZ?tab=packages> and toggle each of the two new
# packages from Private → Public so HA can pull them anonymously.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re)build, without leading v (e.g. 0.2.0)"
        type: string
        required: true

permissions:
  contents: write   # GitHub Release creation
  packages: write   # GHCR push

# One run per version at a time, none cancelled: a re-dispatch that raced a running
# build would otherwise race it to `gh release create`, and the second one fails.
concurrency:
  group: images-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            v="$INPUT_VERSION"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          # Strict X.Y.Z, as tag-release.yml tags: no leading zeros, no suffix.
          if [[ ! "$v" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid version '$v' (expected X.Y.Z)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "📦 Publishing v$v"

  test:
    name: Server tests
    needs: resolve
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server deps
        working-directory: server
        run: npm ci
      - name: Run server tests
        working-directory: server
        # Note: v0.9.0 refactored config.ts to use lazy getters, so the
        # ECOFLOW_ACCESS_KEY / ECOFLOW_SECRET_KEY env vars are no longer
        # required at module-load time. The CI env-var workaround that
        # v0.8.2 needed is no longer necessary.
        run: npm test
      - name: tsc --noEmit (server)
        working-directory: server
        run: npx tsc --noEmit

  build:
    name: Build & push (${{ matrix.arch }})
    needs: [resolve, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each arch builds on its NATIVE host. GitHub started offering free
          # Linux ARM64 runners for public repos in Jan 2025, so we skip the
          # QEMU emulation path entirely. Previously aarch64 ran on amd64
          # hosts via QEMU, which routinely stretched the build to 30–60 min
          # when GitHub's runner pool was busy (50+ min on v0.7.6 + v0.7.7).
          # Native runners take about a minute per arch with the GHA layer
          # cache (31–76 s per build job across v1.187.8–v1.187.16).
          - arch: aarch64
            platform: linux/arm64
            # v1.7.0 (security #6, CWE-1357) — digest-pin the base image so a
            # repointed upstream `3.21` tag can't silently change our runtime.
            # Update the digest deliberately when bumping the base.
            base: ghcr.io/home-assistant/aarch64-base:3.21@sha256:5100b3a2e4741440e7bd587c124920fa3bf02287c4de3cb48aacef7049530ee1
            runner: ubuntu-26.04-arm
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base:3.21@sha256:995fc8a44059b3bac015603f63b56b1bf935c2227c5176823d9bb76b45fc2249
            runner: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      # No QEMU step. runs-on pins each arch to its native runner (an
      # unavailable arm64 runner leaves the job queued; it never moves to an amd64
      # host), and each build targets only its host's platform, so nothing here runs
      # a foreign-arch binary. docker/setup-qemu-action only registered binfmt
      # emulators, pulling tonistiigi/binfmt from Docker Hub on every job (4-11 s)
      # for no build that used them. server/test/workflowNativeBuild.test.ts fails if
      # a matrix entry pairs a platform with the other arch's runner, or if the step
      # returns.
      # v0.9.77 — bumped docker/* actions to Node-24 majors (v4 / v7). GitHub
      # is forcing Node 24 as the default runtime on June 2 2026 and removing
      # Node 20 entirely on Sep 16 2026; the previous @v3 / @v5 pins all ran
      # on Node 20 and were emitting deprecation warnings on every build.
      # No input-API changes for our usage — these majors are runtime upgrades
      # plus internal ESM refactors; build-push-action v6+ also writes a build
      # summary and uploads a build-record artifact by default (a failure there
      # is only a warning).
      # 2026-10-10 (v1.187.12) — the runner could not get a Docker Hub token. The binfmt
      # pull recovered on setup-qemu-action's own retry; setup-buildx-action v4.1.0
      # pulled moby/buildkit once, failed, and failed the amd64 job before it built,
      # so the release job was skipped. From v4.4.0 the action pre-pulls the BuildKit
      # image itself, up to five attempts with backoff on a transient registry error.
      # This step keeps one outer retry after a pause, for an outage longer than those
      # attempts; a second failure fails the job. The build step still resolves
      # docker/dockerfile and node:22-alpine from Docker Hub, without a retry.
      - id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        continue-on-error: true
      - if: steps.buildx.outcome == 'failure'
        run: sleep 30
      - if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner (GHCR requires it)
        id: owner
        run: |
          echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" \
            >> "$GITHUB_OUTPUT"

      # v1.113.0 — BUILD_DATE was `github.event.repository.updated_at`, a
      # REPOSITORY-metadata timestamp that does not advance per build: every
      # image carried whatever value the triggering event payload happened to
      # hold, so /api/version reported a builtAt that never moved and could not
      # be used to tell two images apart (the `ref` SHA was the only real
      # discriminator). Stamp the actual build instant instead.
      - name: Build timestamp
        id: stamp
        run: echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.arch }}-ecoflow-panel:${{ needs.resolve.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.arch }}-ecoflow-panel:latest
          build-args: |
            BUILD_FROM=${{ matrix.base }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_DATE=${{ steps.stamp.outputs.iso }}
            BUILD_DESCRIPTION=Time-of-use arbitrage planning, forecasting, battery analytics and life-safety alarms for an EcoFlow off-grid home (Smart Home Panel 2, Delta Pro Ultra); advisory by default, device writes opt-in
            BUILD_NAME=Power
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ needs.resolve.outputs.version }}
          # v0.9.37 — ignore-error=true so a flaky GHA cache backend doesn't
          # fail the build. Observed 2026-05-26 00:25-00:40 UTC: every push
          # failed with "error writing layer blob: failed to reserve cache"
          # blocking 3 consecutive releases (v0.9.35, v0.9.36, ...).
          cache-from: type=gha,scope=ecoflow-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ecoflow-${{ matrix.arch }},ignore-error=true

      # v0.9.48 — CodeNotary signing steps REMOVED. See build.yaml for
      # the postmortem. tl;dr: vcn OSS project is dead, HA Supervisor
      # rating ceiling for us is now ~7 (with v0.9.44 AppArmor profile).
      # The CN_USER + CN_PASSWORD secrets have since been deleted (the
      # repository has no Actions secrets as of v1.187.16).

  release:
    name: Cut GitHub Release
    needs: [resolve, build]
    runs-on: ubuntu-26.04
    # v1.187.3 — BOUNDED. With no timeout anywhere, one stalled apt mirror in the best-effort
    # 'Ensure pandoc' step ran this job into the platform's 6 h limit; the job was CANCELLED,
    # so the steps after it — including 'Create GitHub Release' — never ran (v1.187.1, run
    # 36901417471: apt-get update silent from 17:46:07Z to the 23:46:59Z cancel).
    # `continue-on-error` covers a step that FAILS, not one that hangs until the job dies.
    # Every step that can wait on the network now has its own bound, apt and the docs tools
    # are wrapped in `timeout` so a stall ends as an ordinary failure, and this job's bound
    # sits above the sum of its steps' bounds (6 + 5 + 10 + 5 + 10 = 36 min), so a docs step
    # that runs to its limit can never take the Release down with it. The images are already
    # pushed by `build` before this job starts; nothing here can hold them back. A normal run
    # takes ~2 min.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Skip if Release already exists
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ needs.resolve.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ needs.resolve.outputs.tag }} already exists; skipping create"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract notes from CHANGELOG.md
        if: steps.gate.outputs.skip != 'true'
        env:
          NEXT: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/notes.md
          import os, re
          version = os.environ["NEXT"]
          with open("ecoflow_panel/CHANGELOG.md") as f:
              content = f.read()
          # Match the "## <version> …" header through end of section (next "## " or EOF).
          #
          # The `v` prefix is OPTIONAL here and that is the whole point: this job
          # receives the bare version from config.yaml ("1.126.0") while the
          # CHANGELOG headers were written "## v1.126.0 — …" (bare "## 1.187.22"
          # since v1.187.22, which this matches too). The original pattern
          # required an exact match, so it never matched ANY release and every
          # GitHub Release since this workflow was written carried the
          # "_(see CHANGELOG.md)_" placeholder instead of its notes. Nothing
          # failed, so nothing surfaced it.
          pattern = re.compile(
              rf"^## v?{re.escape(version)}\b.*?(?=^## |\Z)",
              re.MULTILINE | re.DOTALL,
          )
          m = pattern.search(content)
          if m:
              # Strip the header line itself; print the body.
              body = m.group(0).split("\n", 1)[1].strip()
              print(body)
          else:
              # FAIL LOUDLY. A silent placeholder is how this went unnoticed for
              # every release to date: a missing CHANGELOG section is an authoring
              # mistake, and shipping a Release with no notes should not be the
              # quiet default.
              raise SystemExit(
                  f"::error::No CHANGELOG.md section found for {version} "
                  f"(expected a '## {version}' or '## v{version}' header). "
                  f"Add the section before releasing."
              )
          PY
          echo "── notes preview ────────────────────────────"
          cat /tmp/notes.md
          echo "─────────────────────────────────────────────"

      # Build the printable documentation (.docx) BEFORE creating the Release so it
      # can be attached AT creation. This repo has immutable Releases enabled, so
      # assets cannot be added after `gh release create` (HTTP 422) — the file is
      # therefore passed as a positional asset to `gh release create` below, not
      # uploaded in a later step. Same generator CI uses (scripts/build-docs-docx.py);
      # the document bundles README, the operator guide (DOCS.md, docs/guide/), SECURITY
      # and the engineering reference (docs/reference/); docs/history/ is not printed.
      #
      # Best-effort: gated on `!skip` (only when we actually create the Release) and
      # `hashFiles(script) != ''` (a workflow_dispatch re-run against an OLD tag that
      # predates this tooling has no script → skip cleanly), and `continue-on-error`
      # so a transient apt/pandoc hiccup can't turn a successful release RED. If the
      # build is skipped or fails, the Release is still created — just without the
      # document.
      # v1.187.3 — and BOUNDED, because continue-on-error does nothing for a step that
      # never ends: apt runs under `timeout` with its own connect/read timeouts and
      # retries (a stalled mirror becomes a failed step, which continue-on-error covers),
      # and every docs step carries timeout-minutes as the backstop (v1.187.0 timings:
      # pandoc 23 s, LibreOffice ~82 s).
      - name: Ensure pandoc
        if: ${{ steps.gate.outputs.skip != 'true' && hashFiles('scripts/build-docs-docx.py') != '' }}
        continue-on-error: true
        timeout-minutes: 6
        env:
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
        run: |
          command -v pandoc >/dev/null || {
            sudo timeout -k 10 120 apt-get $APT_OPTS update &&
            sudo timeout -k 10 180 apt-get $APT_OPTS install -y pandoc
          }
          pandoc --version | head -1

      - name: Build documentation .docx
        id: docx
        if: ${{ steps.gate.outputs.skip != 'true' && hashFiles('scripts/build-docs-docx.py') != '' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          V: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          timeout -k 10 240 python3 scripts/build-docs-docx.py \
            --version "$V" \
            --ref "$TAG" \
            --output "EcoFlow-Panel-Documentation-v${V}.docx"

      # Render the .docx to a .pdf (same document, no LaTeX) so every Release
      # carries both formats. Best-effort like the .docx: gated + continue-on-error
      # so a transient LibreOffice/apt hiccup can't turn a good release RED — the
      # PR's docs check is the hard gate that the PDF toolchain works.
      # v1.187.3 (review) — rendered only from a .docx whose build SUCCEEDED: a .docx
      # left by a killed build may be truncated, and so would be its PDF.
      - name: Ensure LibreOffice (docx → pdf)
        if: ${{ steps.gate.outputs.skip != 'true' && hashFiles('scripts/build-docs-docx.py') != '' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
        run: |
          command -v libreoffice >/dev/null || {
            sudo timeout -k 10 120 apt-get $APT_OPTS update &&
            sudo timeout -k 10 420 apt-get $APT_OPTS install -y --no-install-recommends libreoffice-writer
          }
          libreoffice --version | head -1

      - name: Build documentation .pdf
        id: pdf
        if: ${{ steps.gate.outputs.skip != 'true' && steps.docx.outcome == 'success' && hashFiles('scripts/build-docs-docx.py') != '' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          V: ${{ needs.resolve.outputs.version }}
        run: |
          timeout -k 10 240 libreoffice --headless -env:UserInstallation=file:///tmp/loprofile \
            --convert-to pdf --outdir . "EcoFlow-Panel-Documentation-v${V}.docx"
          test -s "EcoFlow-Panel-Documentation-v${V}.pdf"
          ls -la "EcoFlow-Panel-Documentation-v${V}.pdf"

      # Not best-effort: a Release that cannot be created is a red run. Bounded so a stalled
      # API call fails in minutes instead of holding the job (v1.187.3). Its `if` reads only
      # the gate, never a docs step's outcome, so a failed or timed-out docs step leaves it
      # running.
      - name: Create GitHub Release (with docs asset)
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.resolve.outputs.version }}
          # v1.187.3 (review) — each build step's own result, before continue-on-error
          # turns it green ('success', 'failure', 'cancelled' or 'skipped').
          DOCX_OUTCOME: ${{ steps.docx.outcome }}
          PDF_OUTCOME: ${{ steps.pdf.outcome }}
        run: |
          set -eo pipefail
          # Immutable Releases seal assets at creation — attach the docs here, not
          # in a later step. Include each format only if its build step SUCCEEDED
          # and left a NON-EMPTY file (-s, not -f). v1.187.3 (review) — the step's
          # outcome, not the file alone: since the docs steps are bounded, a
          # conversion killed by `timeout` or by its step bound can leave a
          # truncated .docx or .pdf behind, and a Release would seal it forever.
          assets=()
          doc="EcoFlow-Panel-Documentation-v${V}.docx"
          pdf="EcoFlow-Panel-Documentation-v${V}.pdf"
          if [ "$DOCX_OUTCOME" = success ] && [ -s "$doc" ]; then assets+=("$doc"); fi
          if [ "$PDF_OUTCOME" = success ] && [ -s "$pdf" ]; then assets+=("$pdf"); fi
          # Only the highest version is marked Latest: a re-run of an older version's
          # release (after a transient failure) must not demote a newer one — re-running
          # v1.187.12 on 2026-10-11 made it Latest over v1.187.14.
          tag="${{ needs.resolve.outputs.tag }}"
          # A lookup that fails leaves the choice to GitHub (the previous behaviour) rather
          # than failing the release. Only strict vX.Y.Z tags count, compared as numbers: `sort -V`
          # ranked a stray v1.2.3-rc1 above v1.2.3 and would have demoted the real release.
          highest=$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" 'v*' 2>/dev/null | python3 -c '
          import re, sys
          tags = [m.group(1) for l in sys.stdin if (m := re.search(r"refs/tags/(v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))$", l.strip()))]
          print(max(tags, key=lambda t: tuple(map(int, t[1:].split(".")))) if tags else "")
          ' || true)
          latestFlag=()
          if [ -n "$highest" ]; then
            if [ "$highest" = "$tag" ]; then latestFlag=(--latest=true); else latestFlag=(--latest=false); fi
          fi
          echo "highest tag: ${highest:-unknown}; flags for ${tag}: ${latestFlag[*]:-automatic}"
          gh release create "$tag" \
            --title "$tag" \
            --notes-file /tmp/notes.md \
            "${latestFlag[@]}" \
            "${assets[@]}"

      - name: Summary
        env:
          V: ${{ needs.resolve.outputs.version }}
        run: |
          {
            echo "## ✅ v${V} published"
            echo
            echo "Pre-built images:"
            echo
            echo "- \`ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/aarch64-ecoflow-panel:${V}\`"
            echo "- \`ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/amd64-ecoflow-panel:${V}\`"
            echo
            echo "In Home Assistant: **Settings → Add-ons → Add-on Store → ⋮ → Check for updates**,"
            echo "open **Power**, and click **Update**. A local-folder install (README steps 2–3)"
            echo "first needs \`git pull\` in \`/addons/ecoflow-panel\` to see the new version."
          } >> "$GITHUB_STEP_SUMMARY"
