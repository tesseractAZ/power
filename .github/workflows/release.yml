name: Release

# One-click release pipeline (ruleset-compatible), but NOT the path releases
# take: README's release pipeline is a hand-made "Release vX.Y.Z …" PR, and this
# workflow last ran for v0.15.3 (PR #20, 2026-06-09). A PR opened here with
# GITHUB_TOKEN does not trigger ci.yml or codeql.yml (PR #20 carried only the
# default-setup CodeQL checks), so main's required status checks would never
# report on it and auto-merge could not fire; it would need an admin merge.
#
# Trigger from GitHub: Actions → Release → "Run workflow". The workflow:
#   1. Computes the next version (semver bump or explicit override), bumping from
#      the higher of config.yaml's version and the highest vX.Y.Z tag
#   2. Refuses if the new tag already exists or the version is not above both, so
#      re-runs are idempotent
#   3. Builds release notes (from your `notes` input, or auto-generated from the
#      commit log since the previous tag)
#   4. Bumps `version:` in `ecoflow_panel/config.yaml` and prepends a CHANGELOG section
#   5. Runs scripts/check-release-pr.py against main (CI will not run on the PR)
#   6. Opens a `release/vX.Y.Z` PR and enables auto-merge
#
# The `main` branch is protected by the `BranchAuth` ruleset (PR + verified
# signatures + CodeQL), so this workflow can't push to main directly — it goes
# through a PR. The squash-merge commit is GitHub-signed, satisfying the rules.
# Once the PR merges, `tag-release.yml` (which runs on every push to main) creates
# the tag and `images.yml` builds + publishes the GHCR images and cuts the GitHub
# Release.
#
# Home Assistant (the add-on repository) reads the bumped `version:` from
# `config.yaml` on main and surfaces a native Update button once the image is up.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (used when 'version' is empty)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Explicit version, e.g. 0.2.0 — overrides 'bump'"
        type: string
        required: false
      notes:
        description: "Release notes (markdown). Leave empty to auto-generate from the commit log."
        type: string
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write   # open + auto-merge the release PR

jobs:
  release:
    name: Cut release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute next version
        id: ver
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          # The first top-level `version:` line, quoted or not (as tag-release.yml reads it).
          current=$(sed -nE "s/^version:[[:space:]]*[\"']?([^\"'#[:space:]]+)[\"']?.*/\1/p" ecoflow_panel/config.yaml | head -n1)
          if [[ ! "$current" =~ $SEMVER ]]; then
            echo "::error::Could not parse current version from config.yaml (got '$current')"
            exit 1
          fi
          # gt A B: A is above B (both strict X.Y.Z).
          gt() {
            local IFS=. i; local -a a b; a=($1); b=($2)
            for i in 0 1 2; do
              if (( a[i] > b[i] )); then return 0; fi
              if (( a[i] < b[i] )); then return 1; fi
            done
            return 1
          }
          # The floor is the higher of config.yaml and the highest strict vX.Y.Z tag: a tag can
          # sit above main's version (one made off main), and a Release tag cannot be reused.
          # tag-release.yml refuses to tag a version that is not above every tag.
          floor=$current
          while read -r t; do
            x=${t#v}
            [[ "$x" =~ $SEMVER ]] || continue
            if gt "$x" "$floor"; then floor=$x; fi
          done < <(git tag -l 'v*')

          if [[ -n "$EXPLICIT" ]]; then
            next="$EXPLICIT"
          else
            IFS='.' read -r maj min pat <<< "$floor"
            case "$BUMP" in
              major) next="$((maj + 1)).0.0" ;;
              minor) next="${maj}.$((min + 1)).0" ;;
              patch) next="${maj}.${min}.$((pat + 1))" ;;
              *) echo "::error::Unknown bump '${BUMP}'"; exit 1 ;;
            esac
          fi

          if [[ ! "$next" =~ $SEMVER ]]; then
            echo "::error::Invalid next version '$next' (expected X.Y.Z, no leading zeros)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${next}" >/dev/null 2>&1; then
            echo "::error::Tag v${next} already exists"
            exit 1
          fi
          if ! gt "$next" "$floor"; then
            echo "::error::v${next} is not above v${floor} (config.yaml ${current} or the highest tag)"
            exit 1
          fi

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "📦 Releasing v${current} → v${next}"

      - name: Build release notes
        id: notes
        env:
          USER_NOTES: ${{ inputs.notes }}
          PREV: ${{ steps.ver.outputs.current }}
        run: |
          set -euo pipefail
          notes_file=$(mktemp)
          if [[ -n "${USER_NOTES}" ]]; then
            printf '%s\n' "${USER_NOTES}" > "${notes_file}"
          else
            prev_tag="v${PREV}"
            if git rev-parse -q --verify "refs/tags/${prev_tag}" >/dev/null 2>&1; then
              {
                echo "Changes since ${prev_tag}:"
                echo
                git log --no-merges --pretty='- %s' "${prev_tag}..HEAD"
              } > "${notes_file}"
            else
              echo "_(see commit history for details — no previous tag found at ${prev_tag})_" > "${notes_file}"
            fi
          fi
          echo "notes_file=${notes_file}" >> "$GITHUB_OUTPUT"
          echo "── notes preview ────────────────────────────"
          cat "${notes_file}"
          echo "─────────────────────────────────────────────"

      - name: Update config.yaml + CHANGELOG.md
        env:
          NEXT: ${{ steps.ver.outputs.next }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          set -euo pipefail
          # config.yaml: replace the version: line
          sed -i.bak -E 's/^version:[[:space:]]*"?[^"#]+"?/version: "'"$NEXT"'"/' ecoflow_panel/config.yaml
          rm -f ecoflow_panel/config.yaml.bak

          # CHANGELOG.md: prepend a new section before the most recent version section
          python3 - <<'PY'
          import os, re, datetime
          version = os.environ["NEXT"]
          today = datetime.datetime.utcnow().strftime("%Y-%m-%d")
          with open(os.environ["NOTES_FILE"]) as f:
              notes = f.read().strip() or "_(see commit history for details)_"

          with open("ecoflow_panel/CHANGELOG.md", "r") as f:
              content = f.read()
          new_section = f"## {version} — {today}\n\n{notes}\n\n"
          m = re.search(r"^## \d", content, re.MULTILINE)
          if m:
              content = content[:m.start()] + new_section + content[m.start():]
          else:
              content = content.rstrip() + "\n\n" + new_section
          with open("ecoflow_panel/CHANGELOG.md", "w") as f:
              f.write(content)
          PY

          echo "── config.yaml version line ─────────────────"
          grep '^version:' ecoflow_panel/config.yaml
          echo "── CHANGELOG.md head ────────────────────────"
          head -25 ecoflow_panel/CHANGELOG.md
          echo "─────────────────────────────────────────────"

      # The `main` branch is governed by the `BranchAuth` ruleset, which forbids
      # a direct push from github-actions[bot] (requires a PR + verified
      # signatures + CodeQL). So instead of pushing the bump straight to main,
      # we open a PR from a release branch and let it auto-merge. The branch
      # commit below is unsigned, but that is fine: it never lands on main
      # directly — the SQUASH-merge commit is authored by GitHub's web-flow key
      # (signature-verified), which satisfies the `required_signatures` rule.
      # Tagging + the image build happen post-merge in `tag-release.yml`, which runs on
      # every push to main and tags the version config.yaml declares there.
      - name: Open release PR (auto-merge)
        env:
          NEXT: ${{ steps.ver.outputs.next }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="release/v${NEXT}"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add ecoflow_panel/config.yaml ecoflow_panel/CHANGELOG.md
          git commit -m "Release v${NEXT}"
          # CI does not run on a PR opened with GITHUB_TOKEN, so the release-PR check runs here,
          # against main, before the branch is pushed.
          BASE_REV=origin/main PR_TITLE="Release v${NEXT}" python3 scripts/check-release-pr.py
          git push --force-with-lease origin "$branch"

          body_file="$(mktemp)"
          {
            echo "Automated release of **v${NEXT}** — bumps \`ecoflow_panel/config.yaml\` and prepends the CHANGELOG."
            echo
            echo "Merging this (squash) lands a GitHub-signed commit on \`main\`, which satisfies the \`BranchAuth\` ruleset. On merge, **\`tag-release.yml\`** tags \`v${NEXT}\` and triggers **\`images.yml\`** to build/publish the GHCR images and cut the GitHub Release."
            echo
            echo "---"
            echo
            echo "### Release notes"
            echo
            cat "${NOTES_FILE}"
          } > "$body_file"

          pr_url="$(gh pr create --base main --head "$branch" \
            --title "Release v${NEXT}" --body-file "$body_file")"
          echo "Opened ${pr_url}"

          # Auto-merge lands it as soon as required checks (and any required
          # review) pass. Degrade gracefully if repo auto-merge is disabled —
          # the PR can still be merged by hand.
          if gh pr merge "$pr_url" --squash --auto --delete-branch; then
            echo "auto_merge=enabled" >> "$GITHUB_OUTPUT" || true
          else
            echo "::notice::Auto-merge could not be enabled — merge ${pr_url} manually to finish the release."
          fi
          echo "PR_URL=${pr_url}" >> "$GITHUB_ENV"

      - name: Summary
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          {
            echo "## 🚀 Release v${NEXT} prepared"
            echo
            echo "A release PR was opened with **auto-merge** enabled: ${PR_URL:-(see PR list)}"
            echo
            echo "What happens next, automatically:"
            echo
            echo "1. The PR merges (as a signature-verified squash commit) once required checks — and any required review — pass."
            echo "2. **\`tag-release.yml\`** runs on the merge (it runs on every push to \`main\`): it tags \`v${NEXT}\` and dispatches **\`images.yml\`**."
            echo "3. **\`images.yml\`** builds + publishes the amd64 + aarch64 GHCR images and creates the GitHub Release for v${NEXT}."
            echo
            echo "**The Release appearing on GitHub is the \"go ahead and update\" signal.** Then in Home Assistant:"
            echo
            echo "**Settings → Add-ons → Add-on Store → ⋮ → Check for updates**, open **Power**, and click **Update**."
            echo
            echo "> If auto-merge is disabled on the repo, just click **Merge** on the PR above — steps 2–3 still run automatically."
          } >> "$GITHUB_STEP_SUMMARY"
