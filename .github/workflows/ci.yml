name: CI

# Every push to main and every PR: three type-checks (server, web, server
# tests), the server suite and its README-claim check, the mutant-anchor,
# personal-data, dependency-advisory and add-on-config checks, a Dockerfile
# smoke build and the docs build. Cheap insurance that no broken commit lands
# on main and gets installed onto the Pi. The release-PR version check is in
# release-pr.yml, so a title edit re-runs it without re-running all of CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: every job only reads the repo (checkout). The Buildx GHA
# cache and upload-artifact use the runtime token, not GITHUB_TOKEN, so no
# extra scopes are needed.
permissions:
  contents: read

jobs:
  typecheck:
    name: Type-check ${{ matrix.project }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        project: [server, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: tsc --noEmit
        working-directory: ${{ matrix.project }}
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.json

  typecheck-server-tests:
    # server/tsconfig.json includes ONLY src/**/*.ts — correct, because it drives
    # `outDir: dist` and test/ must never be emitted. The side effect was that
    # NOTHING type-checked the 188 test files: tsx strips types at runtime, so the
    # suite could go green while its stubs drifted arbitrarily far from the
    # interfaces they impersonate. It had: every hand-rolled Recorder stub was 10
    # required members behind, hidden by `… as unknown as Recorder`, and ~10
    # fixtures were missing fields their production types had gained.
    #
    # tsconfig.test.json is check-only (noEmit) and covers src + test under the
    # same strict options. This job is what keeps that from rotting again.
    name: Type-check server tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci

      - name: tsc --noEmit (src + test)
        working-directory: server
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.test.json

  mutant-anchors:
    # The committed scripts/mutate-*.mjs harnesses pin their mutants to literal
    # source strings and ABORT when one stops matching. That abort is loud, but
    # nothing runs the harnesses, so nobody sees it: mutate-pool-membership was
    # dead from v1.117.0 to v1.129.0, and mutate-session-self-heal and
    # mutate-telemetry-blind were dead too. An aborted harness reads exactly like
    # a clean one. Running the harnesses in CI is too slow (each replays the full
    # suite once per mutant); checking that their anchors still RESOLVE is nearly
    # free and catches the whole failure mode.
    name: Mutant anchors resolve
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      - name: Every mutant anchor still matches exactly one source site
        run: node scripts/check-mutant-anchors.mjs

  server-tests:
    name: Server tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci

      # v1.58.0 — the suite previously ran ONLY in images.yml, post-tag, so a
      # behavioural regression reached main green and was caught (if at all) after
      # the release was cut. This is a life-safety alarm path; the suite now gates
      # the pull request ("Server tests" is a required check on main). It is the
      # slowest job here, a few minutes on a GitHub-hosted runner (v1.187.16:
      # 4,115 tests; the test step took 124–150 s across 12 green runs).
      #
      # The pass count is captured here rather than recounted later: it is the one
      # README claim that cannot be derived statically (a scan of test()/it()
      # registrations undercounts the loop-generated ones), so the job that
      # actually ran the suite is the only honest source for it.
      - name: npm test
        id: tests
        working-directory: server
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-output.txt
          count=$(grep -oE '^[^0-9]*pass ([0-9]+)' /tmp/test-output.txt | grep -oE '[0-9]+' | tail -1)
          if [ -z "$count" ]; then
            echo "::error::could not parse a 'pass N' line from the test output" >&2
            exit 1
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "parsed pass count: $count"

      # v1.149.0 — every counted claim in README.md had silently rotted (tests,
      # harnesses, anchors, manual length, the workflow roster, and a paragraph
      # asserting GitHub's alert endpoints return empty — true when written, false
      # once the repository went public). None of them failed anything, because a
      # number in prose has no mechanism holding it to the tree. This is that
      # mechanism. It has no skip path: a claim it cannot evaluate is a failure.
      - name: README claims still match the tree
        run: node scripts/check-doc-claims.mjs --tests ${{ steps.tests.outputs.count }}

  no-secrets:
    name: No personal data in the tree
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan tracked files for home addresses / personal identifiers
        run: python3 scripts/check-no-secrets.py

  npm-audit:
    name: Dependency advisories
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # v1.133.3 — written when /dependabot/alerts and /code-scanning/alerts both
      # returned empty on this repository, so the only security signal was a
      # Dependabot VERSION pr that happened to carry a fix (fastify's four GHSA
      # advisories arrived that way in v1.133.2). The repository is public now
      # and both endpoints return real data; the gate stays because a Dependabot
      # alert blocks nothing, and an advisory with no fixed version never gets a
      # PR at all. This job fails the build on a high or critical advisory in a
      # production tree (server, web), fails on an expired waiver, and runs on
      # every PR.
      #
      # The script self-tests its own policy before auditing, because a clean
      # `npm audit` is indistinguishable from a broken gate unless the gate has
      # been shown to fire.
      - name: Advisories in dependency trees
        run: node scripts/check-npm-audit.mjs

  addon-config:
    name: Validate add-on config + translations
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PyYAML
        run: python3 -m pip install --no-cache-dir pyyaml

      # HA renders the Configuration page's labels and help text from
      # translations/en.yaml. When that file fails to parse, HA silently shows
      # the page with NO descriptions at all and logs nothing an operator would
      # notice — it stayed broken for a week before it was spotted by eye.
      # Nothing else in CI parses this file: tsc doesn't, the test suite doesn't,
      # and the Dockerfile smoke build only copies it.
      - name: Validate
        run: python3 scripts/validate-addon-config.py

  docker-smoke:
    # Build the Home Assistant add-on container (amd64 only) on every push/PR.
    # Catches Dockerfile regressions before they reach the Pi. Buildx cache
    # in GitHub Actions cache keeps a run to about a minute or less (29–65 s
    # across v1.187.14–16 and the dependency merges after them).
    name: Dockerfile smoke build (amd64)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          # v1.7.0 (security #6, CWE-1357) — digest-pinned; keep in lockstep
          # with images.yml amd64 base.
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.21@sha256:995fc8a44059b3bac015603f63b56b1bf935c2227c5176823d9bb76b45fc2249
            BUILD_ARCH=amd64
            BUILD_DATE=ci
            BUILD_DESCRIPTION=Power (smoke)
            BUILD_NAME=Power
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=ci
          # v0.9.37 — ignore-error=true so a flaky GHA cache doesn't fail the smoke build.
          cache-from: type=gha,scope=docker-smoke
          cache-to: type=gha,mode=max,scope=docker-smoke,ignore-error=true

  docs-docx:
    # Assemble README, the operator guide (DOCS.md, docs/guide/), SECURITY and the
    # engineering reference (docs/reference/, in manifest order) into the printable
    # .docx on every push/PR. Purpose is twofold: (1) catch documentation that no
    # longer converts cleanly, or a link that no longer resolves, BEFORE it reaches
    # a release, and (2) publish a downloadable
    # preview artifact so reviewers can read the offline manual for the branch.
    # The same generator (scripts/build-docs-docx.py) attaches the .docx to the
    # GitHub Release in images.yml, so this job keeps that path exercised.
    name: Build documentation (.docx + .pdf)
    runs-on: ubuntu-26.04
    # v1.187.3 — bounded, as images.yml's release job: the same unbounded apt-get stalled a
    # release run for the 6 h platform limit. On the PR this job is a hard gate, so a stall
    # now ends as a red check in minutes rather than a check held for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure pandoc
        timeout-minutes: 6
        env:
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
        run: |
          command -v pandoc >/dev/null || {
            sudo timeout -k 10 120 apt-get $APT_OPTS update &&
            sudo timeout -k 10 180 apt-get $APT_OPTS install -y pandoc
          }
          pandoc --version | head -1

      - name: Build .docx
        timeout-minutes: 5
        run: |
          timeout -k 10 240 python3 scripts/build-docs-docx.py \
            --ref "${GITHUB_SHA:0:7}" \
            --output "EcoFlow-Panel-Documentation.docx"

      # A PDF alongside the .docx — a faithful render of the SAME document (same
      # generated TOC + page breaks) via LibreOffice headless (no LaTeX). On the
      # PR this is a HARD gate (if-no-files-found: error below): a documentation or
      # toolchain change that can't produce a PDF fails the check rather than
      # silently shipping a release without one.
      - name: Ensure LibreOffice (docx → pdf)
        timeout-minutes: 10
        env:
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
        run: |
          command -v libreoffice >/dev/null || {
            sudo timeout -k 10 120 apt-get $APT_OPTS update &&
            sudo timeout -k 10 420 apt-get $APT_OPTS install -y --no-install-recommends libreoffice-writer
          }
          libreoffice --version | head -1

      - name: Build .pdf (render the .docx)
        timeout-minutes: 5
        run: |
          timeout -k 10 240 libreoffice --headless -env:UserInstallation=file:///tmp/loprofile \
            --convert-to pdf --outdir . "EcoFlow-Panel-Documentation.docx"
          test -s EcoFlow-Panel-Documentation.pdf
          ls -la EcoFlow-Panel-Documentation.pdf

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: |
            EcoFlow-Panel-Documentation.docx
            EcoFlow-Panel-Documentation.pdf
          if-no-files-found: error
