name: Images trial on ubuntu-26.04 (do not merge)

# Throwaway readiness check: images.yml's native per-arch build, on the Ubuntu 26.04
# runner images, with push off. images.yml itself runs only on a release tag.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Trial build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base:3.21@sha256:5100b3a2e4741440e7bd587c124920fa3bf02287c4de3cb48aacef7049530ee1
            runner: ubuntu-26.04-arm
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base:3.21@sha256:995fc8a44059b3bac015603f63b56b1bf935c2227c5176823d9bb76b45fc2249
            runner: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Runner image
        run: |
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          docker version --format 'docker {{.Server.Version}}'
          docker info --format 'storage {{.Driver}} / {{.DriverStatus}}' || true

      - id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        continue-on-error: true
      - if: steps.buildx.outcome == 'failure'
        run: sleep 30
      - if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: false
          provenance: false
          build-args: |
            BUILD_FROM=${{ matrix.base }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_DATE=trial
            BUILD_DESCRIPTION=Power (26.04 trial)
            BUILD_NAME=Power
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=0.0.0
          cache-from: type=gha,scope=ecoflow-${{ matrix.arch }}
