# Etiquetas y ayuda en línea de la página de Configuración del complemento Power.
# Home Assistant muestra `name` como etiqueta del campo y `description` como el texto
# de ayuda debajo. Las claves DEBEN coincidir exactamente con las opciones de
# config.yaml (un error tipográfico hace que se muestre la CLAVE en crudo, sin aviso).
#
# Español neutro de América Latina. Los nombres de producto se conservan en inglés
# (EcoFlow, Home Assistant, Smart Home Panel 2, Music Assistant, Wyoming, Piper, Core),
# igual que los identificadores de entidades y los valores literales de configuración.
configuration:
  ECOFLOW_ACCESS_KEY:
    name: Clave de acceso de EcoFlow
    description: 'Clave de acceso IoT del portal para desarrolladores de EcoFlow (developer.ecoflow.com), que se usa junto con la clave secreta de abajo. Es obligatoria: si cualquiera de las dos está vacía, el add-on registra un error fatal y termina en lugar de arrancar, así que no consulta ningún equipo ni puede disparar ninguna alarma. Se enmascara al escribirla y nunca se vuelve a mostrar.'
  ECOFLOW_SECRET_KEY:
    name: Clave secreta de EcoFlow
    description: 'La mitad secreta de su par de claves de desarrollador de EcoFlow; se usa como clave de firma HMAC-SHA256 en cada solicitud a la nube de EcoFlow (la clave en sí nunca se envía). Es obligatoria: si la deja en blanco, el add-on registra un error fatal y no arranca. Cópiela del portal de desarrolladores de EcoFlow junto con la Access Key de arriba y trátela como una contraseña.'
  ECOFLOW_API_HOST:
    name: Host de la API de EcoFlow
    description: URL base de la API en la nube de EcoFlow. Todas las consultas REST van a este host, y de él se obtienen también la dirección y las credenciales del broker MQTT, así que este único valor define con qué región habla el add-on. Deje el valor predeterminado https://api-a.ecoflow.com salvo que el inicio de sesión falle con un error 401; en ese caso pruebe https://api-e.ecoflow.com (Europa) o https://api-us.ecoflow.com (Estados Unidos). Debe ser una URL completa que incluya https://.
  LOG_LEVEL:
    name: Nivel de registro
    description: Nivel de detalle del registro del add-on (Fastify/pino). info es el valor predeterminado y el adecuado para la operación normal; debug o trace restauran además las líneas de cada sondeo y el latido por minuto del grabador, útiles para diagnosticar pero que hacen crecer el registro rápidamente. warn, error o fatal reducen la salida rutinaria, mientras que las fallas, los huecos de telemetría y las anomalías se siguen registrando en sus propios niveles.
  FORECAST_LAT:
    name: Latitud del sitio
    description: Latitud del lugar de instalación en grados decimales, positiva hacia el norte; el valor predeterminado 33.4484 es un marcador de posición (Phoenix, AZ); sustitúyalo por el de su sitio. Determina de dónde se descarga el pronóstico de radiación solar, dónde se distingue el día de la noche mientras un Core está fuera de línea y su producción solar se cuenta en el panel y, si activa las alertas de tormenta del NWS, qué zona se vigila para los avisos meteorológicos. Un valor equivocado degrada en silencio todas las predicciones solares, porque la autonomía, la carga nocturna y el aviso de precarga por tormenta se apoyan en ese pronóstico. Con Usar la ubicación de Home Assistant activado, la ubicación de la casa en Home Assistant sustituye a este valor y a Longitud del sitio desde el arranque siguiente a su lectura.
  FORECAST_LON:
    name: Longitud del sitio
    description: Longitud del sitio de instalación en grados decimales, positivo al este y negativo al oeste; el predeterminado -112.074 es un marcador de posición (Phoenix, AZ). Es el punto que se envía a Open-Meteo para el pronóstico solar del clima y, si NWS Storm Alerts está activo, a weather.gov para las alertas de tormenta y la nubosidad. Un valor equivocado degrada en silencio todos los pronósticos solares —las cifras siguen pareciendo razonables—, así que verifíquelo contra su dirección real.
  NOTIFY_CHANNEL:
    name: Canal de notificaciones
    description: 'Activa o desactiva las notificaciones de Home Assistant: none (por defecto) o ha. ''ha'' hace dos cosas: mantiene una tarjeta en el cajón de notificaciones de HA por cada condición activa (y la retira cuando la condición se despeja) y, si indica uno o más destinos en Destinos de envío push, envía además un push real a la app companion de Home Assistant. Sin destinos solo obtiene la tarjeta del cajón, que la app muestra únicamente al abrirla: sin aviso en la pantalla de bloqueo y sin sonido. Configure los destinos si quiere que las alertas le lleguen cuando esté fuera de casa o dormido. Dejarlo en none también implica que, si Night-Charge Write Mode está en supervised o auto, la escritura nocturna de la reserva solo puede armarse cuando el aviso hablado llega a los altavoces.'
  NOTIFY_MIN_SEVERITY:
    name: Severidad mínima para notificar
    description: 'Severidad mínima que debe tener una alerta para generar una notificación push: warning (predeterminado) envía advertencias y críticas; critical envía solo las críticas, de modo que los problemas de nivel advertencia nunca llegarán a su teléfono. Tenga en cuenta que solo las alertas CRÍTICAS rompen No molestar (véase Las alertas críticas rompen No molestar); las advertencias llegan siempre como notificaciones normales. Aplica únicamente al canal de notificaciones push; el aviso audible tiene su propio Broadcast Minimum Severity. El aviso nocturno del plan de carga se envía siempre, sin importar este ajuste.'
  NOTIFY_RESOLVED:
    name: Avisar al resolverse
    description: Envía además una notificación 'Resolved:' cuando una alerta se despeja, para que reciba el aviso de normalidad y no solo la alarma. Viene activado; desactívelo para recibir únicamente los avisos de disparo. El aviso de resolución solo se envía para las alertas que de verdad notificaron al dispararse — una silenciada por las horas de silencio o por Notify Minimum Severity nunca lo recibe — y no se envía nada mientras Notify Channel esté en none.
  NOTIFY_HA_PUSH_TARGETS:
    name: Destinos de envío push
    description: 'Servicios notify de Home Assistant que reciben el push, separados por comas y con o sin el prefijo ''notify.'' — por ejemplo ''notify.mobile_app_iphone'' o ''mobile_app_iphone, mobile_app_ipad''. Use ''notify.notify'' para llegar a la vez a todos los dispositivos con la app companion registrada, que es la opción prudente para una alarma. Encuentre los nombres exactos en Herramientas para desarrolladores y luego Acciones, filtrando por ''notify''. Si lo deja vacío no se envía ningún push: las alertas aparecen solo como una tarjeta en el cajón de notificaciones de HA, que la app muestra al abrirla, sin aviso en la pantalla de bloqueo y sin sonido.'
  NOTIFY_CRITICAL_BYPASS_DND:
    name: Las alertas críticas rompen No molestar
    description: 'Activado (por defecto), una alerta CRÍTICA —y solo una crítica— lleva la carga útil de notificación crítica de la app companion, de modo que suena en su teléfono incluso con No molestar, Concentración o el interruptor de silencio activados. Las advertencias y los avisos nunca lo hacen: llegan como notificaciones normales que respetan los ajustes del teléfono. Esa asimetría es deliberada: una advertencia que se comporta como una emergencia enseña a silenciar el canal que transporta las emergencias. Desactívelo si prefiere que una emergencia real de batería, de reserva o de corte de red espere hasta que mire el teléfono. Es independiente de Broadcast Quiet Hours, que solo rige los altavoces de la casa.'
  NOTIFY_QUIET_HOURS:
    name: Horario de silencio para notificaciones
    description: Ventana en hora local durante la cual las notificaciones se retienen y se agrupan en el resumen matutino (7 a.m. de forma predeterminada) en lugar de sonar durante la noche; las alertas siguen apareciendo en pantalla de inmediato. El formato es HH-HH en 24 horas, por ejemplo 22-06 para 10 p.m. a 6 a.m. (predeterminado); puede cruzar la medianoche, y un valor vacío, con formato inválido o con la misma hora de inicio y fin desactiva la ventana por completo. Las alertas críticas también se retienen salvo que active Critical Alarms Break Quiet Hours, así que de forma predeterminada nada lo despertará; el anuncio por altavoz tiene su propia ventana aparte (Broadcast Quiet Hours).
  NOTIFY_DIGEST_HOUR:
    name: Hora del resumen matutino
    description: 'Hora local, de 0 a 23, a la que las alertas retenidas durante las horas de silencio de notificaciones se entregan como un solo resumen matutino, de la más grave a la menos grave. El valor predeterminado 7 equivale a las 7 AM. Solo aplica si hay un canal de notificación configurado: sin canal, las alertas retenidas quedan únicamente en el registro del complemento y la cola se descarta en lugar de entregarse más tarde.'
  BROADCAST_ENABLED:
    name: Activar anuncios audibles
    description: 'Interruptor principal de los anuncios hablados y los tonos de alarma en sus altavoces media_player de Home Assistant (HomePod, Sonos, ecobee). Desactivado de forma predeterminada, y no hace nada hasta que además indique al menos un altavoz en Altavoces de destino; las notificaciones push son independientes y no se ven afectadas. Advertencia: el interruptor en vivo del panel es una anulación guardada que tiene prioridad sobre esta opción y se conserva tras reiniciar; si ambos no coinciden manda el panel, así que las alarmas pueden quedar en silencio aunque aquí esté activado.'
  BROADCAST_TARGETS:
    name: Bocinas de destino para los avisos
    description: 'Lista separada por comas de entity IDs media_player de Home Assistant en los que suenan las alarmas habladas, a través de Music Assistant; por ejemplo media_player.living_room, media_player.kitchen. Las entradas que no empiecen con ''media_player.'' se descartan sin aviso, y si se deja vacío (el valor predeterminado) ninguna alarma se habla, aunque los avisos estén activados: los destinos SIP no reemplazan a esta lista, solo se suman a ella. Revise esta lista después de renombrar una bocina en Home Assistant: un entity ID obsoleto sigue contando como configurado y las alarmas se pierden en silencio, aunque el registro del add-on nombra el ID que cambió poco después de arrancar.'
  BROADCAST_SIP_TARGETS:
    name: Destinos SIP / intercomunicador para anuncios
    description: Lista de entity IDs de media_player, separados por comas, que reciben las alarmas mediante media_player.play_media(announce) en lugar de Music Assistant — para puntos SIP o de intercomunicador que Music Assistant no puede controlar, como un teléfono SIP o un intercomunicador expuesto como media player (por ejemplo media_player.intercom). Reciben el mismo audio hablado y se despachan antes de la verificación de disponibilidad de Music Assistant, así que suenan aunque los altavoces de Music Assistant no estén disponibles. Cada entrada debe empezar con 'media_player.'; una entidad que también figure en Broadcast Target Speakers se descarta aquí (Music Assistant tiene prioridad) para que nada se anuncie dos veces, y debe haber al menos un Broadcast Target Speaker configurado o no se ejecuta ningún anuncio.
  BROADCAST_MIN_SEVERITY:
    name: Severidad mínima para difundir
    description: Determina si el anuncio general de la condición de la flota también se emite en nivel amarillo (advertencia). Con 'critical' (por defecto) solo se habla la condición roja; con 'warning' también la amarilla. No controla las alarmas dedicadas — la escalera de SoC, la alarma de autonomía y los avisos de carga nocturna se anuncian igual — y es independiente de Notify Minimum Severity, que rige las notificaciones push.
  BROADCAST_QUIET_HOURS:
    name: Horas de silencio de los avisos por voz
    description: 'Ventana nocturna en la que los altavoces permanecen en silencio; se escribe en horas locales enteras con el formato ''HH-HH'' en reloj de 24 horas y puede cruzar la medianoche, así que el valor predeterminado 22-06 silencia desde las 10 PM hasta las 5:59 AM; déjelo vacío para no tener ventana de silencio. De forma predeterminada silencia TODOS los niveles, incluidas las alarmas críticas: solo se retiene el anuncio hablado, la alerta sigue apareciendo de inmediato en pantalla. Active más abajo la opción para que las alarmas críticas rompan las horas de silencio si quiere que las de nivel alto y crítico suenen durante la noche.'
  CRITICAL_BREAKS_QUIET_HOURS:
    name: Las alarmas críticas rompen las horas de silencio
    description: 'Define si las alarmas más graves pueden sonar y enviarse durante las horas de silencio. Está desactivado de forma predeterminada, así que todos los niveles se retienen durante la noche: la alerta aparece en pantalla de inmediato y la notificación llega en el resumen de la mañana, pero el anuncio hablado se descarta por completo y no se repone más tarde. Actívelo si desea que lo despierten ante una emergencia real: en el canal de notificaciones libera las alertas críticas durante Notify Quiet Hours, y en el canal audible libera las alarmas de condición roja y las de prioridad alta o crítica durante Broadcast Quiet Hours.'
  BROADCAST_AUDIO_BASE:
    name: URL base de audio para los altavoces
    description: Direccion desde la cual sus altavoces descargan los archivos WAV de los avisos que genera el add-on; debe resolverse desde los altavoces, no solo desde su navegador. El valor predeterminado http://homeassistant.local:8787 depende de mDNS, asi que si los avisos quedan en silencio aunque el registro diga que se enviaron, ponga aqui la IP del host de Home Assistant, por ejemplo http://192.168.1.50:8787. Se recorta la barra final y un valor vacio vuelve al valor mDNS predeterminado.
  BROADCAST_VOLUME:
    name: Volumen de transmisión
    description: 'Nivel de los altavoces para los anuncios de alarma audibles, de 0.0 (silencio) a 1.0 (máximo); predeterminado 0.5. Es el único lugar donde se fija el nivel — la consola de alertas ya no tiene control deslizante, así que el formulario y lo que realmente suena nunca pueden discrepar — y el cambio se aplica al reiniciar el complemento. La opción Announce Volume Override, más abajo, tiene prioridad: cualquier valor que escriba allí fija el nivel del anuncio y deja este solo como referencia.'
  BROADCAST_ANNOUNCE_VOLUME:
    name: Anulación del volumen del anuncio
    description: 'Define qué tan fuerte suena el anuncio hablado. Déjelo vacío (predeterminado) para reproducir a Broadcast Volume x 100; escriba de 0 a 100 para fijar ese nivel exacto; o escriba off, none o standing para no enviar ningún comando de volumen y dejar que cada bocina use su nivel actual (más confiable en bocinas ecobee y AirPlay). Un número aquí también ajusta el volumen propio de cada bocina antes de reproducir y no lo restaura después, así que escribir 0 deja mudas las bocinas de la alarma: nunca lo use para silenciar.'
  BROADCAST_USE_PRE_ANNOUNCE:
    name: Usar tono previo al anuncio
    description: Reproduce el breve tono de aviso de Music Assistant antes del mensaje hablado, lo que despierta a un altavoz ecobee o AirPlay dormido para que no corte las primeras palabras. Desactivado de forma predeterminada; agrega la duración del tono al inicio de cada mensaje y solo aplica a los altavoces de Music Assistant, no a los destinos SIP o de intercomunicador.
  BROADCAST_LEAD_SILENCE_MS:
    name: Silencio inicial de la transmisión (ms)
    description: Milisegundos de silencio que se reproducen antes de cada alarma audible para que los altavoces lentos (sobre todo AirPlay y ecobee) alcancen a conectarse antes de que empiece el tono y no le corten la primera nota. Predeterminado 1000; rango de 0 a 5000. Suba a 1500 si el inicio sigue llegando cortado; con 0 se elimina el relleno y también la demora, a costa de que los altavoces lentos corten el comienzo.
  BROADCAST_REPEAT:
    name: Cantidad de repeticiones del anuncio
    description: Cuántas veces se reproduce el bloque completo de campanada más mensaje en cada anuncio, para que un primer pase que no se alcanzó a oír tenga un segundo. De 1 a 3, predeterminado 2; el silencio entre pases se define en Broadcast Repeat Gap. Se ignora en los anuncios bilingües, donde el par inglés-español ya cumple la función de repetición.
  BROADCAST_REPEAT_GAP_MS:
    name: Pausa entre bloques del aviso (ms)
    description: 'Silencio que se inserta entre los bloques de un aviso para que la repeticion, o la pasada en espanol cuando los avisos bilingues realmente se estan reproduciendo, se escuche separada del bloque anterior. Rango 0-5000 ms, predeterminado 1500; con 0 los bloques suenan seguidos, sin pausa. Solo queda sin efecto cuando el aviso tiene un unico bloque: Broadcast Repeat Count en 1 y sin pasada en espanol.'
  BROADCAST_CHIME_GAP_MS:
    name: Pausa tras el timbre de aviso (ms)
    description: Silencio que se intercala entre el timbre de alerta y el mensaje hablado, para que el timbre termine de sonar y no se encime con el anuncio (0 a 5000 ms; predeterminado 1000; con 0 no hay pausa). Se aplica a cada timbre del anuncio, incluidas las repeticiones y cada pase de idioma de una alarma bilingüe. No tiene efecto si los avisos audibles están desactivados o si no hay ninguna bocina de destino configurada.
  BROADCAST_ANNOUNCE_RETRIES:
    name: Reintentos del anuncio
    description: 'Cuántas veces adicionales se reintenta el anuncio hablado cuando la llamada al servicio de Music Assistant devuelve un error; entre intentos espera alrededor de 1.5 segundos. Rango de 0 a 3, predeterminado 1; con 0 nunca se reintenta. No sirve para recuperar un anuncio que usted no alcanzó a oír: en ese caso la llamada sí tuvo éxito, así que subir este número no arregla un altavoz en silencio.'
  BROADCAST_WYOMING_HOST:
    name: Host de TTS Wyoming
    description: Nombre de host o IP del servidor Wyoming (Piper) que convierte el texto de las alarmas en voz. El valor por defecto core-piper apunta al add-on Piper de Home Assistant; cámbielo solo si Piper se ejecuta en otro equipo, por ejemplo piper.lan o 192.0.2.10. Escriba solo el host, sin esquema ni puerto (el puerto tiene su propia opción); si el host es incorrecto o no responde, las alarmas siguen sonando, pero se reducen a un timbre sin mensaje hablado.
  BROADCAST_WYOMING_PORT:
    name: Puerto de TTS de Wyoming
    description: 'Puerto TCP del servidor de texto a voz Wyoming/Piper que genera las alarmas habladas; se usa junto con el host de Wyoming configurado arriba. El valor predeterminado 10200 es el puerto estándar del complemento Piper y casi siempre es el correcto: cámbielo solo si su instancia de Piper escucha en otro puerto. Si escribe 0, se ignora y se usa 10200.'
  BROADCAST_WYOMING_VOICE:
    name: Voz TTS de Wyoming (inglés)
    description: Determina qué voz de Piper pronuncia los anuncios en inglés, por ejemplo en_US-amy-medium o en_GB-alan-low. Déjelo vacío (predeterminado) para usar la voz que ya tenga configurada el complemento Piper. El nombre debe coincidir con una voz instalada en su servidor Piper (aparecen en su registro de inicio), porque si pone un nombre que no existe ahí falla la síntesis y la alarma se degrada a solo campanada, sin palabras habladas.
  BROADCAST_BILINGUAL:
    name: Anuncios bilingües
    description: 'Cuando está activado, cada alarma hablada se reproduce una vez en inglés y luego una vez en español latinoamericano. Desactivado de forma predeterminada. No hace nada hasta que Wyoming TTS Voice (Spanish), más abajo, indique una voz en español que exista en su servidor Piper. Mientras la segunda pasada realmente se ejecuta, sustituye a la repetición: Broadcast Repeat Count deja de multiplicar el mensaje hablado. Desactívelo para volver a solo inglés con repeticiones.'
  BROADCAST_WYOMING_VOICE_ES:
    name: Voz de sintesis de voz en espanol (Piper)
    description: 'Nombre de la voz Piper en espanol que se usa para la segunda pasada, en espanol, de cada alarma hablada; por ejemplo es_MX-claude-high. Llenar este campo, con los avisos bilingues activados, es lo que activa la pasada en espanol: si lo deja vacio, las alarmas siguen solo en ingles aunque los avisos bilingues esten activados. La voz ya debe estar instalada en su servidor Wyoming/Piper y producir audio de 22050 Hz, 16 bits, mono (la mayoria de las voces -medium y -high lo hacen); si no cumple, se descarta la pasada en espanol y solo se reproduce el aviso en ingles.'
  BATTERY_SOC_ALARM_ENABLED:
    name: Alarma de SoC de la batería
    description: 'Emite la alarma hablada escalonada cuando la reserva del Smart Home Panel 2 cae por sus niveles de carga (de forma predeterminada 50/40/30/20/15/10/8/4/2 por ciento: aviso hasta 30, precaución en 20 y 15, y crítica de 10 hacia abajo; los fija Niveles de alarma del SoC de la batería). Viene activada; al desactivarla solo se silencia esa escalera audible: la alerta del panel y las notificaciones push se siguen enviando. Además requiere que las difusiones audibles estén activadas con al menos un altavoz de destino, respeta los interruptores por prioridad de Alert Settings y las horas de silencio, y mientras la red eléctrica sostiene la casa los niveles de emergencia se anuncian como simple aviso.'
  BATTERY_RUNWAY_ALARM_ENABLED:
    name: Alarma audible de autonomía de la batería
    description: 'Anuncia por voz, con urgencia creciente, cuando la proyección a 24 horas (solar prevista menos consumo previsto) indica que el banco de respaldo llegará a su piso de reserva, o se agotará, antes de que vuelva el sol; así puede reducir carga a tiempo, a diferencia de la escalera de SoC, que solo suena cuando el banco ya bajó. Activada de forma predeterminada; al desactivarla solo se silencia el aviso hablado: la alerta en pantalla, y la notificación push que esta genere, siguen funcionando. El aviso hablado también se silencia por sí solo mientras la red eléctrica sostiene la casa, y sigue respetando los interruptores de alerta por prioridad y las horas de silencio.'
  BATTERY_RUNWAY_ALARM_REANNOUNCE_MIN:
    name: Intervalo de repetición de la alarma de autonomía (min)
    description: Cuánto tiempo espera la alarma de autonomía de batería antes de repetir su anuncio hablado mientras sigue vigente la misma proyección de agotamiento. Predeterminado 60 minutos; se aceptan de 5 a 720 (de 5 minutos a 12 horas). Si la situación empeora y sube de prioridad, el anuncio sale de inmediato sin esperar el intervalo; y la opción no tiene efecto si la alarma de autonomía de batería (Battery Runway Alarm) está apagada.
  GRID_AVAILABLE:
    name: Importacion de la red disponible
    description: 'Indica al add-on si el sitio puede importar energia de la red electrica. Dejelo desactivado en un sistema aislado (off-grid): asi el optimizador de despacho deja de planificar con importaciones que fisicamente no pueden ocurrir, y cuando la reserva de respaldo llega a su piso la alarma se mantiene en CRITICA en lugar de degradarse a un aviso en pantalla; esa degradacion exige que la red se vea presente, ya sea por esta casilla, por una entidad de presencia de red, por importacion medida en vivo o por el indicador de red OK del propio Smart Home Panel 2. Activelo solo si de verdad esta conectado a la red; si configura una entidad de presencia de red, esa entidad manda para la presencia de red, pero el optimizador de despacho lee esta casilla de todos modos.'
  GRID_PRESENCE_ENTITY:
    name: Entidad de presencia de red eléctrica
    description: 'Entidad opcional de Home Assistant que indica si la red eléctrica está energizada; con ella la alarma del piso de la reserva de respaldo se vuelve consciente de la red, de modo que si la red está confirmada y sosteniendo la carga, llegar al piso de reserva de ~10 por ciento baja de CRITICAL a un aviso en pantalla. Apúntela a un binary_sensor, input_boolean o switch (on / present / connected = energizada) o a un sensor de voltaje de línea (magnitud mayor a 50 = energizada), por ejemplo binary_sensor.grid_available. Todo estado unavailable, unknown, no reconocido o sin actualizarse durante 2 minutos cuenta como sin red y el piso sigue en CRITICAL, salvo que el flujo de red medido o la propia bandera de red del Smart Home Panel 2 demuestre lo contrario. Al configurarla, sustituye al interruptor general Grid Import Available, que solo se consulta mientras este campo esté vacío (predeterminado); por eso una entidad que reporte ''energizada'' por error debilita esta alarma: el panel aún retiene la degradación mientras la reserva se sigue descargando en el piso, pero elija la entidad con cuidado.'
  GRID_FLOOR_SLACK_PCT:
    name: Porcentaje de Margen del Piso de Red
    description: Cuantos puntos porcentuales por encima de la reserva de respaldo el panel deja de confiar en una red declarada pero sin flujo medido, y la austeridad de iluminacion puede pre-armarse. El valor 1.5 (predeterminado) significa que con reserva del 10% se arma al 11.5% mientras el banco se descarga sin flujo de red medido; con una descarga vespertina tipica de ~7%/h cada punto equivale a ~9 minutos de aviso anticipado. Bajelo (p. ej. 0.5) para menos eventos de atenuacion con red presente, a costa de un margen menor si la red resulta estar caida en el piso; 0 arma solo en la reserva misma. Limitado a 0-10; vacio usa 1.5. La verificacion de coherencia del piso (+1.5%) de la alarma CRITICA no cambia.
  CHARGE_NOW_RESPONSE:
    name: Respuesta a Carga Inmediata
    description: Qué hace el panel cuando detecta que la red está cargando la batería en horario punta con el interruptor de carga forzada ("Carga inmediata") del SHP2 activado. "advisory" (predeterminado) envía una notificación por episodio nombrando el canal y la unidad; "supervised" además lo anuncia y desactiva la carga forzada por la vía de escritura auditada, verificando contra el dispositivo y avisando honestamente si la escritura no surte efecto; "off" desactiva la respuesta. Solo actúa con la reserva cómodamente cubierta y la red presente, se abstiene por completo mientras haya un aviso de preparación por tormenta, responde como máximo una vez por episodio y dos veces al día, y desactivar la carga forzada es la única escritura que puede emitir.
  HOST_POWER_ENTITY:
    name: Entidad de alimentación del equipo anfitrión
    description: 'Entidad opcional de Home Assistant con la que la alarma vigila su propio equipo: la máquina donde se ejecuta y que es el único punto de falla de todo el monitor. Apúntela a un binary_sensor que se active con bajo voltaje (device_class problem, on = bajo voltaje) —en un equipo Raspberry Pi, el binary_sensor.rpi_power_status del Raspberry Pi Power Supply Checker— y recibirá una alerta de nivel advertencia cuando el equipo reporte bajo voltaje, a tiempo para corregir una fuente marginal o un circuito caído antes de que el equipo se apague por caída de voltaje y se caigan todos los canales. Vacío (predeterminado) deja la verificación inactiva, y una lectura con más de dos minutos de antigüedad se reporta como desconocida en lugar de repetir un valor congelado.'
  LOAD_SHEDDING_ADVISORY_ENABLED:
    name: Asesor de reducción de carga
    description: Activa el asesor de solo lectura que vigila la autonomía fuera de la red y recomienda cuáles de sus cargas permitidas conviene apagar para alargarla. Solo publica la recomendación en el panel, en la API y en sus entidades MQTT; nunca apaga nada, de modo que sus propias automatizaciones de Home Assistant deciden si actuar. Viene activado, pero no hace nada hasta que agregue al menos una carga en Sheddable Loads, y no recomienda nada mientras la red eléctrica sostiene la casa.
  LOAD_SHEDDING_SHED_ENTITIES:
    name: Cargas que se pueden desconectar
    description: 'Lista permitida de las cargas que el asesor puede mencionar cuando recomienda desconectar consumo ante un deficit; nada fuera de esta lista se sugiere jamas y nada se apaga por usted: la recomendacion es solo informativa y son sus propias automatizaciones de Home Assistant las que deciden si actuar. Cada entrada, separada por comas, tiene el formato entity_id:prioridad:etiqueta:vatios_estimados[:circuito_shp2], donde prioridad 1 se desconecta primero (lo menos importante) y el ultimo campo opcional es el numero de circuito del Smart Home Panel 2 para leer vatios medidos en lugar de su estimacion; por ejemplo switch.pool_pump:2:Pool pump:400:5,switch.irrigation:1:Irrigation:200. Vacio (predeterminado) deja al asesor sin nada que recomendar, y esta lista solo importa mientras el Load-Shedding Advisor este activado; una entrada que parezca equipo medico, bomba de pozo, refrigeracion, red o seguridad se acepta igual y solo se registra una advertencia al arrancar, asi que verifiquela usted mismo.'
  LOAD_SHEDDING_RUNWAY_THRESHOLD_H:
    name: Autonomía que dispara la recomendación (horas)
    description: 'Qué tan baja debe caer la autonomía proyectada fuera de la red (horas hasta la reserva u horas hasta agotarse) antes de que el asesor empiece a nombrar cargas para desconectar; en horas, predeterminado 4.0: un valor más alto avisa antes y uno más bajo espera más. También mueve el punto de retiro, porque la recomendación solo se levanta cuando la proyección supera este umbral más el Restore Margin. El asesor únicamente recomienda: nunca apaga nada, guarda silencio mientras la red sostiene la casa y no hace nada si Load-Shedding Advisor está apagado o si Sheddable Loads no nombra al menos una entidad.'
  LOAD_SHEDDING_RESTORE_MARGIN_H:
    name: Margen de restablecimiento (horas)
    description: Cuánta autonomía adicional, en horas, por encima del umbral de disparo busca alcanzar la recomendación. El asesor sigue agregando circuitos a la lista sugerida hasta que la autonomía proyectada llegue a ese umbral más este margen (predeterminado 2.0), de modo que un valor mayor produce una lista más larga de circuitos por apagar. Es solo una recomendación —nunca apaga nada por usted— y no tiene ningún efecto salvo que el asesor de desconexión de cargas esté activado y haya al menos una entidad en la lista de cargas desconectables.
  NIGHT_CHARGE_ADVISOR_ENABLED:
    name: Asesor de carga nocturna
    description: 'Ejecuta el planificador de carga nocturna: los dias en que anticipa un deficit, calcula cuanta energia barata de la red conviene comprar de noche para que la casa no importe durante la punta de la tarifa (de 16:00 a 19:00, de lunes a viernes, en el plan APS R-EV integrado) y conserve un colchon por encima del piso de reserva. Publica ese plan en los sensores y entidades MQTT de carga nocturna y envia una notificacion cada noche, de forma predeterminada cerca de las 21:30, hora del sitio. Que el add-on pueda actuar sobre el plan lo decide otra opcion, Night-Charge Write Mode, cuyo valor predeterminado es advisory y nunca escribe en un dispositivo; si desactiva esta casilla (viene activada) no se calcula ningun plan: los sensores de carga nocturna quedan en blanco, no se envia la notificacion nocturna y no puede producirse ninguna escritura de reserva, sea cual sea ese modo.'
  NIGHT_CHARGE_MODE:
    name: Modo de escritura de la carga nocturna
    description: 'Hasta dónde puede actuar el motor de carga nocturna sobre su propio plan: advisory (predeterminado) nunca escribe en ningún dispositivo, solo publica sensores y la notificación nocturna. supervised anuncia cada noche el plan (anuncio audible más notificación de Home Assistant) con un plazo para cancelar y, si usted no cancela desde el panel, realiza UNA sola escritura registrada en auditoría que eleva la reserva de respaldo del Smart Home Panel 2 al objetivo del plan (limitada al rango de 10 a 50 por ciento del equipo) cuando abre la ventana barata, y restaura el valor anterior cuando la ventana cierra, o una hora antes de la punta si eso ocurre antes; nada se eleva a menos de una hora de la punta, una restauración que el panel no confirma se avisa como crítica, y no se intenta ninguna elevación mientras el propio host del complemento esté bajo presión crítica (sus constantes vitales, no una alerta; la restauración sí se ejecuta), y las alarmas del piso de reserva son independientes de esta ruta en todo momento. auto está reservado para un futuro modo desatendido: hoy ejecuta exactamente el mismo flujo anunciado y cancelable, y se degrada a supervised mientras la compuerta de preparación de escritura no se haya graduado con evidencia real de noches actuadas.'
  ARB_OUTAGE_CUSHION_PCT:
    name: Reserva adicional para cortes (%)
    description: 'Margen de batería que se mantiene por encima del piso de reserva como seguro ante un corte imprevisto, en por ciento de la capacidad total del banco (0 a 40; predeterminado 15). El asesor de carga nocturna dimensiona la compra de madrugada para que su proyección más pesimista (poco sol, mucho consumo) termine igual o por encima del piso más este margen: súbalo para más resiliencia y una compra mayor, bájelo para comprar menos. Con el modo de escritura de carga nocturna en supervised o auto, este valor también eleva la reserva que se escribe realmente en el Smart Home Panel 2, aunque la escritura sigue limitada al rango de 10 a 50 por ciento del equipo; la alarma independiente del piso de reserva nunca se ve afectada.'
  ARB_OUTAGE_CUSHION_HOURS:
    name: Horas de respaldo ante un corte
    description: 'Durante cuánto tiempo debe poder la batería alimentar sus circuitos protegidos después de que cierre la ventana de carga, por encima del suelo de reserva. Es lo que la compra nocturna dimensiona. La energía necesaria se calcula a partir de la carga que el Smart Home Panel lleva realmente: cuando cae la red, el panel alimenta sus propios circuitos y el resto de la casa queda sin corriente, así que el consumo de toda la vivienda no es la cifra correcta y usarla volvía el objetivo inalcanzable. Predeterminado 4 horas. Súbalo para una garantía más larga y el plan comprará más; bájelo y comprará menos. Póngalo en 0 para desactivar el margen y defender solo el suelo de reserva.'
  ARB_ISLANDED_LOAD_SAFETY:
    name: Factor de seguridad de la carga aislada
    description: 'Multiplicador que se aplica a la carga medida del panel al dimensionar el margen ante un corte; predeterminado 1.25. La medición es una lectura puntual y la carga durante un corte no es constante, así que el plan supone deliberadamente más consumo del que ve. MÁS ALTO ES MÁS ESTRICTO: 2.0 vuelve el margen más difícil de cumplir y compra más; 1.0 confía exactamente en la lectura en vivo. No es un factor para ser optimista.'
  ARB_OBJECTIVE:
    name: Objetivo de la carga nocturna
    description: 'Para qué se dimensiona la compra nocturna. ''resilience'' (predeterminado) compra solo lo necesario para mantener el suelo de reserva más el margen ante un corte. ''cost'' compra para minimizar su factura: almacena energía nocturna barata para desplazar la energía más cara que importaría después, llenando hasta el techo que marca la producción solar prevista para mañana (o el Estado de carga máximo en modo coste cuando el pronóstico no llega tan lejos). El modo coste está acotado POR ABAJO por la respuesta de resiliencia, así que cambiar a él nunca compra menos ni reduce su margen de seguridad: la única dirección en que mueve la compra es hacia arriba. Necesita sus tarifas introducidas y confirmadas para ser útil. Con cost y el Estado de carga máximo en modo coste por encima de 50, la tarde anterior a un día laborable de invierno calcula además la carga que haría en su lugar en el periodo súper fuera de punta de la tarifa (de 10 a. m. a 3 p. m. en el plan APS R-EV integrado), solo como vista previa: se muestra en las entidades Midday-Charge y en la tarjeta de carga nocturna, y no se escribe nada por ella.'
  ARB_COST_MAX_SOC_PCT:
    name: Estado de carga máximo en modo coste
    description: 'Hasta dónde puede llenar la batería la carga nocturna en modo coste, en porcentaje; predeterminado 90. La reserva de respaldo del panel no admite valores por encima de 50 (comprobado en el dispositivo), así que el complemento carga por encima del 50 % con la carga forzada del panel (el «Cargar ahora» de la aplicación): la reserva lleva la batería al 50 % y mantiene la casa en la red; después, al final de la ventana de carga, la carga forzada se activa para alcanzar el objetivo de la noche. Se desactiva al alcanzarlo, con cualquier objetivo (el límite de carga forzada del propio panel, ajustado a juego, es solo un respaldo). La activación se programa con la tasa de carga en vivo: la envolvente compartida de entrada de red menos lo que consume la casa. Empezar tarde es deliberado: por debajo del 80 %, una batería llena horas antes vuelve a descargarse hacia la reserva del 50 % por el consumo de la casa antes del amanecer. El objetivo es este valor O el espacio que necesita la solar prevista (mediana) para la mañana siguiente, lo que sea menor: una batería demasiado llena para aceptar el sol de la mañana desperdicia esa solar, y el kWh desperdiciado cuesta el precio completo del kWh de red que ocupa su lugar. En una noche seguida de más de un día sin una ventana barata completa (en el plan APS R-EV integrado, el jueves, antes de la ventana de 1 hora del viernes y del fin de semana todo en horario normal) se deja de lado el espacio solar y el objetivo es este valor. Fíjelo en 50 o menos para desactivar la carga forzada por completo. Se ignora en modo resiliencia.'
  ARB_MIN_BUY_KWH:
    name: Compra mínima (kWh)
    description: 'Por debajo de este tamaño de compra recomendado, el asesor da la noche por "sin compra" en lugar de insistir con una recarga insignificante. Valor predeterminado: 1.0 kWh; el campo acepta de 0 a 50 y un rango razonable va de 0.5 a 3. Ese mismo número sirve además como prueba de línea base limpia en la evaluación retrospectiva de la mañana: en una noche en la que el motor NO actuó, un consumo de red nocturno superior a esta cifra deja la noche sin calificar, en vez de juzgarla contra una línea base que la propia red ya sostuvo.'
  ARB_CHARGE_CAP_KW:
    name: Límite de potencia de carga desde la red (kW)
    description: 'Techo de la velocidad a la que las baterías pueden cargarse desde la red; sirve para calcular cuánta energía puede entregar la ventana nocturna de tarifa barata. 0 (el valor predeterminado) es AUTOMÁTICO: los Cores de batería conectados por lo que cada uno ha tomado en la red según las mediciones, de modo que un Core retirado para servicio lo reduce por sí solo. El consumo de la casa se descuenta aparte, con la envolvente compartida de entrada de red. Cualquier valor mayor que 0 es un valor fijo. La carga forzada nocturna se programa de la misma manera. Solo dimensionamiento orientativo; nunca envía órdenes a un dispositivo.'
  ARB_GRID_INPUT_CAP_KW:
    name: Límite compartido de entrada desde la red (kW)
    description: 'Limita la potencia de red que el plan de carga nocturna supone disponible, repartida entre el consumo de la casa y la carga de las baterías: una carga simultánea grande —sobre todo una sesión de carga del auto eléctrico— deja a las baterías solo el remanente, así que el plan compra menos energía y declara el faltante en lugar de prometer de más. En kW; el valor predeterminado es 17; fíjelo en la capacidad del interruptor de entrada de red de su instalación, en kW; con 0 se ignora la contención por completo y el plan supone el tope de carga completo aunque la casa esté consumiendo mucho. Nunca pausa ni limita el cargador del auto, pero no es un ajuste inocuo: si Night-Charge Write Mode está en supervised o auto, el plan dimensionado con este valor es el que se escribe en la reserva de respaldo del Smart Home Panel 2. La carga forzada nocturna también programa su activación con este valor menos el consumo de la casa en vivo (el panel limita su importación total de red y la casa la comparte); un valor por encima del límite real la inicia tarde y la noche termina por debajo de su objetivo.'
  ARB_LOAD_P90_FACTOR:
    name: Margen de seguridad de carga (P90)
    description: Define cuanto amplia el planificador de carga nocturna el consumo previsto del hogar al dimensionar la compra de la noche, para que planifique una noche mas pesada de lo esperado en vez de quedarse corto. El valor predeterminado 1.15 supone un 15 por ciento mas de consumo del previsto; subalo hacia 2.0 para comprar mas energia barata de noche (y pagar energia que quiza no necesite), o bajelo hacia 1.0 para comprar menos y aceptar mas riesgo de importar en horario punta. Rango 1.0-2.0; solo sirve para dimensionar el plan, nunca escribe en un dispositivo, y no tiene efecto si el Night-Charge Advisor esta desactivado.
  NIGHT_CHARGE_NOTIFY_HOUR:
    name: Hora del aviso de carga nocturna
    description: 'Hora del sitio (la zona horaria del sitio si está configurada; si no, la de Home Assistant) a la que corre la tarea nocturna de carga: registra el plan de la noche, califica el resultado del día anterior y envía el único aviso de la jornada. Con el modo de escritura de carga nocturna en supervised o auto, este es también el momento en que se anuncia y se arma la escritura acotada de la reserva de esta noche, y el plazo para cancelarla se cuenta desde aquí. Predeterminado 21 (9 de la noche), con tiempo suficiente para actuar antes de que abra la ventana barata; la ventana de recuperación de la tarea cierra cuando abre la ventana barata (a las 23:00 en el plan APS R-EV integrado, donde un 23 nunca podría dispararse y se toma en silencio como 22; a medianoche como muy tarde con cualquier plan). Una hora igual o posterior a la apertura de la ventana barata de otro plan se adelanta a la hora anterior, y un aviso de reparación indica la hora a la que corre la tarea, porque un modo de escritura rechaza una ventana que abrió hace más de 30 minutos. Todo el ajuste queda inerte si el asesor de carga nocturna está apagado.'
  NIGHT_CHARGE_NOTIFY_MINUTE:
    name: Minuto del aviso de carga nocturna
    description: 'Minuto de la hora del aviso de carga nocturna en que se envía la recomendación de la noche; el valor predeterminado es 30, es decir las 21:30 con la hora predeterminada, y el rango válido va de 0 a 59. Los horarios son de la hora del sitio: la zona horaria del sitio si está configurada; si no, la de Home Assistant. El aviso solo se envía dentro de la ventana que va de esa hora a la apertura de la ventana barata (las 23:00 en el plan APS R-EV integrado; la medianoche cuando una ventana abre más tarde): si el add-on estuvo caído o reiniciándose durante toda esa ventana, se omite el aviso de esa noche en lugar de enviarlo tarde.'
  NIGHT_CHARGE_NOTIFY_ON_HOLD:
    name: Avisar también en noches sin carga
    description: Cuando está activado (predeterminado), el aviso nocturno de carga se envía incluso en las noches en que no hace falta cargar desde la red, para que tenga una confirmación constante de que la tarea corrió. Desactívelo para recibir aviso solo cuando de verdad se recomienda cargar. En cualquier caso, una noche con datos incompletos sí genera aviso, de modo que la ausencia de un plan nunca pasa inadvertida.
  HEARTBEAT_URL:
    name: URL de latido externo (interruptor de hombre muerto)
    description: 'URL https de ping de un servicio de monitoreo externo (por ejemplo, healthchecks.io). El add-on envía un GET en el intervalo configurado abajo; si los pings se detienen (equipo caído, contenedor terminado, corte de energía), ese servicio externo le avisa desde fuera de la falla que el add-on ya no podría reportar por sí mismo. Déjelo vacío (predeterminado) para desactivarlo; si el valor no es una URL https:// válida se rechaza por completo y no se envía ningún ping, con una sola advertencia en el log, así que revise el log después de configurarlo. La URL es un secreto (quien la tenga puede fingir su latido) y nunca se escribe completa en el log: solo aparece su nombre de host.'
  HEARTBEAT_INTERVAL_S:
    name: Intervalo del latido (segundos)
    description: Cada cuánto se envía el ping de hombre muerto a la URL de latido de arriba (de 60 a 3600 segundos; predeterminado 300). Configure el servicio externo con este mismo período y una tolerancia de unos dos intervalos, para que un solo ping perdido no lo despierte; tenga en cuenta que un intervalo más largo también retrasa en la misma medida el aviso de que el add-on o el equipo dejaron de funcionar. Se ignora mientras la URL de latido esté vacía; con una URL configurada, el primer ping sale de inmediato al arrancar, y esta es la única vía de alarma que sobrevive a una falla total del equipo o del suministro eléctrico.
  TARIFF_APS_ONPEAK_SUMMER_CENTS:
    name: 'Preajuste APS R-EV: hora pico ¢/kWh (verano)'
    description: 'Precio efectivo de la energía en hora pico, en centavos por kWh, para la temporada de verano (APS R-EV: de 4 a 7 p. m., de lunes a viernes; las facturas de mayo a octubre, que cubren el consumo desde la lectura del medidor de principios de abril hasta la de principios de octubre), tomado de una factura real con los ajustes incluidos. Déjelo en blanco hasta tener ese dato: en blanco, el precio de la hora pico de verano queda sin definir en la vista de tarifas y los indicadores de costo y ahorro usan la tarifa plana predeterminada (17 ¢/kWh, salvo que usted la cambie) en lugar de un precio APS inventado. Solo surte efecto cuando además active la opción de tarifas APS confirmadas y complete la tarifa fuera de pico de verano correspondiente.'
  TARIFF_APS_ONPEAK_WINTER_CENTS:
    name: 'Preajuste APS R-EV: punta ¢/kWh (invierno)'
    description: 'Precio de la energía en horario punta de invierno, en centavos por kWh, tomado de una factura real de APS (en la tarifa R-EV el invierno son las facturas de noviembre a abril, que cubren el consumo desde la lectura del medidor de principios de octubre hasta la de principios de abril). Alimenta los cálculos de costo y ahorro y las tarifas que se registran en el plan nocturno solo si activa Rates Confirmed y además llena el precio fuera de punta de invierno; de lo contrario, esas cifras vuelven a la tarifa plana predeterminada. Déjelo vacío hasta tener el dato de una factura: un valor vacío o cero se ignora en lugar de suponerse.'
  TARIFF_APS_OFFPEAK_SUMMER_CENTS:
    name: 'Preajuste APS R-EV: fuera de pico ¢/kWh (verano)'
    description: 'Precio efectivo de la energía fuera de pico en verano, en centavos por kWh, tomado de una factura real. En el plan APS R-EV es el bloque residual: cada hora de verano (consumo desde la lectura de principios de abril hasta la de principios de octubre, facturado de mayo a octubre) que no sea de pico (4-7 p. m. de lunes a viernes) ni nocturna (11 p. m.-5 a. m. de lunes a viernes), más todos los fines de semana y días festivos reconocidos. No surte efecto hasta que active Rates Confirmed: mientras esa opción esté apagada, la tabla de precios R-EV no entrega ningún valor en centavos, por lo que las cifras de arbitraje de la carga nocturna se publican como null y los informes de costo y de despacho recurren a una tarifa plana provisional (17 centavos por kWh, salvo que se anule) que no corresponde a su factura real. Déjelo en blanco hasta confirmar el dato.'
  TARIFF_APS_OFFPEAK_WINTER_CENTS:
    name: 'Preajuste APS R-EV: fuera de punta ¢/kWh (invierno)'
    description: 'Precio efectivo de invierno fuera de punta, en centavos por kWh, del plan APS R-EV: las facturas de noviembre a abril, es decir, el consumo desde la lectura de principios de octubre hasta la de principios de abril, en todas las horas que quedan fuera de las ventanas de punta (4 a 7 de la tarde, de lunes a viernes), súper fuera de punta de invierno (10 de la mañana a 3 de la tarde, de lunes a viernes) y madrugada (11 de la noche a 5 de la mañana, de lunes a viernes), más todos los fines de semana. Tómelo de una factura real, con los ajustes incluidos, y no de la tarifa base publicada; déjelo en blanco hasta tener ese dato. Una tarifa en blanco nunca se inventa: las cifras en dólares de invierno fuera de punta se publican como null y los indicadores de costo vuelven a su valor plano predeterminado de 17 centavos por kWh; quien decide si se publican cifras en dólares es la opción aparte de confirmación de tarifas (Rates Confirmed), no este campo.'
  TARIFF_APS_OVERNIGHT_CENTS:
    name: 'Preajuste APS R-EV: nocturno ¢/kWh'
    description: Su precio efectivo en centavos por kWh para la ventana nocturna del plan APS R-EV (11pm a 5am de lunes a viernes, todo el año), tomado de una factura real con recargos y ajustes incluidos. Escriba centavos y no dólares, como decimal simple, por ejemplo 4.5; un solo valor cubre verano e invierno. Sirve para poner precio a esa ventana en el resumen de tarifas y en el registro del plan de cada noche; no determina cuándo carga el sistema, porque ese horario lo fijan los periodos de la tarifa, y los precios se leen como nulos hasta que active también Rates Confirmed.
  TARIFF_APS_SUPEROFFPEAK_WINTER_CENTS:
    name: 'Preajuste APS R-EV: super-off-peak de invierno ¢/kWh'
    description: 'Precio efectivo del periodo super-off-peak de invierno de la tarifa APS R-EV, en centavos por kWh: de 10 a. m. a 3 p. m., de lunes a viernes, en invierno (las facturas de noviembre a abril, es decir, el consumo desde la lectura de principios de octubre hasta la de principios de abril); es el tramo barato del mediodía que coincide con la generación solar. Tómelo de una factura real y déjelo en blanco hasta confirmarlo. Escribir un número aquí no basta por sí solo: todas las cifras en dólares siguen en null hasta que active Rates Confirmed, y no existe un campo de verano porque el periodo es solo invernal. CÓMO OBTENERLO DE UNA FACTURA: APS imprime una tarifa base por tramo que NO es lo que usted paga. Sume la línea de Ajustes dividida entre los kWh totales y multiplique por uno más la fracción de Impuestos y Tasas. Ejemplo con cifras inventadas y redondas: 40 $ de Ajustes en una factura de 2000 kWh suman 2.0 c/kWh y, con una fracción de Impuestos y Tasas del 10 %, un tramo impreso a 8.0 c/kWh cuesta (8.0 + 2.0) x 1.10 = 11.0 c/kWh con todo incluido. Use la cifra con todo incluido: es el coste marginal del siguiente kWh, que es lo que necesita el cálculo de arbitraje.'
  TARIFF_APS_RATES_CONFIRMED:
    name: 'Preajuste APS R-EV: tarifas confirmadas'
    description: Confirma que las seis tarifas de APS R-EV de arriba provienen de una factura real (otro plan de tarifa tiene su propio interruptor de confirmación, que toma este valor mientras no esté configurado). Mientras esté desactivada (lo predeterminado), todas las cifras de costo y ahorro del panel se calculan con un valor de relleno fijo de 17 centavos por kWh en lugar de sus tarifas reales, y el registro tarifario de la carga nocturna queda marcado como no confirmado en vez de valorizado. Si la activa con alguna de las tarifas de la temporada actual todavía en blanco, se sigue usando ese valor de relleno, así que complete primero las tarifas.
  NWS_ENABLED:
    name: Alertas de tormenta del NWS
    description: 'Agrega el servicio gratuito del National Weather Service de EE. UU. para sus coordenadas de pronóstico: alertas activas de clima severo, que pueden generar un aviso de cargar al 100 por ciento antes de la tormenta, y además una segunda fuente de nubosidad que se promedia con el pronóstico solar y amplía su banda de incertidumbre cuando ambas fuentes discrepan. No requiere clave de API ni cuenta, y nunca le escribe a ningún equipo. Desactivado de forma predeterminada; fuera de EE. UU. el servicio responde vacío, sin efecto alguno.'
  MQTT_DISCOVERY_ENABLED:
    name: Descubrimiento MQTT
    description: 'Publica las métricas de la planta en su broker MQTT como sensores de descubrimiento automático de Home Assistant, de modo que aparecen solos bajo un dispositivo llamado "Power", sin editar configuration.yaml. Sigue inactivo mientras no llene también el campo del host del broker MQTT: hacen falta los dos, y el registro del add-on lo indica al arrancar cuando solo uno está puesto. Tenga en cuenta que también publica cuatro interruptores de prioridad de alarma que aceptan órdenes: cualquiera que llegue al broker puede silenciar los avisos push y audibles de toda una prioridad (las alarmas siguen visibles en el panel). Desactivado de forma predeterminada.'
  MQTT_DISCOVERY_HOST:
    name: Host del broker MQTT
    description: 'Nombre de host o dirección IP de su broker MQTT; por ejemplo core-mosquitto (el add-on Mosquitto de Home Assistant) o 192.168.1.50. Es obligatorio para MQTT Discovery: si queda vacío, el descubrimiento permanece apagado aunque active el interruptor. Vacío de forma predeterminada.'
  MQTT_DISCOVERY_PORT:
    name: Puerto del broker MQTT
    description: Puerto TCP del broker MQTT donde el add-on publica sus entidades de Home Assistant. Deje 1883 salvo que su broker escuche en otro puerto; el add-on se conecta con MQTT v5 sin cifrado, por lo que un puerto TLS como el 8883 no logrará conectarse. Se ignora si MQTT Discovery está desactivado o si no ha indicado el host del broker.
  MQTT_DISCOVERY_USER:
    name: Usuario de MQTT
    description: Usuario con el que el complemento inicia sesión en su broker MQTT al publicar las entidades de descubrimiento. Déjelo vacío si su broker acepta conexiones anónimas. Solo se lee cuando MQTT Discovery está activo y MQTT Broker Host tiene un valor; úselo junto con MQTT Password.
  MQTT_DISCOVERY_PASS:
    name: Contraseña MQTT
    description: 'Contraseña del broker MQTT, usada junto con el Usuario MQTT; déjela vacía si el broker acepta conexiones anónimas. Solo se lee cuando MQTT Discovery está activado y hay un host configurado. El campo se muestra enmascarado mientras escribe, pero el valor queda guardado en las opciones del complemento y viaja por una conexión MQTT sin cifrar: use una cuenta del broker que solo sirva en su red local, nunca una contraseña que reutilice en otros servicios.'
  MQTT_DISCOVERY_PREFIX:
    name: Prefijo de descubrimiento MQTT
    description: Prefijo de tema bajo el cual el complemento publica sus mensajes de descubrimiento automático. Debe coincidir con el prefijo configurado en la integración MQTT de Home Assistant; de lo contrario, ningún sensor aparecerá. "homeassistant" es el valor predeterminado de Home Assistant y casi siempre es el correcto; se ignora salvo que el descubrimiento MQTT esté activado y haya un host MQTT configurado.
  SSH_ENABLED:
    name: Activar la consola SSH (TUI)
    description: 'Sirve la consola de sala de control a pantalla completa por SSH en el SSH TUI Port (2323 de forma predeterminada) para terminales de su red: ssh -p 2323 <Usuario de la consola>@<host>. El inicio de sesión usa el Usuario y la Contraseña de la consola de más abajo, y mientras no haya una Contraseña de la consola se rechaza todo inicio de sesión, así que fíjela primero. La huella de la clave de host aparece en el registro del add-on en cada arranque, para compararla con la que ssh muestra en la primera conexión. Viene desactivado. La versión de la misma consola en el navegador, en /console, sigue disponible desde la barra lateral de Home Assistant sin importar lo que ponga aquí.'
  SSH_PORT:
    name: Puerto de la TUI SSH
    description: 'Puerto TCP en el que la TUI de sala de control por SSH escucha dentro del add-on; el predeterminado es 2323. Déjelo en 2323 salvo que sepa bien lo que hace: el add-on publica el puerto 2323 del contenedor y la sección Network solo permite cambiar el puerto del lado del host, así que cualquier otro valor aquí deja la consola inaccesible desde su red local. Se ignora mientras la consola esté desactivada.'
  TUI_USERNAME:
    name: Usuario de la consola
    description: 'Nombre de usuario para iniciar sesión en la consola de control, tanto en la TUI por SSH como en la terminal web /console; si lo deja vacío (predeterminado) se usa operator. Con la Contraseña de la consola vacía, la consola del navegador no pide inicio de sesión y la consola SSH rechaza todo inicio de sesión. Use solo caracteres ASCII imprimibles y un máximo de 64: el prompt de la consola del navegador no puede escribir otros, así que un nombre más largo o con acentos lo dejaría fuera de ella.'
  TUI_PASSWORD:
    name: Contraseña de la consola
    description: 'Contraseña para entrar a la consola de control, tanto en la TUI por SSH como en la terminal web /console; tres intentos fallidos cierran la conexión, y diez fallos en diez minutos desde una misma dirección bloquean los intentos nuevos desde esa dirección hasta que pasen los diez minutos. Si la deja vacía (valor predeterminado), la consola del navegador entra sin inicio de sesión y la consola SSH rechaza todo inicio de sesión hasta que fije una contraseña. Use ASCII imprimible, máximo 64 caracteres: el campo de inicio de sesión de la consola del navegador no puede escribir otra cosa, de modo que un valor más largo o con caracteres no ASCII lo deja fuera de ella (el add-on lo advierte al arrancar).'
  TUI_TRUSTED_ORIGINS:
    name: Orígenes de navegador de confianza (avanzado)
    description: 'Opción avanzada de seguridad: lista separada por comas de orígenes de navegador exactos (por ejemplo, https://su-id.ui.nabu.casa) que el add-on tratará como propios. Cada entrada se compara de forma exacta, nunca con comodines, pero todo origen que agregue obtiene los mismos permisos que el panel: abrir la terminal /console y los websockets, y hacer llamadas de escritura sin token, lo que incluye desactivar los anuncios audibles, cambiar los ajustes de alertas y cancelar el plan de carga nocturna. Agregue únicamente orígenes bajo su control total y déjelo vacío (predeterminado): la red local y la barra lateral de Home Assistant ya funcionan sin esta opción.'
  RECORDER_RETENTION_DAYS:
    name: Retencion de telemetria (dias)
    description: Cuantos dias de muestras de telemetria en bruto conserva el add-on antes de que la limpieza cada hora las elimine; esas muestras son las que alimentan las graficas, los minigraficos y las ventanas de pronostico y de entrenamiento de modelos. Predeterminado 30 dias; subirlo permite comparaciones estacionales y analisis retrospectivos mas profundos, con un crecimiento de la base de datos de unos 25-30 MB por dia con la flota completa, asi que revise el espacio libre en disco antes de alargarlo. Rango 7-3650; un valor ilegible vuelve a 30 en lugar de borrarlo todo, y el registro de carga nocturna y los totales de energia de por vida nunca se podan con esta opcion.
  ECOFLOW_DEVICE_REACHABILITY:
    name: Mapa de alcance en red local de los dispositivos
    description: 'Objeto JSON opcional que asocia el número de serie de cada dispositivo con un binary_sensor de ping de Home Assistant (device_class connectivity) que vigila su dirección en la red local, por ejemplo {"<serie>":"binary_sensor.core1_lan"}. Solo cambia la explicación de un dispositivo fuera de línea: si responde en la red local pero no en la nube, se reporta como sesión trabada con la nube (no lo apague ni lo desconecte); si no responde, es una falla real. Nunca hace que una alarma se dispare, cambie de severidad ni se silencie; si lo deja vacío (predeterminado) o el JSON está mal formado, la función queda inactiva por completo, y cualquier entrada cuyo valor no sea un entity id en minúsculas con el formato dominio.objeto se descarta sin aviso.'
  WRITE_DEBUG_TOKEN:
    name: Token de depuración de escritura (avanzado)
    description: Déjelo vacío (valor por defecto) salvo que esté investigando activamente comandos no documentados de EcoFlow. Cualquier valor habilita POST /api/device/send-command, que envía al Smart Home Panel 2 o al Delta Pro Ultra los comandos que usted componga; las protecciones son una lista blanca de conjuntos de comandos, un límite de tamaño y una espera de 30 segundos por equipo, no una comprobación de que el comando tenga sentido, así que uno equivocado puede alterar el comportamiento de su respaldo. Quien llame debe enviar exactamente este valor en la cabecera x-write-debug-token y llegar por el ingress de Home Assistant, desde el propio origen del panel o con el token de escritura del panel; al borrar el campo, el endpoint vuelve a cerrarse.
  # New schema-only keys (v1.191.0 and later): each lane appends its entries under its own heading.
  # --- lane site --- (SITE_TIMEZONE, SITE_LOCATION_FROM_HA)
  SITE_TIMEZONE:
    name: Zona horaria del sitio (avanzado)
    description: 'Déjelo vacío (valor por defecto) para usar la zona horaria de Home Assistant. Es la zona en la que se calculan todas las fechas, horas y horarios locales: los periodos de la tarifa, la ventana de carga nocturna y sus avisos, las horas de silencio, el resumen matinal, los totales diarios y las horas que muestran la consola y las tarjetas de carga nocturna, de hoy y de pronóstico. Escriba un nombre de zona IANA, como Europe/Berlin, solo si el add-on debe mantener una zona distinta de la de Home Assistant. Un nombre que el add-on no reconoce genera un aviso de reparación y la zona vuelve a ser la de Home Assistant. La zona se lee una vez al arrancar, así que reinicie el add-on después de cambiarla.'
  # --- lane tariff --- (TARIFF_PLAN, TARIFF_PERIODS, TARIFF_RATES, TARIFF_RATES_CONFIRMED, TARIFF_FIXED_DAILY_CENTS, TARIFF_SUMMER_MONTHS, TARIFF_HOLIDAYS, TARIFF_CURRENCY, NIGHT_CHARGE_CHEAP_PERIOD, TARIFF_FLAT_CENTS_PER_KWH, TARIFF_ON_PEAK_CENTS, TARIFF_OFF_PEAK_CENTS, TARIFF_EXPORT_CENTS_PER_KWH, TARIFF_ON_PEAK_HOURS, TARIFF_ON_PEAK_DAYS)
  TARIFF_PLAN:
    name: Plan tarifario
    description: 'Qué tarifa pone precio a las cifras de coste y fija el horario de la carga nocturna. Déjelo sin definir (o elija aps_r_ev) para la tabla APS R-EV integrada, con sus seis campos de tarifa de arriba. flat es una sola tarifa a toda hora (Tarifa plana ¢/kWh); two_tier es una ventana punta (Horas y Días punta) con una tarifa punta y otra fuera de punta; custom es su propia tabla de periodos (Periodos y Tarifas). Un ajuste que no se puede leer nunca se sustituye por la tabla APS: todos los precios quedan desconocidos, la carga nocturna se retiene y un aviso de reparación indica la opción que hay que corregir.'
  TARIFF_PERIODS:
    name: Periodos tarifarios (plan custom)
    description: 'Los periodos de un plan custom, separados por punto y coma, de mayor a menor prioridad. Cada uno es: id inicio-fin días temporada y, opcionalmente, onpeak y cheap. Las horas son locales y el final no se incluye (23-05 cruza la medianoche, 0-24 es el día entero); los días son all, un día (mon … sun), un rango como mon-fri o una lista separada por comas; la temporada es all, summer o winter. Marque el periodo punta con onpeak y el de la carga nocturna con cheap, se llame como se llame; la tarea nocturna corre entonces antes de que abra ese periodo. Toda hora que ningún periodo cubre es off_peak. Ejemplo: on_peak 16-19 mon-fri all onpeak; overnight 23-05 mon-fri all cheap. Solo se usa con el plan custom.'
  TARIFF_RATES:
    name: Tarifas (plan custom)
    description: 'Los ¢/kWh de cada periodo del plan custom y de off_peak, separados por punto y coma: id=verano/invierno, o id=tarifa para ambas temporadas, con - cuando no hay tarifa en una temporada. Ejemplo: on_peak=31.2/22.5; off_peak=16.9/15.1; overnight=12.6. Cuenta cualquier número, también 0. Cada periodo de Periodos tarifarios y off_peak debe tener su entrada. Solo se usa con el plan custom.'
  TARIFF_RATES_CONFIRMED:
    name: Tarifas confirmadas (cualquier plan)
    description: 'Confirma que las tarifas del plan en vigor salen de una factura. Mientras no esté definida decide el interruptor Tarifas confirmadas de la sección APS, para todos los planes. Hasta que se confirmen, todos los precios quedan desconocidos, y las cifras de coste usan la tarifa punta y la tarifa fuera de punta sobre la ventana punta cuando ambas son mayores que cero (en un plan two_tier, sus dos tarifas), y si no la tarifa plana. Con un plan definido, el planificador de despacho pone precio a una hora sin confirmar de la misma forma.'
  TARIFF_FIXED_DAILY_CENTS:
    name: Cargo fijo diario ¢
    description: 'El cargo fijo diario del plan en centavos, como referencia. No forma parte de ningún precio por kWh y solo se muestra cuando las tarifas están confirmadas. Déjelo sin definir si la factura no lo tiene.'
  TARIFF_SUMMER_MONTHS:
    name: Meses de verano
    description: 'Los meses de consumo que se cobran a tarifa de verano, como rango o lista separada por comas: 4-9 (de abril a septiembre, el valor por defecto) o, al sur del ecuador, un rango que cruza el año como 10-3. Los demás meses son invierno. Se aplica a todos los planes.'
  TARIFF_HOLIDAYS:
    name: Festivos fuera de punta
    description: 'Los días que se cobran fuera de punta todo el día: aps (la regla de festivos de APS R-EV, el valor por defecto de ese plan), none (el valor por defecto de los demás planes) o una lista de fechas separadas por comas con el formato AAAA-MM-DD.'
  TARIFF_CURRENCY:
    name: Moneda de la tarifa
    description: 'La moneda de las tarifas y de las cifras de coste: USD (por defecto), EUR, GBP, CAD o AUD. Las tarifas siguen en centésimas de la unidad. Cambiarla cambia la unidad de los sensores de coste y de tarifa de Home Assistant, que pedirá una vez reparar sus estadísticas a largo plazo. Un código desconocido mantiene USD y abre un aviso de reparación.'
  NIGHT_CHARGE_CHEAP_PERIOD:
    name: Periodo de carga nocturna
    description: 'El periodo tarifario en el que el motor de carga nocturna planifica y carga. Déjelo sin definir: el plan APS R-EV carga en overnight y un plan custom en el periodo marcado cheap; los planes flat y two_tier no tienen ninguno, así que la carga nocturna se retiene. Indique el id de un periodo del plan en vigor para elegir otro (off_peak es toda hora que ningún periodo cubre, planificada una noche a la vez: en un plan two_tier, desde el final de la punta hasta su inicio al día siguiente, también las noches del fin de semana); un id que el plan no tiene falla de forma segura (la carga nocturna se retiene y un aviso de reparación lo indica). El horario de la tarea nocturna sigue las horas del periodo.'
  TARIFF_FLAT_CENTS_PER_KWH:
    name: Tarifa plana ¢/kWh
    description: 'La tarifa del plan flat y, con cualquier otro plan, la tarifa de reserva que usan las cifras de coste mientras ninguna tarifa confirmada pone precio a una hora. Sin definir es 17 ¢/kWh.'
  TARIFF_ON_PEAK_CENTS:
    name: Tarifa punta ¢/kWh (dos tramos)
    description: 'La tarifa punta del plan two_tier. Con cualquier otro plan, junto con la tarifa fuera de punta sustituye el par de dos tramos de las cifras de coste; allí solo cuenta un valor mayor que cero. Sin definir deja ambos como están.'
  TARIFF_OFF_PEAK_CENTS:
    name: Tarifa fuera de punta ¢/kWh (dos tramos)
    description: 'La tarifa fuera de punta del plan two_tier: toda hora fuera de la ventana punta. Con cualquier otro plan, junto con la tarifa punta sustituye el par de dos tramos de las cifras de coste; allí solo cuenta un valor mayor que cero.'
  TARIFF_EXPORT_CENTS_PER_KWH:
    name: Crédito por exportación ¢/kWh
    description: 'Lo que la compañía abona por kWh exportado a la red, para el optimizador de despacho. Sin definir es 0 (sin crédito por exportación).'
  TARIFF_ON_PEAK_HOURS:
    name: Horas punta (dos tramos)
    description: 'La ventana punta del plan two_tier como inicio-fin, en hora local y sin incluir el final (sin definir es 15-20, de 3 a 8 de la tarde). Con cualquier otro plan es la ventana heredada con la que las cifras de coste juzgan la punta mientras las tarifas no están confirmadas.'
  TARIFF_ON_PEAK_DAYS:
    name: Días punta (dos tramos)
    description: 'Los días punta del plan two_tier como primero-último, 1 = lunes a 7 = domingo (sin definir es 1-5, de lunes a viernes; 6-7 es el fin de semana). Con cualquier otro plan son los días de la ventana heredada.'
  # --- lane pv --- (PV_ARRAY_KWP, PV_TILT_DEG, PV_AZIMUTH_DEG, PV_STRINGS)
  PV_ARRAY_KWP:
    name: "Tamaño del campo solar (kWp)"
    description: "Potencia nominal total del campo solar en kWp, por ejemplo 6.4 para dieciséis paneles de 400 W. Déjelo vacío para conservar el campo de referencia incorporado (16.8 kWp). El modelo de cielo despejado (el máximo físico y su puntuación) y la escala de ruido del modelo solar aprendido se dimensionan con este valor. Configurar esta u otra opción PV también traslada el modelo solar a Latitud del sitio y Longitud del sitio (o a la ubicación de la casa en Home Assistant, vea Usar la ubicación de Home Assistant), así que revise esos valores primero."
  PV_TILT_DEG:
    name: "Inclinación del campo solar (°)"
    description: "Inclinación de los paneles respecto de la horizontal en grados: 0 es plano y 90 vertical. Déjelo vacío para conservar 25°. El modelo de cielo despejado lo usa para proyectar la luz solar sobre los paneles."
  PV_AZIMUTH_DEG:
    name: "Orientación del campo solar (°)"
    description: "Dirección hacia la que miran los paneles, en grados en sentido horario desde el norte: 180 es el sur exacto, 90 el este y 270 el oeste (un techo del hemisferio sur suele mirar al norte, 0 o 360). Déjelo vacío para conservar 180°."
  PV_STRINGS:
    name: "Cadenas solares por Core"
    description: "Las cadenas solares conectadas a cada Delta Pro Ultra, como hv=<paneles>x<vatios>,lv=<paneles>x<vatios>, por ejemplo hv=10x400,lv=4x400 (el valor cuando está vacío). Un Core con otro cableado recibe una excepción después de un punto y coma, indicada por su ranura del panel o por su nombre: hv=10x400,lv=4x400; slot2=hv=8x450 — la cadena que la excepción no menciona conserva la primera disposición; hv=0 o lv=0 significa sin cadena. La página Solar dibuja y rotula las cadenas de cada Core con este valor; no cambia ninguna medición. Un valor que no se puede leer vuelve al predeterminado y genera un aviso de reparación."
  SITE_LOCATION_FROM_HA:
    name: "Usar la ubicación de Home Assistant"
    description: "Si está activado, el sitio usa la latitud y la longitud de la casa definidas en Home Assistant (Ajustes → Sistema → General) en lugar de Latitud del sitio y Longitud del sitio, para el pronóstico solar, las alertas de tormenta, la prueba de día o noche y el modelo solar. El complemento la lee en segundo plano después de arrancar y la guarda, de modo que se aplica desde el siguiente arranque; un aviso de reparación pide ese reinicio. Déjelo desactivado para usar los dos campos anteriores. Desactivado, un aviso de reparación advierte cuando la casa de Home Assistant está a más de 50 km de esos campos."
  # --- lane ev --- (EV_MAX_LOAD_W, EV_CHARGER_COUNT, EV_PLATEAU_MIN_W, EV_CIRCUITS)
  EV_MAX_LOAD_W:
    name: Carga máxima del cargador del vehículo eléctrico (W)
    description: 'Avanzado. Lo máximo que consume un cargador de vehículo eléctrico, en vatios. Limita cada sesión de carga prevista en el pronóstico de consumo y el consumo proyectado de una sesión en curso. Déjelo vacío para 11520 W (48 A a 240 V).'
  EV_CHARGER_COUNT:
    name: Cargadores de vehículo eléctrico
    description: 'Cuántos cargadores de vehículo eléctrico hay. Vacío o 1: las sesiones de carga previstas que se solapan se tratan como alternativas y cuenta la mayor. De 2 a 4: las sesiones solapadas se suman, con un tope de esta cantidad por la carga máxima del cargador. 0: no hay cargador, así que ningún circuito se trata como carga de vehículo eléctrico.'
  EV_PLATEAU_MIN_W:
    name: Umbral de detección del vehículo eléctrico (W)
    description: 'Avanzado. Potencia media, en vatios, por encima de la cual una carga sostenida de un circuito cuenta como una sesión de carga de vehículo eléctrico. Déjelo vacío para 6000 W, que separa un cargador de nivel 2 de los aires acondicionados; bájelo para un cargador más pequeño.'
  EV_CIRCUITS:
    name: Circuitos del cargador del vehículo eléctrico
    description: 'Números de circuito del Smart Home Panel 2 (1-12, separados por comas) que revisa la detección del vehículo eléctrico, por ejemplo 11,12. Un circuito de 240 V se revisa cuando aparece cualquiera de sus dos canales. Déjelo vacío para revisar todos los circuitos.'
  # --- lane devices --- (BENCH_SPARE_SNS, DEVICE_ALIASES)
  BENCH_SPARE_SNS:
    name: "Números de serie de las reservas de banco"
    description: "Números de serie de los Delta Pro Ultra que se mantienen fuera del panel como reservas de banco, separados por comas (<serie>,<serie>), o none si no hay ninguna. Que una reserva esté desconectada es lo esperado: su alarma de desconexión se muestra sin sonido ni aviso push y no se cuenta en el conjunto de baterías. Si se rellena, esta lista sustituye a la incorporada; no se suma a ella. Una unidad que el panel informa como una de sus fuentes conectadas nunca se trata como reserva, diga lo que diga la lista, y ninguna unidad se trata como reserva solo porque falte. Un número de serie que no corresponde a ningún equipo genera un aviso de reparación. Déjelo vacío para mantener la lista incorporada."
  DEVICE_ALIASES:
    name: "Alias de los equipos"
    description: "Nombres para mostrar por número de serie, como un único objeto JSON, por ejemplo {\"<serie>\":\"Core 5\"}. Un Core llamado Core N se numera N en las alertas y en las tarjetas. Estos nombres prevalecen sobre el archivo device-aliases.json de la carpeta de datos del complemento, que prevalece sobre el archivo incluido en la imagen. Se leen al arrancar el complemento; un valor que no sea un objeto JSON se ignora y genera un aviso de reparación. Déjelo vacío para mantener los nombres de esos archivos y de la app de EcoFlow."
  # --- lane limits --- (FORCE_CHARGE_KW_PER_CORE, RUNWAY_POOL_OVERHEAD_FLOOR_W, RUNWAY_CORE_OVERHEAD_W, BMS_RESEED_MIN_GAP_WH, CAPACITY_SCALE_MIN, FORECAST_NIGHT_START_HOUR, FORECAST_NIGHT_END_HOUR, GRID_CO2_INTENSITY_LB_PER_MWH, CYCLING_BASE_WEAR_USD_PER_KWH, OPPORTUNISTIC_LOADS, BATTERY_SOC_LADDER)
  FORCE_CHARGE_KW_PER_CORE:
    name: Potencia de carga forzada por Core (kW)
    description: 'Avanzado. La potencia que cada Core conectado recibe en sus baterías durante la carga forzada, en kW. Determina cuándo empieza la carga nocturna y el límite automático de carga del planificador. Déjelo vacío o en 0 para 5,5 kW. Un límite de potencia de carga desde la red mayor que 0 sigue fijando el límite del planificador.'
  RUNWAY_POOL_OVERHEAD_FLOOR_W:
    name: Consumo mínimo en espera para la autonomía (W)
    description: 'Avanzado. El consumo propio en espera de los Cores, en vatios, que la autonomía suma al consumo de la casa mientras el panel informa un conjunto de baterías. Déjelo vacío para 270 W, ajustado con un conjunto de tres Cores; unos 90 W por Core conectado sirven de punto de partida para otro conjunto. Rango 0-1500.'
  RUNWAY_CORE_OVERHEAD_W:
    name: Consumo en espera por Core para la autonomía (W)
    description: 'Avanzado. Consumo en espera por Core conectado, en vatios. Sube el consumo por encima del mínimo cuando hay más Cores conectados de los que cubre el mínimo. Déjelo vacío para 90 W. Rango 0-500.'
  BMS_RESEED_MIN_GAP_WH:
    name: Diferencia para reiniciar la energía acumulada (Wh)
    description: 'Avanzado. Cuánto pueden separarse, en vatios-hora, los totales de energía acumulada guardados y los contadores de las propias baterías antes de que los totales se reinicien desde los contadores. Déjelo vacío para 50000 Wh, más o menos la capacidad de un Core.'
  CAPACITY_SCALE_MIN:
    name: Escala mínima de capacidad
    description: 'Avanzado. La proporción mínima de capacidad medida de las baterías (capacidad a carga completa sobre la nominal) que se aplica a las cifras de energía del panel para la autonomía, el pronóstico y la revisión del conjunto inactivo. Déjelo vacío para 0,8. Rango 0,5-1.'
  FORECAST_NIGHT_START_HOUR:
    name: Hora de inicio de la noche del pronóstico
    description: 'Avanzado. Primera hora (0-23) de la franja nocturna en la que el pronóstico de consumo se ajusta hacia el consumo medido en las últimas horas. Déjelo vacío para 21.'
  FORECAST_NIGHT_END_HOUR:
    name: Hora de fin de la noche del pronóstico
    description: 'Avanzado. Última hora (0-23) de la franja nocturna en la que el pronóstico de consumo se ajusta hacia el consumo medido en las últimas horas. Déjelo vacío para 5.'
  GRID_CO2_INTENSITY_LB_PER_MWH:
    name: Intensidad de CO2 de la red (lb/MWh)
    description: 'Intensidad de carbono de la electricidad de la red, en libras de CO2 por MWh, que se usa para las cifras de CO2 evitado. Déjelo vacío para 1100 lb/MWh. Las compañías eléctricas y los operadores de la red publican la cifra de su zona.'
  CYCLING_BASE_WEAR_USD_PER_KWH:
    name: Costo de desgaste de la batería (por kWh)
    description: 'Avanzado. Costo base del desgaste de la batería por kWh ciclado, en la moneda de la tarifa (Moneda de la tarifa; la opción conserva USD en su nombre), que el optimizador de despacho compara con el ahorro de la tarifa. Déjelo vacío para 0,015.'
  OPPORTUNISTIC_LOADS:
    name: Sugerencias de cargas para el excedente
    description: 'Cargas que se sugieren cuando la energía solar se recortaría, como entradas id:vatios:categoría:etiqueta separadas por comas, por ejemplo pool_pump:1800:pool:Bomba de la piscina,water_heater:4500:water. La categoría es pool, ev, water, hvac u other (other si se omite) y la etiqueta es opcional. Escriba none para no tener sugerencias. Déjelo vacío para los ejemplos incluidos.'
  BATTERY_SOC_LADDER:
    name: Niveles de alarma del SoC de la batería
    description: 'Los niveles de estado de carga que la alarma de la batería anuncia al bajar, como entradas porcentaje:prioridad separadas por comas, por ejemplo 50:low,30:medium,15:critical. La prioridad es low, medium, high o critical. Déjelo vacío para 50, 40 y 30 (low), 20 y 15 (medium), y 10, 8, 4 y 2 (critical).'
