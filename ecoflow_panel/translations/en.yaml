# Home Assistant Configuration-page labels + inline help for the Power add-on.
# HA renders each option's `name` as its field label and `description` as the
# plain-text helper line beneath it. Keys MUST match config.yaml options exactly
# (a typo silently falls back to the raw KEY with no warning). Port labels live in
# config.yaml `ports_description:` — kept single-source, so no `network:` block here.
#
# v1.68.0 — every description re-verified against the code that reads the option and
# rewritten to lead with the EFFECT on the system rather than the mechanism. Keep the
# key order identical to config.yaml so the two files diff against each other cleanly.
configuration:
  ECOFLOW_ACCESS_KEY:
    name: EcoFlow Access Key
    description: 'IoT access key from the EcoFlow developer portal at developer.ecoflow.com, used together with the secret key below. Required: if either is empty the add-on logs a fatal error and exits instead of starting, so no device is polled and no alarm can fire. Masked on entry and never shown back.'
  ECOFLOW_SECRET_KEY:
    name: EcoFlow Secret Key
    description: 'The secret half of your EcoFlow developer key pair, used as the HMAC-SHA256 signing key for every request to EcoFlow''s cloud (the key itself is never sent). Required: if it is blank, the add-on logs a fatal error and stops instead of starting. Copy it from the EcoFlow developer portal alongside the Access Key above and treat it like a password.'
  ECOFLOW_API_HOST:
    name: EcoFlow API Host
    description: Base URL of the EcoFlow cloud API. Every REST poll goes here, and the MQTT broker address and credentials are fetched from it too, so this one value decides which region the add-on talks to. Leave the default https://api-a.ecoflow.com unless sign-in fails with a 401, then try https://api-e.ecoflow.com (EU) or https://api-us.ecoflow.com (US); must be a full URL including https://.
  LOG_LEVEL:
    name: Log Level
    description: Verbosity of the add-on log (Fastify/pino). info is the default and the right setting for normal running; debug or trace additionally restore the per-poll and per-minute recorder heartbeat lines, which help when troubleshooting but grow the log quickly. warn, error, or fatal quiet routine output, while failures, telemetry gaps, and anomalies keep logging at their own levels regardless.
  FORECAST_LAT:
    name: Site Latitude
    description: Latitude of the install site in decimal degrees, north positive; default 33.4484 is Phoenix, AZ. It sets where the solar irradiance forecast is fetched from and, when NWS storm alerts are enabled, which area's weather warnings are watched. A wrong value quietly degrades every solar prediction, since the runway, night-charge and storm pre-charge advice all rest on that forecast.
  FORECAST_LON:
    name: Site Longitude
    description: Longitude of the install site in decimal degrees, east positive and west negative; default -112.074 (Phoenix, AZ). It is the point sent to Open-Meteo for the solar weather forecast and, when NWS Storm Alerts is on, to weather.gov for the storm-alert and cloud-cover lookups. A wrong value degrades every solar forecast silently — the numbers still look plausible — so check it against your actual address.
  NOTIFY_CHANNEL:
    name: Notify Channel
    description: 'Where per-alert push notifications go: none (off, default), ntfy, pushover, webhook, or ha. ''ha'' posts Home Assistant persistent notifications, visible in the HA UI and companion app with no external setup; the other channels stay silent until their fields below are filled — ntfy needs a topic, pushover a token and user key, webhook a URL. Leaving it at none also means that if Night-Charge Write Mode is supervised or auto, the nightly reserve write can only arm when the spoken announcement gets through.'
  NOTIFY_MIN_SEVERITY:
    name: Notify Minimum Severity
    description: 'Lowest alert severity that earns a push notification: warning (the default) pushes warnings and criticals, critical pushes criticals only — choosing critical means warning-level problems never reach your phone. Applies to the push channel only; the audible broadcast has its own Broadcast Minimum Severity. The nightly night-charge plan notice is sent regardless of this setting.'
  NOTIFY_RESOLVED:
    name: Notify On Resolved
    description: Also sends a 'Resolved:' push once an alert clears, so you get the all-clear and not only the alarm. On by default; turn it off to receive firing notifications only. An all-clear goes out only for alerts that actually pushed when they fired — one suppressed by quiet hours or by Notify Minimum Severity never gets one — and nothing is sent at all while Notify Channel is none.
  NOTIFY_NTFY_SERVER:
    name: ntfy Server URL
    description: Base URL of the ntfy server your push notifications are sent through; the default https://ntfy.sh is the free public server, so leave it alone unless you self-host. It is used only when Notify Channel is set to ntfy, and nothing is sent until you also set an ntfy Topic. Give the server root only - the topic is appended for you, and a trailing slash is trimmed.
  NOTIFY_NTFY_TOPIC:
    name: ntfy Topic
    description: 'The ntfy topic alerts are published to — the part after the server URL, e.g. my-ecoflow-alerts. Required for the ntfy channel: it counts as configured only once this is non-empty, and sends fail outright while it is blank. On the public ntfy.sh (the default server) a topic is not a secret — anyone who guesses the name can read your alerts — so pick a long, unguessable string. Only used when Notify Channel is set to ntfy; default empty.'
  NOTIFY_PUSHOVER_TOKEN:
    name: Pushover Application Token
    description: Application (API) token from your Pushover app registration. The pushover channel counts as configured only when this and the Pushover User Key are both non-empty; with either blank every push is dropped, including critical ones, and the add-on's notification status reports the channel as unconfigured. Ignored unless Notify Channel is set to pushover; masked on entry and never shown back.
  NOTIFY_PUSHOVER_USER:
    name: Pushover User Key
    description: Your Pushover user (or group) key, used only when Notify Channel is set to pushover. This and the Pushover Application Token must both be filled in — with either one blank the pushover channel sends nothing at all, so alert pushes stop silently. Empty by default, and masked as you type.
  NOTIFY_WEBHOOK_URL:
    name: Webhook URL
    description: HTTP or HTTPS endpoint that receives one JSON POST per alert, carrying the fields title, body, severity and ts. Required when Notify Channel is set to webhook; leave it empty and that channel sends nothing at all. No authentication header is added, so put any token in the URL itself and prefer an endpoint on your own network.
  NOTIFY_QUIET_HOURS:
    name: Notify Quiet Hours
    description: Local-time window in which pushes are held back and rolled into the morning digest (7am by default) instead of pinging you overnight; on-screen alerts still appear immediately. Format is 24-hour HH-HH, e.g. 22-06 for 10pm to 6am (the default); it may wrap past midnight, and a blank, malformed, or start-equals-end value disables the window entirely. Critical alerts are held too unless Critical Alarms Break Quiet Hours is on, so by default nothing wakes you — the audible broadcast has its own separate Broadcast Quiet Hours.
  NOTIFY_DIGEST_HOUR:
    name: Morning Digest Hour
    description: Local hour, 0-23, at which alerts held back during notification quiet hours are delivered as one morning digest, most severe first. Default 7 means 7 AM. Only applies when a Notify Channel is configured — with no channel the held alerts are logged and the queue is dropped rather than delivered later.
  BROADCAST_ENABLED:
    name: Enable Audible Broadcasts
    description: 'Master switch for spoken alarm announcements and chimes on your Home Assistant media_player speakers (HomePod/Sonos/ecobee). Off by default, and does nothing until you also list at least one speaker in Broadcast Targets; push notifications are separate and unaffected. Warning: the dashboard''s live on/off toggle is a saved override that outranks this option and survives restarts — if the two disagree the dashboard wins, so alarms can stay silent with this set to on.'
  BROADCAST_TARGETS:
    name: Broadcast Target Speakers
    description: 'Comma-separated Home Assistant media_player entity IDs that audible alarms play on through Music Assistant, for example media_player.living_room, media_player.kitchen. Entries that do not start with ''media_player.'' are dropped without warning, and empty (the default) means no alarm is ever spoken even with broadcasts enabled - SIP announce targets do not substitute for this list, they only add to it. Recheck this list after renaming a speaker in Home Assistant: a stale entity ID still counts as configured and silently drops alarms, though the add-on log names the drifted ID shortly after startup.'
  BROADCAST_SIP_TARGETS:
    name: Broadcast SIP / Intercom Targets
    description: Comma-separated media_player entity IDs that receive alarms via media_player.play_media(announce) instead of Music Assistant — for SIP / intercom endpoints Music Assistant cannot drive, such as the Switchboard cordless (media_player.cordless_speaker). They get the same spoken audio and are dispatched before the Music Assistant availability check, so they still sound when the Music Assistant speakers are unavailable. Each entry must start with 'media_player.'; an entity also listed under Broadcast Target Speakers is dropped here (Music Assistant wins) so nothing is announced twice, and at least one Broadcast Target Speaker must be configured or no broadcast runs at all.
  BROADCAST_MIN_SEVERITY:
    name: Broadcast Minimum Severity
    description: Decides whether the overall fleet-condition announcement also speaks at the yellow (warning) level. With 'critical' (the default) only the red condition is spoken; 'warning' speaks yellow too. It does not gate the dedicated alarms — the SoC ladder, the runway alarm and the night-charge notices announce regardless — and it is separate from Notify Minimum Severity, which governs pushes.
  BROADCAST_QUIET_HOURS:
    name: Broadcast Quiet Hours
    description: Overnight window during which the speakers stay silent, written as whole local hours 'HH-HH' on a 24-hour clock and wrapping past midnight, so the default 22-06 mutes 10 PM through 5:59 AM; leave it empty for no quiet window. By default it silences EVERY tier, critical alarms included — only the spoken announcement is held, the on-screen alert still appears immediately. Turn on Critical Alarms Break Quiet Hours below if you want high and critical alarms to sound overnight.
  CRITICAL_BREAKS_QUIET_HOURS:
    name: Critical Alarms Break Quiet Hours
    description: 'Whether the most severe alarms may sound and push during quiet hours. Off by default, so every tier is held overnight — the alert still appears on-screen immediately and the push is delivered in the morning digest, but the audible announcement is dropped outright, never replayed later. Turn it on to be woken for genuine emergencies: on the push channel it releases critical alerts during Notify Quiet Hours, and on the audible channel it releases red condition alarms plus high- and critical-priority alarms during Broadcast Quiet Hours.'
  BROADCAST_AUDIO_BASE:
    name: Broadcast Audio Base URL
    description: The address your speakers use to fetch announcement WAV files from this add-on; it must resolve from the speakers themselves, not just from your browser. The default http://homeassistant.local:8787 relies on mDNS, so if announcements stay silent while the log says they were sent, put your Home Assistant host's IP here instead, e.g. http://192.168.1.50:8787. A trailing slash is trimmed and a blank value falls back to the mDNS default.
  BROADCAST_VOLUME:
    name: Broadcast Volume
    description: 'Speaker level for audible alarm announcements, from 0.0 (silent) to 1.0 (full); default 0.5. It is the only place the level is set — the Alert Console no longer carries a slider, so the form and what the speakers play can never disagree — and a change takes effect when the add-on restarts. Announce Volume Override, below, still wins: any value entered there pins the announce level and leaves this one informational.'
  BROADCAST_ANNOUNCE_VOLUME:
    name: Announce Volume Override
    description: Sets the loudness of the spoken announcement. Leave empty (the default) to play at Broadcast Volume x 100; enter 0-100 to pin that exact level; or enter off, none, or standing to send no volume command at all and let each speaker play at its current level (more reliable on ecobee and AirPlay speakers). A number here also sets each target speaker's own volume before playing and does not restore it afterwards, so entering 0 leaves your alarm speakers silent — never use it as a mute.
  BROADCAST_USE_PRE_ANNOUNCE:
    name: Use Pre-Announce Tone
    description: Plays Music Assistant's short attention tone before the spoken message, which wakes a sleepy ecobee or AirPlay speaker so it does not clip the first words. Off by default; it adds the tone's length ahead of every message and applies only to the Music Assistant speakers, not to the SIP/intercom targets.
  BROADCAST_LEAD_SILENCE_MS:
    name: Broadcast Lead-In Silence (ms)
    description: Milliseconds of silence played before every audible alarm so slow speakers — AirPlay and ecobee especially — can join the stream before the chime starts instead of clipping its first note. Default 1000; range 0 to 5000. Raise it toward 1500 if the start is still cut off; 0 removes the padding and the delay with it, at the cost of a clipped opening on slow speakers.
  BROADCAST_REPEAT:
    name: Broadcast Repeat Count
    description: How many times the whole chime-plus-message block plays per announcement, so a missed first pass gets a second. 1 to 3, default 2; the silence between passes is set by Broadcast Repeat Gap. Ignored on bilingual announcements, where the English-then-Spanish pair is itself the repeat.
  BROADCAST_REPEAT_GAP_MS:
    name: Broadcast Repeat Gap (ms)
    description: 'Silence inserted between announcement blocks, so a repeat - or the Spanish pass, when bilingual announcements are actually running - is audibly separate from the block before it. Range 0-5000 ms, default 1500; set 0 to run the blocks together with no pause. It has no effect only when the announcement is a single block: Broadcast Repeat Count at 1 with no Spanish pass playing.'
  BROADCAST_CHIME_GAP_MS:
    name: Broadcast Chime Gap (ms)
    description: Silence inserted between the alert chime and the spoken message so the chime can decay instead of talking over the announcement (0-5000 ms, default 1000; set 0 to remove the pause). It applies to every chime in an announcement, including each repeat and each language pass of a bilingual alarm. No effect unless audible broadcasts are enabled and at least one target speaker is configured.
  BROADCAST_ANNOUNCE_RETRIES:
    name: Announce Retries
    description: How many extra times to re-issue the spoken announcement when the Music Assistant service call itself returns an error, waiting about 1.5 seconds between attempts. Range 0-3, default 1; set 0 to never retry. It cannot recover audio you merely did not hear — in that case the call already succeeded, so raising this will not fix a quiet speaker.
  BROADCAST_WYOMING_HOST:
    name: Wyoming TTS Host
    description: Hostname or IP of the Wyoming (Piper) server that turns alarm text into speech. The default core-piper reaches Home Assistant's Piper add-on; change it only if Piper runs elsewhere, for example piper.lan or 192.0.2.10. Enter a bare host with no scheme and no port (the port has its own option) — if the host is wrong or unreachable, alarms still sound, but degrade to a chime with no spoken message.
  BROADCAST_WYOMING_PORT:
    name: Wyoming TTS Port
    description: TCP port of the Wyoming/Piper text-to-speech server that renders the spoken alarms; it pairs with the Wyoming TTS Host set above. Default 10200 is the Piper add-on's standard port and is almost always correct — change it only if your Piper instance listens elsewhere. Entering 0 is ignored and 10200 is used.
  BROADCAST_WYOMING_VOICE:
    name: Wyoming TTS Voice (English)
    description: Which Piper voice speaks the English announcements, for example en_US-amy-medium or en_GB-alan-low. Leave empty (the default) to use whatever voice the Piper add-on is already configured with. The name must match a voice installed on your Piper server — they are listed in its startup log — because a name it does not have makes the render fail and the alarm falls back to a chime with no spoken words.
  BROADCAST_BILINGUAL:
    name: Bilingual Announcements
    description: When on (the default), each spoken alarm plays once in English and then once in Latin American Spanish. It stays a no-op until Wyoming TTS Voice (Spanish) below names a Spanish voice that exists on your Piper server. While the second pass is actually running it replaces the repeat pass, so Broadcast Repeat Count no longer multiplies the spoken message; turn this off to go back to English-only with repeats.
  BROADCAST_WYOMING_VOICE_ES:
    name: Wyoming TTS Voice (Spanish)
    description: 'Name of the Spanish Piper voice used for the second, Spanish pass of each spoken alarm, e.g. es_MX-claude-high. Filling this in is what actually turns bilingual announcements on: leave it empty and alarms stay English-only even with Bilingual Announcements enabled. The voice must already be installed on your Wyoming/Piper server and produce 22050 Hz 16-bit mono audio (most -medium and -high voices do); if it does not, the Spanish pass is dropped and only the English announcement plays.'
  BATTERY_SOC_ALARM_ENABLED:
    name: Battery SoC Alarm
    description: Sounds the escalating spoken alarm as the Smart Home Panel 2 backup pool falls through 50/40/30/20/15/10/8/4/2 percent (advisory down to 30, caution at 20 and 15, critical at 10 and below). On by default; turning it off silences only this audible ladder — the matching dashboard alert and any push notification still fire. It also needs Enable Audible Broadcasts on with at least one target speaker, obeys the per-priority Alert Settings toggles and quiet hours, and while the grid is carrying the house the emergency tiers speak as a calm advisory instead.
  BATTERY_RUNWAY_ALARM_ENABLED:
    name: Battery Runway Alarm (audible)
    description: Speaks an escalating alarm when the 24-hour projection (forecast solar minus forecast load) shows the backup pool reaching its reserve floor, or emptying, before the sun recovers — early enough to shed load, unlike the SoC ladder that only fires once the pool has already fallen. On by default; turning it off silences the spoken alarm only, and the matching on-screen alert and the push it can raise still fire. The spoken alarm is suppressed automatically while the grid is carrying the house, and it still obeys the per-priority alert toggles and quiet hours.
  BATTERY_RUNWAY_ALARM_REANNOUNCE_MIN:
    name: Runway Alarm Re-announce Interval (min)
    description: How long the Battery Runway Alarm waits before repeating its spoken announcement while the same depletion projection still stands. Default 60 minutes; accepts 5 to 720 (5 minutes to 12 hours). A rise to a higher priority announces immediately without waiting out the interval, and the setting does nothing while the Battery Runway Alarm is off.
  GRID_AVAILABLE:
    name: Grid Import Available
    description: 'Tells the add-on whether this site can import from the utility grid at all. Leave it off for an islanded off-grid system: the dispatch optimizer then stops planning around imports that physically cannot happen, and the backup pool reaching its reserve floor stays a CRITICAL alarm instead of being downgraded to an on-screen advisory - that downgrade needs the grid to look present, via this flag, a Grid Presence Entity, live measured import, or the Smart Home Panel 2''s own grid-OK reading. Turn it on only if you are genuinely grid-tied; a configured Grid Presence Entity takes over from this flag for grid presence, but the dispatch optimizer reads this flag either way.'
  GRID_PRESENCE_ENTITY:
    name: Grid Presence Entity
    description: Optional Home Assistant entity reporting whether the utility grid is energized; it makes the backup-pool floor alarm grid-aware, so with the grid confirmed present and carrying the load, hitting the ~10% reserve floor is downgraded from CRITICAL to an on-screen advisory. Point it at a binary_sensor, input_boolean or switch (on / present / connected = energized) or at a line-voltage sensor (magnitude above 50 = energized), e.g. binary_sensor.grid_available. Anything unavailable, unknown, unrecognized, or not refreshed for 2 minutes counts as no grid and the floor stays CRITICAL unless measured grid flow or the SHP2's own grid flag proves otherwise. Once set it replaces the coarse Grid Import Available switch, which is consulted only while this is empty (the default), so an entity that wrongly reads energized weakens this alarm — the panel still withholds the downgrade while the pool keeps draining at the floor, but choose the entity carefully.
  HOST_POWER_ENTITY:
    name: Host Power Entity
    description: Optional Home Assistant entity that lets the alarm watch its own host — the Pi it runs on, and the whole monitor's single point of failure. Point it at the Raspberry Pi Power Supply Checker's binary_sensor (device_class problem, on = under-voltage), e.g. binary_sensor.rpi_power_status, and you get a warning-level alert when the Pi reports under-voltage, in time to fix a marginal supply or a sagging circuit before it browns the host out and takes every channel dark. Blank (the default) leaves the check dormant, and a reading more than two minutes old reports unknown rather than replaying a frozen value.
  LOAD_SHEDDING_ADVISORY_ENABLED:
    name: Load-Shedding Advisor
    description: Turns on the read-only advisor that watches off-grid runway and recommends which of your allowlisted loads to shed to stretch it. It only publishes the recommendation to the panel, the API and its MQTT entities — it never switches anything, so your own Home Assistant automations decide whether to act. On by default, but it does nothing until you list at least one load in Sheddable Loads, and it recommends nothing while the grid is carrying the house.
  LOAD_SHEDDING_SHED_ENTITIES:
    name: Sheddable Loads
    description: The allowlist of loads the advisor may name when it recommends shedding during a shortfall; nothing outside this list is ever suggested, and nothing is ever switched off for you - the recommendation is advisory only, your own Home Assistant automations decide whether to act. Each comma-separated entry is entity_id:priority:label:estimated_watts[:shp2_circuit], where priority 1 is shed first (least important) and the optional last field is an SHP2 circuit number used to read measured watts instead of your estimate, e.g. switch.pool_pump:2:Pool pump:400:5,switch.irrigation:1:Irrigation:200. Empty (the default) leaves the advisor with nothing to recommend, and this list only matters while the Load-Shedding Advisor is on; an entry that looks like a medical, well-pump, refrigeration, network or security load is still accepted and only logged as a startup warning, so check it yourself.
  LOAD_SHEDDING_RUNWAY_THRESHOLD_H:
    name: Shed-Trigger Runway (Hours)
    description: 'How low the projected off-grid runway (hours to reserve, or hours to empty) must fall before the advisor starts naming loads to shed; in hours, default 4.0 — higher advises earlier, lower waits longer. It also moves the release point, since a shed is only withdrawn once the projection clears this threshold plus the Restore Margin. The advisor only ever recommends: it never switches anything off, it stays silent while the grid is carrying the house, and it does nothing at all unless Load-Shedding Advisor is on and Sheddable Loads names at least one entity.'
  LOAD_SHEDDING_RESTORE_MARGIN_H:
    name: Restore Margin (Hours)
    description: How much runway beyond the shed-trigger threshold the recommendation aims to buy, in hours. The advisor keeps adding circuits to its suggested shed list until the projected runway would reach Shed-Trigger Runway plus this margin (default 2.0), so a larger value produces a longer list of circuits to turn off. It is advice only — nothing is ever switched off for you — and it does nothing unless the Load-Shedding Advisor is on with at least one entry in Sheddable Loads.
  NIGHT_CHARGE_ADVISOR_ENABLED:
    name: Night-Charge Advisor
    description: 'Runs the night-charge planner: on days it expects a shortfall, it works out how much cheap overnight grid energy to buy so the home avoids importing during the 4-7pm on-peak window and still keeps a cushion above the reserve floor. It publishes that plan to the night-charge sensors and MQTT entities and sends one nightly notification, by default around 21:30. Whether the add-on may act on the plan is a separate setting, Night-Charge Write Mode, which defaults to advisory and never writes to a device; turn this off (it is on by default) and no plan is computed at all - the night-charge sensors go blank, no nightly notification is sent, and no reserve write can happen whatever that mode says.'
  NIGHT_CHARGE_MODE:
    name: Night-Charge Write Mode
    description: 'How far the night-charge engine may act on its own plan: advisory (the default) never writes to any device — sensors and the nightly notification only. supervised announces each evening''s plan (audible broadcast plus a Home Assistant notification) with a cancel deadline and, unless you cancel from the panel, makes ONE audit-logged write raising the SHP2 backup reserve to the plan target (clamped to the device''s 10-50% range) just before the cheap window opens, restoring the previous value after the window closes; no write is attempted while a critical (red) condition is active, and the reserve-floor alarms are independent of this path throughout. auto is reserved for a future unattended mode: today it runs the identical announced, cancellable flow, and is demoted outright to supervised until the write-readiness gate graduates on real actuated-night evidence.'
  ARB_OUTAGE_CUSHION_PCT:
    name: Outage Cushion (%)
    description: Battery headroom to hold above the reserve floor as insurance against an unexpected outage, in percent of total pool capacity (0-40, default 15). The night-charge advisor sizes the overnight buy so its worst-case low-solar, high-load projection still ends at or above floor plus cushion; raise it for more resilience and a bigger overnight buy, lower it to buy less. In supervised or auto Night-Charge Write Mode it also raises the reserve setpoint actually written to the Smart Home Panel 2, though the write is still clamped to the device's 10-50% range; the independent reserve-floor alarm is never affected.
  ARB_MIN_BUY_KWH:
    name: Minimum Buy (kWh)
    description: 'Below this recommended buy size the advisor calls the night a "hold" instead of nagging about a trivial top-up. Default 1.0 kWh; the field accepts 0-50 and roughly 0.5 to 3 is sensible. The same number doubles as the clean-baseline test in the morning hindsight score: on a night the engine did NOT actuate, overnight grid import above this figure leaves the night unscored rather than graded against a baseline the grid already propped up.'
  ARB_CHARGE_CAP_KW:
    name: Grid-Charge Power Cap (kW)
    description: Ceiling on how fast the batteries can be charged from the grid, used to size how much energy the cheap overnight window can realistically deliver. Default 7.2 kW is the charge rate observed on this system (chChargeWatt), not a published hardware spec — set it too high and the advisor recommends a buy the hardware cannot finish. Advisory sizing only; this never commands a device.
  ARB_GRID_INPUT_CAP_KW:
    name: Shared Grid-Input Envelope (kW)
    description: 'Caps the grid power the overnight charge plan assumes it can draw, shared between house pass-through and battery charging: a large concurrent load — an EV session above all — leaves the packs only the remainder, so the plan sizes a smaller buy and discloses the shortfall instead of over-promising. In kW; default 17, the coexistence figure measured at this site; set 0 to ignore contention entirely, which lets the plan assume the full charge cap even while the house is drawing hard. It never pauses or throttles the EV charger, but it is not purely cosmetic: with Night-Charge Write Mode set to supervised or auto, the plan sized here is the one written to the Smart Home Panel 2 backup reserve.'
  ARB_LOAD_P90_FACTOR:
    name: Load Safety Margin (P90)
    description: Sets how much the night-charge planner pads the forecast household load when it sizes the overnight purchase, so it plans for a heavier-than-expected night instead of under-buying. Default 1.15 assumes 15% more load than forecast; raise it toward 2.0 to buy more cheap overnight energy (and pay for energy you may not need), lower it toward 1.0 to buy less and accept more risk of importing during the 4-7pm peak. Range 1.0-2.0; it only sizes the plan, never writes to a device, and it has no effect unless the Night-Charge Advisor is on.
  NIGHT_CHARGE_NOTIFY_HOUR:
    name: Night-Charge Notify Hour
    description: 'Local (America/Phoenix) hour at which the once-nightly night-charge job runs: it records the night''s plan row, scores yesterday''s outcome, and sends the single advisory notification. In supervised or auto Night-Charge Write Mode this is also the moment tonight''s bounded reserve write is announced and armed, and the cancel deadline is measured from here. Default 21 (9pm), early enough to act before the overnight window opens; the job''s catch-up window closes at 23:00, so an hour of 23 could never fire and is silently treated as 22, and the whole setting is inert while the Night-Charge Advisor is off.'
  NIGHT_CHARGE_NOTIFY_MINUTE:
    name: Night-Charge Notify Minute
    description: 'Minute of the Night-Charge Notify Hour at which the nightly charge advisory is sent; default 30, so 21:30 with the default hour, and the valid range is 0–59. Times are Phoenix time (America/Phoenix, fixed in the code — it does not follow your Home Assistant time zone). The advisory only goes out inside the window from that time to 23:00: if the add-on is down or restarting for the whole window, that night''s advisory is skipped rather than sent late.'
  NIGHT_CHARGE_NOTIFY_ON_HOLD:
    name: Notify On "Hold" Nights
    description: When on (the default), the nightly charge advisory is sent even on nights when no grid charge is needed, so you get a standing confirmation that the job ran. Turn it off to hear only from nights where a charge is actually recommended. Either way, a night whose inputs were incomplete still notifies, so a missing plan is never silent.
  HEARTBEAT_URL:
    name: External Heartbeat URL (dead-man's switch)
    description: An https ping URL from an outside monitoring service (healthchecks.io or similar). The add-on sends a GET on the interval set below, so if the pings stop — host dead, container killed, power lost — that outside service alerts you from beyond the failure this add-on could no longer report itself. Leave empty (the default) to disable; anything that is not a parseable https:// URL is rejected outright and no pings are sent at all, with a single warning in the log, so check the log after setting it. The URL is a secret — anyone holding it can fake your heartbeat — and is never logged in full, only its hostname.
  HEARTBEAT_INTERVAL_S:
    name: Heartbeat Interval (seconds)
    description: How often the dead-man's-switch ping is sent to the external heartbeat URL above (60-3600 seconds, default 300). Set the external check's expected period to this same value and its grace to roughly two intervals, so one missed ping does not page you; a longer interval also means a dead add-on or a dead host goes unnoticed for correspondingly longer. Ignored while the heartbeat URL is empty; with a URL set, the first ping goes out immediately at startup, and this is the only alarm path that survives a total host or power failure.
  TARIFF_APS_ONPEAK_SUMMER_CENTS:
    name: APS On-Peak ¢/kWh (Summer)
    description: 'Effective on-peak energy price in cents per kWh for the summer season (APS R-EV: 4–7pm Mon–Fri, May–October), taken from a real bill with adjustors included. Leave blank until you have that number: blank leaves the summer on-peak price unset in the tariff view, and the cost/savings KPIs fall back to the flat default rate (17 ¢/kWh unless you override it) rather than an invented APS price. It only takes effect once APS Rates Confirmed is also on and the matching summer off-peak rate is filled in.'
  TARIFF_APS_ONPEAK_WINTER_CENTS:
    name: APS On-Peak ¢/kWh (Winter)
    description: Winter on-peak energy price in cents per kWh, taken from a real APS bill (the R-EV winter season runs November through April). It feeds the cost and savings figures and the nightly plan's recorded rates only when Rates Confirmed is on and the matching APS Off-Peak ¢/kWh (Winter) is also filled in; otherwise those figures fall back to the flat default rate. Leave it blank until you have the number from a bill — a blank or zero value is ignored rather than guessed at.
  TARIFF_APS_OFFPEAK_SUMMER_CENTS:
    name: APS Off-Peak ¢/kWh (Summer)
    description: 'Effective summer off-peak energy price in cents per kWh from a real bill — on APS R-EV this is the residual bucket: every May-October hour that is not on-peak (4-7pm Mon-Fri) and not overnight (11pm-5am Mon-Fri), plus all weekends and observed holidays. It stays inert until Rates Confirmed is turned on: while that is off the R-EV price table reports no cents at all, so the night-charge arbitrage figures publish as null, and the cost and dispatch reports fall back to a flat placeholder rate (17 ¢/kWh unless overridden) rather than your real bill. Leave blank until you have confirmed the number.'
  TARIFF_APS_OFFPEAK_WINTER_CENTS:
    name: APS Off-Peak ¢/kWh (Winter)
    description: 'Effective winter off-peak price in cents per kWh on the APS R-EV plan - November through April, covering every hour outside the on-peak (4-7pm Mon-Fri), winter super-off-peak (10am-3pm Mon-Fri) and overnight (11pm-5am Mon-Fri) windows, plus all weekends. Take it from a real bill with adjustors included, not the published base rate, and leave it blank until you have that number. A blank rate is never guessed: winter off-peak dollar figures publish as null, and the cost KPIs fall back to their flat-rate default of 17 cents per kWh - it is the separate Rates Confirmed switch, not this field, that decides whether dollar outputs are published at all.'
  TARIFF_APS_OVERNIGHT_CENTS:
    name: APS Overnight ¢/kWh
    description: Your effective price in cents per kWh for the APS R-EV overnight window (11pm-5am Mon-Fri, year-round), taken from a real bill with riders and adjustments included. Enter cents rather than dollars, as a plain decimal such as 4.5; one entry covers both summer and winter. It prices that window in the tariff read-out and in each night's charge-plan record — it does not decide when the system charges, since the window is fixed by the clock — and prices read as null until Rates Confirmed is also on.
  TARIFF_APS_SUPEROFFPEAK_WINTER_CENTS:
    name: APS Winter Super-Off-Peak ¢/kWh
    description: 'Effective price of the APS R-EV winter super-off-peak period in cents per kWh — 10am-3pm Mon-Fri, Nov-Apr, the cheap midday tier that overlaps solar production. Take it from a real bill and leave it blank until you have confirmed it. Entering a number does nothing on its own: every dollar figure stays null until Rates Confirmed is turned on, and there is no summer field because the period is winter-only.'
  TARIFF_APS_RATES_CONFIRMED:
    name: Rates Confirmed
    description: Confirms that the six APS R-EV rate fields above hold real numbers off your bill. While it is off (the default), every cost and savings dollar figure on the panel is priced from a flat 17 cents/kWh placeholder instead of your actual rates, and the night-charge tariff record is stamped unconfirmed rather than priced. Turning it on while either rate for the current season is still blank silently keeps that flat placeholder, so fill the rates in first.
  NWS_ENABLED:
    name: NWS Storm Alerts
    description: 'Adds the free US National Weather Service feed for your forecast coordinates: active severe-weather alerts, which can raise a pre-charge-to-100%-before-the-storm alert, plus a second cloud-cover source that is averaged into the solar forecast and widens its uncertainty band when the two sources disagree. No API key or account needed, and it never writes to a device. Off by default; outside the US the feed comes back empty, which is a harmless no-op.'
  MQTT_DISCOVERY_ENABLED:
    name: MQTT Discovery
    description: Publishes the add-on's fleet metrics to your MQTT broker as Home Assistant auto-discovery sensors, so they appear on their own under an "EcoFlow Panel" device with no configuration.yaml edits. It stays off unless MQTT Broker Host below is also filled in - both are required, and the add-on log says so at startup when only one is set. Note that it also publishes four writable alarm-priority switches, so anyone who can reach the broker can silence the push and audible annunciation of a whole priority (the alarms themselves stay visible in the panel). Off by default.
  MQTT_DISCOVERY_HOST:
    name: MQTT Broker Host
    description: Hostname or IP of your MQTT broker, e.g. core-mosquitto (HA's Mosquitto add-on) or 192.168.1.50. Required for MQTT Discovery — if empty, discovery stays off even when the toggle is on. Default empty.
  MQTT_DISCOVERY_PORT:
    name: MQTT Broker Port
    description: TCP port of the MQTT broker the add-on publishes its Home Assistant entities to. Leave it at 1883 unless your broker listens elsewhere; the add-on connects with plain, unencrypted MQTT v5, so a TLS port such as 8883 will fail to connect. Ignored unless MQTT Discovery is on and MQTT Broker Host is set.
  MQTT_DISCOVERY_USER:
    name: MQTT Username
    description: Username the add-on uses to log in to your MQTT broker when it publishes discovery entities. Leave empty if your broker accepts anonymous connections. Read only when MQTT Discovery is on and MQTT Broker Host is set; pair it with MQTT Password.
  MQTT_DISCOVERY_PASS:
    name: MQTT Password
    description: Password for the MQTT broker, paired with MQTT Username; leave it blank for an anonymous broker. It is only read when MQTT Discovery is on and an MQTT Broker Host is set. The field is masked as you type, but the value is stored in the add-on's options and sent over a plain, unencrypted MQTT connection — use a broker account that only matters on your LAN, not a password you reuse elsewhere.
  MQTT_DISCOVERY_PREFIX:
    name: MQTT Discovery Prefix
    description: Topic prefix the add-on publishes its auto-discovery messages under. It must match the discovery prefix configured in your Home Assistant MQTT integration, or none of the sensors will ever appear. "homeassistant" is the Home Assistant default and is almost always correct; ignored unless MQTT discovery is enabled and an MQTT host is set.
  TELNET_ENABLED:
    name: Enable Telnet TUI
    description: Opens the raw telnet control-room dashboard on the Telnet TUI Port (default 2323), a full-screen terminal view of the fleet reachable from any telnet client on your network. It is unauthenticated unless you set a Console Password, and telnet is unencrypted either way, so only enable it on a trusted network; the default is off. This does not affect the browser version of the same console at /console, which stays available through the Home Assistant sidebar whatever you set here.
  TELNET_PORT:
    name: Telnet TUI Port
    description: 'TCP port the telnet control-room TUI listens on inside the add-on; default 2323. Leave it at 2323 unless you know what you are doing: the add-on publishes container port 2323, and the Network section can only change the host-side port, so any other value here leaves the TUI unreachable from your LAN. Ignored while Enable Telnet TUI is off, which is the shipped default — and when it is on, the TUI is exposed on your LAN with no login unless you set a Console Password, so keep it on a trusted network.'
  TUI_USERNAME:
    name: Console Username
    description: 'Username for the control-room console login, used by both the telnet TUI and the /console browser terminal; blank (the default) means operator. It does nothing until Console Password is set — with an empty password there is no login prompt at all, and anyone on your LAN who reaches the console port is straight in. Use printable ASCII, 64 characters or fewer: the prompt cannot type anything else, so a longer or accented name would lock you out.'
  TUI_PASSWORD:
    name: Console Password
    description: 'Password for the control-room console login, covering both the telnet TUI and the /console browser terminal; three failed attempts drop the connection, and ten failures within ten minutes lock out new attempts across all sessions. Leave it empty (the default) and there is no login at all - connections open straight into the console, so only do that on a trusted LAN, and note that telnet itself is unencrypted. Use printable ASCII, 64 characters or fewer: the login prompt cannot type anything else, so a longer or non-ASCII value locks you out of the console entirely (the add-on warns about it at startup).'
  TUI_TRUSTED_ORIGINS:
    name: Trusted Browser Origins (advanced)
    description: 'Advanced security setting: a comma-separated list of exact browser origins (e.g. https://your-id.ui.nabu.casa) that the add-on treats as its own. Each entry is matched exactly, never as a wildcard, but any origin you list gets the same power the dashboard has — opening the /console terminal and websockets, and making write calls with no token, which includes disabling audible broadcasts, changing alert settings and cancelling the night-charge plan. Add only an origin you fully control; leave empty (the default), since the LAN and the Home Assistant sidebar already work without it.'
  RECORDER_RETENTION_DAYS:
    name: Telemetry Retention (days)
    description: How many days of raw telemetry samples the add-on keeps before the hourly cleanup deletes them - these samples are what back the charts, sparklines and the forecast and model-training windows. Default 30 days; raising it enables seasonal comparisons and deeper backtests, at roughly 25-30 MB of database growth per day for a full fleet, so check your free disk space before going long. Range 7-730, an unreadable value falls back to 30 rather than deleting everything, and the night-charge ledger and lifetime energy totals are never pruned by this setting.
  ECOFLOW_DEVICE_REACHABILITY:
    name: Device LAN Reachability Map
    description: Optional JSON object mapping each device serial to a Home Assistant ping binary_sensor (device_class connectivity) watching that device's LAN address, e.g. {"GBC0314XXXXXXXX":"binary_sensor.core1_lan"}. It only changes how an offline device is explained — reachable on the LAN but missing from the cloud is reported as a cloud-session wedge (do not power-cycle), unreachable is a real outage — and it never makes an alarm fire, change severity, or fall silent. Empty (the default) or malformed JSON leaves the whole feature dormant, and any single entry whose value is not a lower-case entity id of the form domain.object_id is silently dropped.
  WRITE_DEBUG_TOKEN:
    name: Write Debug Token (Advanced)
    description: Leave this empty (the default) unless you are actively probing undocumented EcoFlow commands. Any value unlocks POST /api/device/send-command, which forwards commands you compose straight to your Smart Home Panel 2 or Delta Pro Ultra; the guards are an allowlist of command sets, a size cap and a 30-second per-device cooldown, not a check that the command is sensible, so a wrong one can change how your backup power behaves. Callers must present this exact value in the x-write-debug-token header and reach the add-on through HA ingress, the panel's own origin, or with the panel write token; clearing the field closes the endpoint again.
