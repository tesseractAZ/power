# Home Assistant Configuration-page labels + inline help for the Power add-on.
# HA renders each option's `name` as its field label and `description` as the
# plain-text helper line beneath it. Keys MUST match config.yaml options exactly
# (a typo silently falls back to the raw KEY with no warning). Port labels live in
# config.yaml `ports_description:` — kept single-source, so no `network:` block here.
#
# v1.68.0 — every description re-verified against the code that reads the option and
# rewritten to lead with the EFFECT on the system rather than the mechanism. Keep the
# key order identical to config.yaml so the two files diff against each other cleanly.
configuration:
  ECOFLOW_ACCESS_KEY:
    name: EcoFlow Access Key
    description: 'IoT access key from the EcoFlow developer portal at developer.ecoflow.com, used together with the secret key below. Required: if either is empty the add-on logs a fatal error and exits instead of starting, so no device is polled and no alarm can fire. Masked on entry and never shown back.'
  ECOFLOW_SECRET_KEY:
    name: EcoFlow Secret Key
    description: 'The secret half of your EcoFlow developer key pair, used as the HMAC-SHA256 signing key for every request to EcoFlow''s cloud (the key itself is never sent). Required: if it is blank, the add-on logs a fatal error and stops instead of starting. Copy it from the EcoFlow developer portal alongside the Access Key above and treat it like a password.'
  ECOFLOW_API_HOST:
    name: EcoFlow API Host
    description: Base URL of the EcoFlow cloud API. Every REST poll goes here, and the MQTT broker address and credentials are fetched from it too, so this one value decides which region the add-on talks to. Leave the default https://api-a.ecoflow.com unless sign-in fails with a 401, then try https://api-e.ecoflow.com (EU) or https://api-us.ecoflow.com (US); must be a full URL including https://.
  LOG_LEVEL:
    name: Log Level
    description: Verbosity of the add-on log (Fastify/pino). info is the default and the right setting for normal running; debug or trace additionally restore the per-poll and per-minute recorder heartbeat lines, which help when troubleshooting but grow the log quickly. warn, error, or fatal quiet routine output, while failures, telemetry gaps, and anomalies keep logging at their own levels regardless.
  FORECAST_LAT:
    name: Site Latitude
    description: Latitude of the install site in decimal degrees, north positive; the default 33.4484 is a placeholder (Phoenix, AZ), so replace it with your site's. It sets where the solar irradiance forecast is fetched from, where day is told from night while a Core is offline and its solar is counted at the panel, and, when NWS storm alerts are enabled, which area's weather warnings are watched. A wrong value quietly degrades every solar prediction, since the runway, night-charge and storm pre-charge advice all rest on that forecast. With Use Home Assistant's Location on, Home Assistant's home location replaces this and Site Longitude from the start after it is read.
  FORECAST_LON:
    name: Site Longitude
    description: Longitude of the install site in decimal degrees, east positive and west negative; the default -112.074 is a placeholder (Phoenix, AZ). It is the point sent to Open-Meteo for the solar weather forecast and, when NWS Storm Alerts is on, to weather.gov for the storm-alert and cloud-cover lookups. A wrong value degrades every solar forecast silently — the numbers still look plausible — so check it against your actual address.
  NOTIFY_CHANNEL:
    name: Notify Channel
    description: 'Turns Home Assistant notifications on or off: none (default) or ha. ''ha'' does two things — it keeps a card in the HA notification drawer for every active condition (and clears it when the condition clears), AND, if you list one or more targets in Notify Push Targets below, it sends a real push to the Home Assistant companion app. Without targets you get the drawer card only, which the app shows just when you open it: no lock-screen alert, no sound. Set the targets if you want alerts to reach you when you are away from the house or asleep. Leaving this at none also means that if Night-Charge Write Mode is supervised or auto, the nightly reserve write can only arm when the spoken announcement gets through.'
  NOTIFY_MIN_SEVERITY:
    name: Notify Minimum Severity
    description: 'Lowest alert severity that earns a push notification: warning (the default) pushes warnings and criticals, critical pushes criticals only — choosing critical means warning-level problems never reach the notify channel, and so never reach your phone. Note that only CRITICAL alerts break Do Not Disturb (see Critical Alerts Break Do Not Disturb); warnings arrive as ordinary pushes either way. Applies to the push channel only; the audible broadcast has its own Broadcast Minimum Severity. The nightly night-charge plan notice is sent regardless of this setting.'
  NOTIFY_RESOLVED:
    name: Notify On Resolved
    description: Also sends a 'Resolved:' push once an alert clears, so you get the all-clear and not only the alarm. On by default; turn it off to receive firing notifications only. An all-clear goes out only for alerts that actually pushed when they fired — one suppressed by quiet hours or by Notify Minimum Severity never gets one — and nothing is sent at all while Notify Channel is none.
  NOTIFY_HA_PUSH_TARGETS:
    name: Notify Push Targets
    description: 'Comma-separated Home Assistant notify services that receive the push, with or without the ''notify.'' prefix — for example ''notify.mobile_app_iphone'' or ''mobile_app_iphone, mobile_app_ipad''. Use ''notify.notify'' to reach every registered companion-app device at once, which is the fail-loud choice for an alarm. Find the exact names under Developer Tools then Actions, filtered on ''notify''. Leave it empty and no push is sent at all: alerts appear only as a card in the HA notification drawer, which the companion app shows when you open it — no lock-screen alert and no sound.'
  NOTIFY_CRITICAL_BYPASS_DND:
    name: Critical Alerts Break Do Not Disturb
    description: 'On (the default), a CRITICAL alert — and only a critical one — carries the companion app''s critical-notification payload, so it sounds on your phone even through Do Not Disturb, Focus, or the silent switch. Warnings and advisories never do this; they arrive as ordinary pushes that respect your phone''s settings. That asymmetry is deliberate: a warning that behaves like an emergency teaches you to silence the channel that carries the emergencies. Turn this off if you would rather a genuine battery, reserve-floor or grid-loss emergency waited until you next looked at your phone. This is separate from Broadcast Quiet Hours, which only governs the in-house speakers.'
  NOTIFY_QUIET_HOURS:
    name: Notify Quiet Hours
    description: Local-time window in which pushes are held back and rolled into the morning digest (7am by default) instead of pinging you overnight; on-screen alerts still appear immediately. Format is 24-hour HH-HH, e.g. 22-06 for 10pm to 6am (the default); it may wrap past midnight, and a blank, malformed, or start-equals-end value disables the window entirely. Critical alerts are held too unless Critical Alarms Break Quiet Hours is on, so by default nothing wakes you — the audible broadcast has its own separate Broadcast Quiet Hours.
  NOTIFY_DIGEST_HOUR:
    name: Morning Digest Hour
    description: Local hour, 0-23, at which alerts held back during notification quiet hours are delivered as one morning digest, most severe first. Default 7 means 7 AM. Only applies when a Notify Channel is configured — with no channel the held alerts are logged and the queue is dropped rather than delivered later.
  BROADCAST_ENABLED:
    name: Enable Audible Broadcasts
    description: 'Master switch for spoken alarm announcements and chimes on your Home Assistant media_player speakers (HomePod/Sonos/ecobee). Off by default, and does nothing until you also list at least one speaker in Broadcast Targets; push notifications are separate and unaffected. Warning: the dashboard''s live on/off toggle is a saved override that outranks this option and survives restarts — if the two disagree the dashboard wins, so alarms can stay silent with this set to on.'
  BROADCAST_TARGETS:
    name: Broadcast Target Speakers
    description: 'Comma-separated Home Assistant media_player entity IDs that audible alarms play on through Music Assistant, for example media_player.living_room, media_player.kitchen. Entries that do not start with ''media_player.'' are dropped without warning, and empty (the default) means no alarm is ever spoken even with broadcasts enabled - SIP announce targets do not substitute for this list, they only add to it. Recheck this list after renaming a speaker in Home Assistant: a stale entity ID still counts as configured and silently drops alarms, though the add-on log names the drifted ID shortly after startup.'
  BROADCAST_SIP_TARGETS:
    name: Broadcast SIP / Intercom Targets
    description: Comma-separated media_player entity IDs that receive alarms via media_player.play_media(announce) instead of Music Assistant — for SIP / intercom endpoints Music Assistant cannot drive, such as a SIP phone or intercom exposed as a media player (for example media_player.intercom). They get the same spoken audio and are dispatched before the Music Assistant availability check, so they still sound when the Music Assistant speakers are unavailable. Each entry must start with 'media_player.'; an entity also listed under Broadcast Target Speakers is dropped here (Music Assistant wins) so nothing is announced twice, and at least one Broadcast Target Speaker must be configured or no broadcast runs at all.
  BROADCAST_MIN_SEVERITY:
    name: Broadcast Minimum Severity
    description: Decides whether the overall fleet-condition announcement also speaks at the yellow (warning) level. With 'critical' (the default) only the red condition is spoken; 'warning' speaks yellow too. It does not gate the dedicated alarms — the SoC ladder, the runway alarm and the night-charge notices announce regardless — and it is separate from Notify Minimum Severity, which governs pushes.
  BROADCAST_QUIET_HOURS:
    name: Broadcast Quiet Hours
    description: Overnight window during which the speakers stay silent, written as whole local hours 'HH-HH' on a 24-hour clock and wrapping past midnight, so the default 22-06 mutes 10 PM through 5:59 AM; leave it empty for no quiet window. By default it silences EVERY tier, critical alarms included — only the spoken announcement is held, the on-screen alert still appears immediately. Turn on Critical Alarms Break Quiet Hours below if you want high and critical alarms to sound overnight.
  CRITICAL_BREAKS_QUIET_HOURS:
    name: Critical Alarms Break Quiet Hours
    description: 'Whether the most severe alarms may sound and push during quiet hours. Off by default, so every tier is held overnight — the alert still appears on-screen immediately and the push is delivered in the morning digest, but the audible announcement is dropped outright, never replayed later. Turn it on to be woken for genuine emergencies: on the push channel it releases critical alerts during Notify Quiet Hours, and on the audible channel it releases red condition alarms plus high- and critical-priority alarms during Broadcast Quiet Hours.'
  BROADCAST_AUDIO_BASE:
    name: Broadcast Audio Base URL
    description: The address your speakers use to fetch announcement WAV files from this add-on; it must resolve from the speakers themselves, not just from your browser. The default http://homeassistant.local:8787 relies on mDNS, so if announcements stay silent while the log says they were sent, put your Home Assistant host's IP here instead, e.g. http://192.168.1.50:8787. A trailing slash is trimmed and a blank value falls back to the mDNS default.
  BROADCAST_VOLUME:
    name: Broadcast Volume
    description: 'Speaker level for audible alarm announcements, from 0.0 (silent) to 1.0 (full); default 0.5. It is the only place the level is set — the Alert Console no longer carries a slider, so the form and what the speakers play can never disagree — and a change takes effect when the add-on restarts. Announce Volume Override, below, still wins: any value entered there pins the announce level and leaves this one informational.'
  BROADCAST_ANNOUNCE_VOLUME:
    name: Announce Volume Override
    description: Sets the loudness of the spoken announcement. Leave empty (the default) to play at Broadcast Volume x 100; enter 0-100 to pin that exact level; or enter off, none, or standing to send no volume command at all and let each speaker play at its current level (more reliable on ecobee and AirPlay speakers). A number here also sets each target speaker's own volume before playing and does not restore it afterwards, so entering 0 leaves your alarm speakers silent — never use it as a mute.
  BROADCAST_USE_PRE_ANNOUNCE:
    name: Use Pre-Announce Tone
    description: Plays Music Assistant's short attention tone before the spoken message, which wakes a sleepy ecobee or AirPlay speaker so it does not clip the first words. Off by default; it adds the tone's length ahead of every message and applies only to the Music Assistant speakers, not to the SIP/intercom targets.
  BROADCAST_LEAD_SILENCE_MS:
    name: Broadcast Lead-In Silence (ms)
    description: Milliseconds of silence played before every audible alarm so slow speakers — AirPlay and ecobee especially — can join the stream before the chime starts instead of clipping its first note. Default 1000; range 0 to 5000. Raise it toward 1500 if the start is still cut off; 0 removes the padding and the delay with it, at the cost of a clipped opening on slow speakers.
  BROADCAST_REPEAT:
    name: Broadcast Repeat Count
    description: How many times the whole chime-plus-message block plays per announcement, so a missed first pass gets a second. 1 to 3, default 2; the silence between passes is set by Broadcast Repeat Gap. Ignored on bilingual announcements, where the English-then-Spanish pair is itself the repeat.
  BROADCAST_REPEAT_GAP_MS:
    name: Broadcast Repeat Gap (ms)
    description: 'Silence inserted between announcement blocks, so a repeat - or the Spanish pass, when bilingual announcements are actually running - is audibly separate from the block before it. Range 0-5000 ms, default 1500; set 0 to run the blocks together with no pause. It has no effect only when the announcement is a single block: Broadcast Repeat Count at 1 with no Spanish pass playing.'
  BROADCAST_CHIME_GAP_MS:
    name: Broadcast Chime Gap (ms)
    description: Silence inserted between the alert chime and the spoken message so the chime can decay instead of talking over the announcement (0-5000 ms, default 1000; set 0 to remove the pause). It applies to every chime in an announcement, including each repeat and each language pass of a bilingual alarm. No effect unless audible broadcasts are enabled and at least one target speaker is configured.
  BROADCAST_ANNOUNCE_RETRIES:
    name: Announce Retries
    description: How many extra times to re-issue the spoken announcement when the Music Assistant service call itself returns an error, waiting about 1.5 seconds between attempts. Range 0-3, default 1; set 0 to never retry. It cannot recover audio you merely did not hear — in that case the call already succeeded, so raising this will not fix a quiet speaker.
  BROADCAST_WYOMING_HOST:
    name: Wyoming TTS Host
    description: Hostname or IP of the Wyoming (Piper) server that turns alarm text into speech. The default core-piper reaches Home Assistant's Piper add-on; change it only if Piper runs elsewhere, for example piper.lan or 192.0.2.10. Enter a bare host with no scheme and no port (the port has its own option) — if the host is wrong or unreachable, alarms still sound, but degrade to a chime with no spoken message.
  BROADCAST_WYOMING_PORT:
    name: Wyoming TTS Port
    description: TCP port of the Wyoming/Piper text-to-speech server that renders the spoken alarms; it pairs with the Wyoming TTS Host set above. Default 10200 is the Piper add-on's standard port and is almost always correct — change it only if your Piper instance listens elsewhere. Entering 0 is ignored and 10200 is used.
  BROADCAST_WYOMING_VOICE:
    name: Wyoming TTS Voice (English)
    description: Which Piper voice speaks the English announcements, for example en_US-amy-medium or en_GB-alan-low. Leave empty (the default) to use whatever voice the Piper add-on is already configured with. The name must match a voice installed on your Piper server — they are listed in its startup log — because a name it does not have makes the render fail and the alarm falls back to a chime with no spoken words.
  BROADCAST_BILINGUAL:
    name: Bilingual Announcements
    description: When on, each spoken alarm plays once in English and then once in Latin American Spanish. Off by default. It stays a no-op until Wyoming TTS Voice (Spanish) below names a Spanish voice that exists on your Piper server. While the second pass is actually running it replaces the repeat pass, so Broadcast Repeat Count no longer multiplies the spoken message; turn this off to go back to English-only with repeats.
  BROADCAST_WYOMING_VOICE_ES:
    name: Wyoming TTS Voice (Spanish)
    description: 'Name of the Spanish Piper voice used for the second, Spanish pass of each spoken alarm, e.g. es_MX-claude-high. Filling this in, with Bilingual Announcements on, is what turns the Spanish pass on: leave it empty and alarms stay English-only even with Bilingual Announcements enabled. The voice must already be installed on your Wyoming/Piper server and produce 22050 Hz 16-bit mono audio (most -medium and -high voices do); if it does not, the Spanish pass is dropped and only the English announcement plays.'
  BATTERY_SOC_ALARM_ENABLED:
    name: Battery SoC Alarm
    description: Sounds the escalating spoken alarm as the Smart Home Panel 2 backup pool falls through its charge levels (by default 50/40/30/20/15/10/8/4/2 percent — advisory down to 30, caution at 20 and 15, critical at 10 and below; Battery SoC Alarm Levels sets them). On by default; turning it off silences only this audible ladder — the matching dashboard alert and any push notification still fire. It also needs Enable Audible Broadcasts on with at least one target speaker, obeys the per-priority Alert Settings toggles and quiet hours, and while the grid is carrying the house the emergency tiers speak as a calm advisory instead.
  BATTERY_RUNWAY_ALARM_ENABLED:
    name: Battery Runway Alarm (audible)
    description: Speaks an escalating alarm when the 24-hour projection (forecast solar minus forecast load) shows the backup pool reaching its reserve floor, or emptying, before the sun recovers — early enough to shed load, unlike the SoC ladder that only fires once the pool has already fallen. On by default; turning it off silences the spoken alarm only, and the matching on-screen alert and the push it can raise still fire. The spoken alarm is suppressed automatically while the grid is carrying the house, and it still obeys the per-priority alert toggles and quiet hours.
  BATTERY_RUNWAY_ALARM_REANNOUNCE_MIN:
    name: Runway Alarm Re-announce Interval (min)
    description: How long the Battery Runway Alarm waits before repeating its spoken announcement while the same depletion projection still stands. Default 60 minutes; accepts 5 to 720 (5 minutes to 12 hours). A rise to a higher priority announces immediately without waiting out the interval, and the setting does nothing while the Battery Runway Alarm is off.
  GRID_AVAILABLE:
    name: Grid Import Available
    description: 'Tells the add-on whether this site can import from the utility grid at all. Leave it off for an islanded off-grid system: the dispatch optimizer then stops planning around imports that physically cannot happen, and the backup pool reaching its reserve floor stays a CRITICAL alarm instead of being downgraded to an on-screen advisory - that downgrade needs the grid to look present, via this flag, a Grid Presence Entity, live measured import, or the Smart Home Panel 2''s own grid-OK reading. Turn it on only if you are genuinely grid-tied; a configured Grid Presence Entity takes over from this flag for grid presence, but the dispatch optimizer reads this flag either way.'
  GRID_PRESENCE_ENTITY:
    name: Grid Presence Entity
    description: Optional Home Assistant entity reporting whether the utility grid is energized; it makes the backup-pool floor alarm grid-aware, so with the grid confirmed present and carrying the load, hitting the ~10% reserve floor is downgraded from CRITICAL to an on-screen advisory. Point it at a binary_sensor, input_boolean or switch (on / present / connected = energized) or at a line-voltage sensor (magnitude above 50 = energized), e.g. binary_sensor.grid_available. Anything unavailable, unknown, unrecognized, or not refreshed for 2 minutes counts as no grid and the floor stays CRITICAL unless measured grid flow or the SHP2's own grid flag proves otherwise. Once set it replaces the coarse Grid Import Available switch, which is consulted only while this is empty (the default), so an entity that wrongly reads energized weakens this alarm — the panel still withholds the downgrade while the pool keeps draining at the floor, but choose the entity carefully.
  GRID_FLOOR_SLACK_PCT:
    name: Grid Floor Slack Percent
    description: How many percentage points above the backup reserve the panel stops trusting a declared-but-flowless grid and lighting austerity may pre-arm. Default 1.5 means a 10% reserve arms at 11.5% while the pool is discharging with no measured grid flow; at a typical evening drain of ~7%/h each 1 point is about 9 minutes of earlier warning. Lower it (e.g. 0.5) for fewer grid-up dim events at the cost of a shorter safety margin if the grid turns out to be dead at the floor; 0 arms only at the reserve itself. Clamped 0-10; blank uses 1.5. The +1.5% floor coherence check for the CRITICAL floor alarm is unaffected.
  CHARGE_NOW_RESPONSE:
    name: Charge Now Response
    description: What the panel does when it detects on-peak grid power charging the battery pool with the SHP2's "Charge Now" (force charge) switch ON. "advisory" (default) sends one push per episode naming the channel and unit; "supervised" additionally announces and then turns the force-charge switch OFF through the audited write path, verifying against the device and warning honestly if the write does not take effect; "off" disables the responder. It fires only while the pool is comfortably above its reserve on a present grid (the peak-grid-draw alert's own guards), it stands down entirely while any storm pre-charge advisory is active, it responds at most once per episode and twice per day, and turning force charge OFF is the only write it can ever issue.
  HOST_POWER_ENTITY:
    name: Host Power Entity
    description: Optional Home Assistant entity that lets the alarm watch its own host — the machine it runs on, and the whole monitor's single point of failure. Point it at a binary_sensor that turns on at under-voltage (device_class problem, on = under-voltage) — on a Raspberry Pi host, the Raspberry Pi Power Supply Checker's binary_sensor.rpi_power_status — and you get a warning-level alert when the host reports under-voltage, in time to fix a marginal supply or a sagging circuit before it browns the host out and takes every channel dark. Blank (the default) leaves the check dormant, and a reading more than two minutes old reports unknown rather than replaying a frozen value.
  LOAD_SHEDDING_ADVISORY_ENABLED:
    name: Load-Shedding Advisor
    description: Turns on the read-only advisor that watches off-grid runway and recommends which of your allowlisted loads to shed to stretch it. It only publishes the recommendation to the panel, the API and its MQTT entities — it never switches anything, so your own Home Assistant automations decide whether to act. On by default, but it does nothing until you list at least one load in Sheddable Loads, and it recommends nothing while the grid is carrying the house.
  LOAD_SHEDDING_SHED_ENTITIES:
    name: Sheddable Loads
    description: The allowlist of loads the advisor may name when it recommends shedding during a shortfall; nothing outside this list is ever suggested, and nothing is ever switched off for you - the recommendation is advisory only, your own Home Assistant automations decide whether to act. Each comma-separated entry is entity_id:priority:label:estimated_watts[:shp2_circuit], where priority 1 is shed first (least important) and the optional last field is an SHP2 circuit number used to read measured watts instead of your estimate, e.g. switch.pool_pump:2:Pool pump:400:5,switch.irrigation:1:Irrigation:200. Empty (the default) leaves the advisor with nothing to recommend, and this list only matters while the Load-Shedding Advisor is on; an entry that looks like a medical, well-pump, refrigeration, network or security load is still accepted and only logged as a startup warning, so check it yourself.
  LOAD_SHEDDING_RUNWAY_THRESHOLD_H:
    name: Shed-Trigger Runway (Hours)
    description: 'How low the projected off-grid runway (hours to reserve, or hours to empty) must fall before the advisor starts naming loads to shed; in hours, default 4.0 — higher advises earlier, lower waits longer. It also moves the release point, since a shed is only withdrawn once the projection clears this threshold plus the Restore Margin. The advisor only ever recommends: it never switches anything off, it stays silent while the grid is carrying the house, and it does nothing at all unless Load-Shedding Advisor is on and Sheddable Loads names at least one entity.'
  LOAD_SHEDDING_RESTORE_MARGIN_H:
    name: Restore Margin (Hours)
    description: How much runway beyond the shed-trigger threshold the recommendation aims to buy, in hours. The advisor keeps adding circuits to its suggested shed list until the projected runway would reach Shed-Trigger Runway plus this margin (default 2.0), so a larger value produces a longer list of circuits to turn off. It is advice only — nothing is ever switched off for you — and it does nothing unless the Load-Shedding Advisor is on with at least one entry in Sheddable Loads.
  NIGHT_CHARGE_ADVISOR_ENABLED:
    name: Night-Charge Advisor
    description: 'Runs the night-charge planner: on days it expects a shortfall, it works out how much cheap overnight grid energy to buy so the home avoids importing during the tariff''s on-peak window (4-7pm Mon-Fri on the built-in APS R-EV plan) and still keeps a cushion above the reserve floor. It publishes that plan to the night-charge sensors and MQTT entities and sends one nightly notification, by default around 21:30 site time. Whether the add-on may act on the plan is a separate setting, Night-Charge Write Mode, which defaults to advisory and never writes to a device; turn this off (it is on by default) and no plan is computed at all - the night-charge sensors go blank, no nightly notification is sent, and no reserve write can happen whatever that mode says.'
  NIGHT_CHARGE_MODE:
    name: Night-Charge Write Mode
    description: 'How far the night-charge engine may act on its own plan: advisory (the default) never writes to any device — sensors and the nightly notification only. supervised announces each evening''s plan (audible broadcast plus a Home Assistant notification) with a cancel deadline and, unless you cancel from the panel, makes ONE audit-logged write raising the SHP2 backup reserve to the plan target (clamped to the device''s 10-50% range) when the cheap window opens, restoring the previous value when the window closes, or an hour before on-peak if that is sooner; nothing is raised within an hour of on-peak, a restore the panel does not confirm is paged as critical, and no raise is attempted while the add-on''s own host is under critical pressure (its vitals, not an alert; a restore still runs), and the reserve-floor alarms are independent of this path throughout. auto is reserved for a future unattended mode: today it runs the identical announced, cancellable flow, and is demoted outright to supervised until the write-readiness gate graduates on real actuated-night evidence.'
  ARB_OUTAGE_CUSHION_PCT:
    name: Outage Cushion (%)
    description: Battery headroom to hold above the reserve floor as insurance against an unexpected outage, in percent of total pool capacity (0-40, default 15). The night-charge advisor sizes the overnight buy so its worst-case low-solar, high-load projection still ends at or above floor plus cushion; raise it for more resilience and a bigger overnight buy, lower it to buy less. In supervised or auto Night-Charge Write Mode it also raises the reserve setpoint actually written to the Smart Home Panel 2, though the write is still clamped to the device's 10-50% range; the independent reserve-floor alarm is never affected.
  ARB_OUTAGE_CUSHION_HOURS:
    name: Outage Cushion Hours
    description: 'How long the backup pack must be able to run your protected circuits after the charge window closes, on top of the reserve floor. This is what the nightly plan sizes its purchase against. The energy needed is computed from the load the Smart Home Panel is actually carrying — when the grid drops, the panel powers its own circuits and the rest of the house is dead, so whole-house consumption is not the right figure and using it made the target impossible to reach. Default 4 hours. Raise it for a longer guarantee and the plan will buy more; lower it and it will buy less. Set it to 0 to disable the cushion entirely and defend only the reserve floor.'
  ARB_ISLANDED_LOAD_SAFETY:
    name: Islanded Load Safety Factor
    description: 'Multiplier applied to the measured panel load when sizing the outage cushion; default 1.25. The measurement is a spot reading and the load during an outage is not constant, so the plan deliberately assumes more draw than it currently sees. HIGHER IS STRICTER — 2.0 makes the cushion harder to meet and buys more; 1.0 trusts the live reading exactly. It is not a fudge factor for optimism.'
  ARB_OBJECTIVE:
    name: Night-Charge Objective
    description: 'What the overnight purchase is sized for. ''resilience'' (the default) buys only enough to hold the reserve floor plus the outage cushion. ''cost'' buys to minimise your bill: it stores cheap overnight energy to displace the dearer energy you would otherwise import later, filling toward the ceiling set by tomorrow''s expected morning solar (or by Cost Mode Maximum State of Charge when the forecast cannot see that far). Cost mode is bounded BELOW by the resilience answer, so switching to it can never buy less or shrink your safety margin — the only direction it moves the purchase is up. It needs your tariff rates entered and confirmed to be meaningful. With cost and Cost Mode Maximum State of Charge above 50, the evening before a winter weekday also works out the charge it would make in the tariff''s super off-peak period instead (10am-3pm on the built-in APS R-EV plan), as a preview only: it is shown on the Midday-Charge entities and the night-charge card, and nothing is written for it.'
  ARB_COST_MAX_SOC_PCT:
    name: Cost Mode Maximum State of Charge
    description: 'How full the overnight charge may fill the battery in cost mode, as a percentage; default 90. The panel''s backup reserve cannot be set above 50 (proven on the device), so the add-on charges past 50% with the panel''s force-charge (the app''s Charge Now): the reserve carries the pack to 50% and holds the house on grid, then late in the charge window force-charge switches on to reach the night''s target. It switches off when it gets there, at any target (the panel''s own force-charge limit, set to match, is only a backstop). The switch-on is timed from the live charge rate — the Shared Grid-Input Envelope less what the house is drawing. Starting late is deliberate — below 80%, a pack filled hours early is drawn back toward the 50% reserve by the house before morning. The target is this value OR the room tomorrow morning''s expected (median) solar needs, whichever is lower: a pack too full to accept the morning sun wastes that solar, and the wasted kWh costs the full price of the grid kWh sitting in its place. On a night followed by more than a day without a full cheap window (on the built-in APS R-EV plan, Thursday, before Friday''s 1-hour window and the all-off-peak weekend) the solar room is set aside and the target is this value. Set this to 50 or below to turn force-charge off entirely. Ignored in resilience mode.'
  ARB_MIN_BUY_KWH:
    name: Minimum Buy (kWh)
    description: 'Below this recommended buy size the advisor calls the night a "hold" instead of nagging about a trivial top-up. Default 1.0 kWh; the field accepts 0-50 and roughly 0.5 to 3 is sensible. The same number doubles as the clean-baseline test in the morning hindsight score: on a night the engine did NOT actuate, overnight grid import above this figure leaves the night unscored rather than graded against a baseline the grid already propped up.'
  ARB_CHARGE_CAP_KW:
    name: Grid-Charge Power Cap (kW)
    description: 'Ceiling on how fast the batteries can be charged from the grid, used to size how much energy the cheap overnight window can deliver. 0 (the default) is AUTOMATIC: the connected battery Cores times what each has been measured taking at the grid, so a Core out for service lowers it on its own. The home load is taken off separately, through the Shared Grid-Input Envelope. Any value above 0 is a fixed override. The overnight force-charge times itself the same way. Advisory sizing only; this never commands a device.'
  ARB_GRID_INPUT_CAP_KW:
    name: Shared Grid-Input Envelope (kW)
    description: 'Caps the grid power the overnight charge plan assumes it can draw, shared between house pass-through and battery charging: a large concurrent load — an EV session above all — leaves the packs only the remainder, so the plan sizes a smaller buy and discloses the shortfall instead of over-promising. In kW; default 17; set it to your grid-input breaker capacity; set 0 to ignore contention entirely, which lets the plan assume the full charge cap even while the house is drawing hard. It never pauses or throttles the EV charger, but it is not purely cosmetic: with Night-Charge Write Mode set to supervised or auto, the plan sized here is the one written to the Smart Home Panel 2 backup reserve. The overnight force-charge also times its switch-on from this value less the live house load (the panel caps its total grid import and the house shares it); a value above the real cap starts it late and the night ends short of its target.'
  ARB_LOAD_P90_FACTOR:
    name: Load Safety Margin (P90)
    description: Sets how much the night-charge planner pads the forecast household load when it sizes the overnight purchase, so it plans for a heavier-than-expected night instead of under-buying. Default 1.15 assumes 15% more load than forecast; raise it toward 2.0 to buy more cheap overnight energy (and pay for energy you may not need), lower it toward 1.0 to buy less and accept more risk of importing on-peak. Range 1.0-2.0; it only sizes the plan, never writes to a device, and it has no effect unless the Night-Charge Advisor is on.
  NIGHT_CHARGE_NOTIFY_HOUR:
    name: Night-Charge Notify Hour
    description: 'Hour, in site time (the site time zone when one is set, otherwise Home Assistant''s), at which the once-nightly night-charge job runs: it records the night''s plan row, scores yesterday''s outcome, and sends the single advisory notification. In supervised or auto Night-Charge Write Mode this is also the moment tonight''s bounded reserve write is announced and armed, and the cancel deadline is measured from here. Default 21 (9pm), early enough to act before the cheap window opens; the job''s catch-up window closes when the cheap window opens (23:00 on the built-in APS R-EV plan, where an hour of 23 could never fire and is silently treated as 22; at midnight at the latest on any plan). An hour at or after the opening of another plan''s cheap window is moved to the hour before it, and a repair issue names the time the job runs at, because a write mode refuses a window that opened more than 30 minutes earlier. The whole setting is inert while the Night-Charge Advisor is off.'
  NIGHT_CHARGE_NOTIFY_MINUTE:
    name: Night-Charge Notify Minute
    description: 'Minute of the Night-Charge Notify Hour at which the nightly charge advisory is sent; default 30, so 21:30 with the default hour, and the valid range is 0–59. Times are site time: the site time zone when one is set, otherwise Home Assistant''s. The advisory only goes out inside the window from that time to the opening of the cheap window (23:00 on the built-in APS R-EV plan; midnight when a window opens later): if the add-on is down or restarting for the whole window, that night''s advisory is skipped rather than sent late.'
  NIGHT_CHARGE_NOTIFY_ON_HOLD:
    name: Notify On "Hold" Nights
    description: When on (the default), the nightly charge advisory is sent even on nights when no grid charge is needed, so you get a standing confirmation that the job ran. Turn it off to hear only from nights where a charge is actually recommended. Either way, a night whose inputs were incomplete still notifies, so a missing plan is never silent.
  HEARTBEAT_URL:
    name: External Heartbeat URL (dead-man's switch)
    description: An https ping URL from an outside monitoring service (healthchecks.io or similar). The add-on sends a GET on the interval set below, so if the pings stop — host dead, container killed, power lost — that outside service alerts you from beyond the failure this add-on could no longer report itself. Leave empty (the default) to disable; anything that is not a parseable https:// URL is rejected outright and no pings are sent at all, with a single warning in the log, so check the log after setting it. The URL is a secret — anyone holding it can fake your heartbeat — and is never logged in full, only its hostname.
  HEARTBEAT_INTERVAL_S:
    name: Heartbeat Interval (seconds)
    description: How often the dead-man's-switch ping is sent to the external heartbeat URL above (60-3600 seconds, default 300). Set the external check's expected period to this same value and its grace to roughly two intervals, so one missed ping does not page you; a longer interval also means a dead add-on or a dead host goes unnoticed for correspondingly longer. Ignored while the heartbeat URL is empty; with a URL set, the first ping goes out immediately at startup, and this is the only alarm path that survives a total host or power failure.
  TARIFF_APS_ONPEAK_SUMMER_CENTS:
    name: 'APS R-EV preset: On-Peak ¢/kWh (Summer)'
    description: 'Effective on-peak energy price in cents per kWh for the summer season (APS R-EV: 4–7pm Mon–Fri; the May–October bills, which cover usage from about the early-April meter read to the early-October one), taken from a real bill with adjustors included. Leave blank until you have that number: blank leaves the summer on-peak price unset in the tariff view, and the cost/savings KPIs fall back to the flat default rate (17 ¢/kWh unless you override it) rather than an invented APS price. It only takes effect once APS Rates Confirmed is also on and the matching summer off-peak rate is filled in.'
  TARIFF_APS_ONPEAK_WINTER_CENTS:
    name: 'APS R-EV preset: On-Peak ¢/kWh (Winter)'
    description: Winter on-peak energy price in cents per kWh, taken from a real APS bill (the R-EV winter season is the November–April bills, which cover usage from about the early-October meter read to the early-April one). It feeds the cost and savings figures and the nightly plan's recorded rates only when Rates Confirmed is on and the matching APS Off-Peak ¢/kWh (Winter) is also filled in; otherwise those figures fall back to the flat default rate. Leave it blank until you have the number from a bill — a blank or zero value is ignored rather than guessed at.
  TARIFF_APS_OFFPEAK_SUMMER_CENTS:
    name: 'APS R-EV preset: Off-Peak ¢/kWh (Summer)'
    description: 'Effective summer off-peak energy price in cents per kWh from a real bill — on APS R-EV this is the residual bucket: every summer hour (usage from about the early-April meter read to the early-October one, billed May-October) that is not on-peak (4-7pm Mon-Fri) and not overnight (11pm-5am Mon-Fri), plus all weekends and observed holidays. It stays inert until Rates Confirmed is turned on: while that is off the R-EV price table reports no cents at all, so the night-charge arbitrage figures publish as null, and the cost and dispatch reports fall back to a flat placeholder rate (17 ¢/kWh unless overridden) rather than your real bill. Leave blank until you have confirmed the number.'
  TARIFF_APS_OFFPEAK_WINTER_CENTS:
    name: 'APS R-EV preset: Off-Peak ¢/kWh (Winter)'
    description: 'Effective winter off-peak price in cents per kWh on the APS R-EV plan - the November-April bills, i.e. usage from about the early-October meter read to the early-April one, covering every hour outside the on-peak (4-7pm Mon-Fri), winter super-off-peak (10am-3pm Mon-Fri) and overnight (11pm-5am Mon-Fri) windows, plus all weekends. Take it from a real bill with adjustors included, not the published base rate, and leave it blank until you have that number. A blank rate is never guessed: winter off-peak dollar figures publish as null, and the cost KPIs fall back to their flat-rate default of 17 cents per kWh - it is the separate Rates Confirmed switch, not this field, that decides whether dollar outputs are published at all.'
  TARIFF_APS_OVERNIGHT_CENTS:
    name: 'APS R-EV preset: Overnight ¢/kWh'
    description: Your effective price in cents per kWh for the APS R-EV overnight window (11pm-5am Mon-Fri, year-round), taken from a real bill with riders and adjustments included. Enter cents rather than dollars, as a plain decimal such as 4.5; one entry covers both summer and winter. It prices that window in the tariff read-out and in each night's charge-plan record — it does not decide when the system charges, since the window comes from the tariff's periods — and prices read as null until Rates Confirmed is also on.
  TARIFF_APS_SUPEROFFPEAK_WINTER_CENTS:
    name: 'APS R-EV preset: Winter Super-Off-Peak ¢/kWh'
    description: 'Effective price of the APS R-EV winter super-off-peak period in cents per kWh — 10am-3pm Mon-Fri in winter (the Nov-Apr bills, i.e. usage from about the early-October meter read to the early-April one), the cheap midday tier that overlaps solar production. Take it from a real bill and leave it blank until you have confirmed it. Entering a number does nothing on its own: every dollar figure stays null until Rates Confirmed is turned on, and there is no summer field because the period is winter-only. HOW TO SET THIS FROM A BILL: APS prints a per-tier base rate that is NOT what you pay. Add the uniform Adjustors line divided by total kWh, then multiply by one plus the Taxes-and-Fees fraction. Worked example with invented round numbers: $40 of Adjustors on a 2000 kWh bill adds 2.0 c/kWh, and with a 10% Taxes-and-Fees fraction a tier printed at 8.0 c/kWh costs (8.0 + 2.0) x 1.10 = 11.0 c/kWh all-in. Use the all-in figure -- it is the marginal cost of the next kWh, which is what the arbitrage arithmetic needs.'
  TARIFF_APS_RATES_CONFIRMED:
    name: 'APS R-EV preset: Rates Confirmed'
    description: Confirms that the six APS R-EV rate fields above hold real numbers off your bill (another tariff plan has its own confirmation switch, which takes this value while it is unset). While it is off (the default), every cost and savings dollar figure on the panel is priced from a flat 17 cents/kWh placeholder instead of your actual rates, and the night-charge tariff record is stamped unconfirmed rather than priced. Turning it on while either rate for the current season is still blank silently keeps that flat placeholder, so fill the rates in first.
  NWS_ENABLED:
    name: NWS Storm Alerts
    description: 'Adds the free US National Weather Service feed for your forecast coordinates: active severe-weather alerts, which can raise a pre-charge-to-100%-before-the-storm alert, plus a second cloud-cover source that is averaged into the solar forecast and widens its uncertainty band when the two sources disagree. No API key or account needed, and it never writes to a device. Off by default; outside the US the feed comes back empty, which is a harmless no-op.'
  MQTT_DISCOVERY_ENABLED:
    name: MQTT Discovery
    description: Publishes the add-on's fleet metrics to your MQTT broker as Home Assistant auto-discovery sensors, so they appear on their own under a "Power" device with no configuration.yaml edits. It stays off unless MQTT Broker Host below is also filled in - both are required, and the add-on log says so at startup when only one is set. Note that it also publishes four writable alarm-priority switches, so anyone who can reach the broker can silence the push and audible annunciation of a whole priority (the alarms themselves stay visible in the panel). Off by default.
  MQTT_DISCOVERY_HOST:
    name: MQTT Broker Host
    description: Hostname or IP of your MQTT broker, e.g. core-mosquitto (HA's Mosquitto add-on) or 192.168.1.50. Required for MQTT Discovery — if empty, discovery stays off even when the toggle is on. Default empty.
  MQTT_DISCOVERY_PORT:
    name: MQTT Broker Port
    description: TCP port of the MQTT broker the add-on publishes its Home Assistant entities to. Leave it at 1883 unless your broker listens elsewhere; the add-on connects with plain, unencrypted MQTT v5, so a TLS port such as 8883 will fail to connect. Ignored unless MQTT Discovery is on and MQTT Broker Host is set.
  MQTT_DISCOVERY_USER:
    name: MQTT Username
    description: Username the add-on uses to log in to your MQTT broker when it publishes discovery entities. Leave empty if your broker accepts anonymous connections. Read only when MQTT Discovery is on and MQTT Broker Host is set; pair it with MQTT Password.
  MQTT_DISCOVERY_PASS:
    name: MQTT Password
    description: Password for the MQTT broker, paired with MQTT Username; leave it blank for an anonymous broker. It is only read when MQTT Discovery is on and an MQTT Broker Host is set. The field is masked as you type, but the value is stored in the add-on's options and sent over a plain, unencrypted MQTT connection — use a broker account that only matters on your LAN, not a password you reuse elsewhere.
  MQTT_DISCOVERY_PREFIX:
    name: MQTT Discovery Prefix
    description: Topic prefix the add-on publishes its auto-discovery messages under. It must match the discovery prefix configured in your Home Assistant MQTT integration, or none of the sensors will ever appear. "homeassistant" is the Home Assistant default and is almost always correct; ignored unless MQTT discovery is enabled and an MQTT host is set.
  SSH_ENABLED:
    name: Enable SSH TUI
    description: 'Serves the full-screen control-room console over SSH on the SSH TUI Port (default 2323) for terminals on your network: ssh -p 2323 <Console Username>@<host>. Logins use the Console Username and Console Password below, and every login is refused until a Console Password is set, so set one first. The host key fingerprint is in the add-on log at every start, to compare with what ssh shows on the first connection. Off by default. The browser version of the same console at /console stays available through the Home Assistant sidebar whatever you set here.'
  SSH_PORT:
    name: SSH TUI Port
    description: 'TCP port the SSH control-room TUI listens on inside the add-on; default 2323. Leave it at 2323 unless you know what you are doing: the add-on publishes container port 2323, and the Network section can only change the host-side port, so any other value here leaves the console unreachable from your LAN. Ignored while the console is off.'
  TUI_USERNAME:
    name: Console Username
    description: 'Username for the control-room console login, used by both the SSH TUI and the /console browser terminal; blank (the default) means operator. With Console Password empty the browser console has no login prompt, and the SSH console refuses every login. Use printable ASCII, 64 characters or fewer: the browser console''s prompt cannot type anything else, so a longer or accented name would lock you out of it.'
  TUI_PASSWORD:
    name: Console Password
    description: 'Password for the control-room console login, covering both the SSH TUI and the /console browser terminal; three failed attempts drop the connection, and ten failures within ten minutes from one address lock out new attempts from that address until the ten minutes are up. Leave it empty (the default) and the browser console opens with no login, while the SSH console refuses every login until a password is set. Use printable ASCII, 64 characters or fewer: the browser console''s login prompt cannot type anything else, so a longer or non-ASCII value locks you out of it (the add-on warns about it at startup).'
  TUI_TRUSTED_ORIGINS:
    name: Trusted Browser Origins (advanced)
    description: 'Advanced security setting: a comma-separated list of exact browser origins (e.g. https://your-id.ui.nabu.casa) that the add-on treats as its own. Each entry is matched exactly, never as a wildcard, but any origin you list gets the same power the dashboard has — opening the /console terminal and websockets, and making write calls with no token, which includes disabling audible broadcasts, changing alert settings and cancelling the night-charge plan. Add only an origin you fully control; leave empty (the default), since the LAN and the Home Assistant sidebar already work without it.'
  RECORDER_RETENTION_DAYS:
    name: Telemetry Retention (days)
    description: How many days of raw telemetry samples the add-on keeps before the hourly cleanup deletes them - these samples are what back the charts, sparklines and the forecast and model-training windows. Default 30 days; raising it enables seasonal comparisons and deeper backtests, at roughly 25-30 MB of database growth per day for a full fleet, so check your free disk space before going long. Range 7-3650, an unreadable value falls back to 30 rather than deleting everything, and the night-charge ledger and lifetime energy totals are never pruned by this setting.
  ECOFLOW_DEVICE_REACHABILITY:
    name: Device LAN Reachability Map
    description: Optional JSON object mapping each device serial to a Home Assistant ping binary_sensor (device_class connectivity) watching that device's LAN address, e.g. {"<serial>":"binary_sensor.core1_lan"}. It only changes how an offline device is explained — reachable on the LAN but missing from the cloud is reported as a cloud-session wedge (do not power-cycle), unreachable is a real outage — and it never makes an alarm fire, change severity, or fall silent. Empty (the default) or malformed JSON leaves the whole feature dormant, and any single entry whose value is not a lower-case entity id of the form domain.object_id is silently dropped.
  WRITE_DEBUG_TOKEN:
    name: Write Debug Token (Advanced)
    description: Leave this empty (the default) unless you are actively probing undocumented EcoFlow commands. Any value unlocks POST /api/device/send-command, which forwards commands you compose straight to your Smart Home Panel 2 or Delta Pro Ultra; the guards are an allowlist of command sets, a size cap and a 30-second per-device cooldown, not a check that the command is sensible, so a wrong one can change how your backup power behaves. Callers must present this exact value in the x-write-debug-token header and reach the add-on through HA ingress, the panel's own origin, or with the panel write token; clearing the field closes the endpoint again.
  # New schema-only keys (v1.191.0 and later): each lane appends its entries under its own heading.
  # --- lane site --- (SITE_TIMEZONE, SITE_LOCATION_FROM_HA)
  SITE_TIMEZONE:
    name: Site Time Zone (advanced)
    description: 'Leave empty (the default) to use Home Assistant''s time zone. This is the zone every local date, hour and clock time is computed in: the tariff periods, the night-charge window and its announcements, quiet hours, the morning digest, the daily totals, and the times shown on the console and on the night-charge, Today and forecast cards. Enter an IANA zone name such as Europe/Berlin only if the add-on must keep a different zone from Home Assistant''s. A name the add-on cannot resolve raises a repair issue and the zone falls back to Home Assistant''s. The zone is read once at start, so restart the add-on after changing it.'
  # --- lane tariff --- (TARIFF_PLAN, TARIFF_PERIODS, TARIFF_RATES, TARIFF_RATES_CONFIRMED, TARIFF_FIXED_DAILY_CENTS, TARIFF_SUMMER_MONTHS, TARIFF_HOLIDAYS, TARIFF_CURRENCY, NIGHT_CHARGE_CHEAP_PERIOD, TARIFF_FLAT_CENTS_PER_KWH, TARIFF_ON_PEAK_CENTS, TARIFF_OFF_PEAK_CENTS, TARIFF_EXPORT_CENTS_PER_KWH, TARIFF_ON_PEAK_HOURS, TARIFF_ON_PEAK_DAYS)
  TARIFF_PLAN:
    name: Tariff Plan
    description: 'Which tariff prices the cost figures and times the night charge. Leave it unset (or choose aps_r_ev) for the built-in APS R-EV table with its six rate fields above. flat is one rate every hour (Flat Rate ¢/kWh); two_tier is one on-peak window (On-Peak Hours and Days) with an on-peak and an off-peak rate; custom is your own period table (Tariff Periods and Tariff Rates). A setting that cannot be read is never replaced by the APS table: every price reads unknown, the night charge holds, and a repair issue names the option to fix.'
  TARIFF_PERIODS:
    name: Tariff Periods (custom plan)
    description: 'The periods of a custom plan, separated by semicolons, highest priority first. Each is: id start-end days season, then optionally onpeak and cheap. Hours are local and end-exclusive (23-05 wraps midnight, 0-24 is a whole day); days are all, a day (mon … sun), a range such as mon-fri, or a comma list; season is all, summer or winter. Flag the on-peak period onpeak and the night-charge period cheap, whatever its name; the nightly job then runs before that period opens. Every hour no period covers is off_peak. Example: on_peak 16-19 mon-fri all onpeak; overnight 23-05 mon-fri all cheap. Used only when Tariff Plan is custom.'
  TARIFF_RATES:
    name: Tariff Rates (custom plan)
    description: 'The ¢/kWh of each custom period and of off_peak, separated by semicolons: id=summer/winter, or id=rate for both seasons, with - for no rate in a season. Example: on_peak=31.2/22.5; off_peak=16.9/15.1; overnight=12.6. Any number counts, 0 included. Every period of Tariff Periods and off_peak must have an entry. Used only when Tariff Plan is custom.'
  TARIFF_RATES_CONFIRMED:
    name: Tariff Rates Confirmed (any plan)
    description: 'Confirms that the rates of the plan in effect come from a bill. While it is unset, the APS section''s Rates Confirmed switch decides, for every plan. Until rates are confirmed every price reads unknown, and the cost figures fall back to On-Peak Rate and Off-Peak Rate over the on-peak window when both are above zero (on a two_tier plan, its own two rates), otherwise to the flat rate. With a plan set, the dispatch planner prices an unconfirmed hour the same way.'
  TARIFF_FIXED_DAILY_CENTS:
    name: Fixed Daily Charge ¢
    description: 'The plan''s fixed daily basic-service charge in cents, for reference. It is not part of any per-kWh price and is shown only once the rates are confirmed. Leave it unset if the bill has none.'
  TARIFF_SUMMER_MONTHS:
    name: Summer Months
    description: 'The months of use priced at summer rates, as a range or a comma list: 4-9 (April to September, the default) or, south of the equator, a range that wraps the year such as 10-3. The other months are winter. Applies to every plan.'
  TARIFF_HOLIDAYS:
    name: Off-Peak Holidays
    description: 'The days priced off-peak all day: aps (the APS R-EV holiday rule, the default for that plan), none (the default for every other plan), or a comma list of dates written YYYY-MM-DD.'
  TARIFF_CURRENCY:
    name: Tariff Currency
    description: 'The currency of the rates and cost figures: USD (the default), EUR, GBP, CAD or AUD. Rates stay in hundredths of the unit. Changing it changes the unit of the Home Assistant cost and rate sensors, and Home Assistant then asks once to repair their long-term statistics. An unknown code keeps USD and raises a repair issue.'
  NIGHT_CHARGE_CHEAP_PERIOD:
    name: Night-Charge Period
    description: 'The tariff period the night-charge engine plans and charges in. Leave it unset: the APS R-EV plan charges in overnight, and a custom plan in the period flagged cheap; flat and two_tier plans have none, so the night charge holds. Set it to a period id of the plan in effect to choose another (off_peak is every hour no period covers, planned one night at a time: on a two_tier plan, from the end of on-peak to its start the next day, on weekend nights too); an id the plan does not have fails closed (the night charge holds and a repair issue names it). The nightly job''s schedule follows the period''s hours.'
  TARIFF_FLAT_CENTS_PER_KWH:
    name: Flat Rate ¢/kWh
    description: 'The rate of the flat plan, and with any other plan the fallback rate the cost figures use while no confirmed rate prices an hour. Unset is 17 ¢/kWh.'
  TARIFF_ON_PEAK_CENTS:
    name: On-Peak Rate ¢/kWh (two-tier)
    description: 'The on-peak rate of the two_tier plan. With any other plan, together with Off-Peak Rate it overrides the cost figures'' two-tier pair; only a value above zero counts there. Unset leaves both as they are.'
  TARIFF_OFF_PEAK_CENTS:
    name: Off-Peak Rate ¢/kWh (two-tier)
    description: 'The off-peak rate of the two_tier plan: every hour outside the on-peak window. With any other plan, together with On-Peak Rate it overrides the cost figures'' two-tier pair; only a value above zero counts there.'
  TARIFF_EXPORT_CENTS_PER_KWH:
    name: Export Credit ¢/kWh
    description: 'What the utility credits per kWh exported to the grid, used by the dispatch optimiser. Unset is 0 (no export credit).'
  TARIFF_ON_PEAK_HOURS:
    name: On-Peak Hours (two-tier)
    description: 'The on-peak window of the two_tier plan as start-end, local and end-exclusive (unset is 15-20, 3 pm to 8 pm). With any other plan it is the legacy window the cost figures judge on-peak by while the rates are unconfirmed.'
  TARIFF_ON_PEAK_DAYS:
    name: On-Peak Days (two-tier)
    description: 'The on-peak days of the two_tier plan as first-last, 1 = Monday to 7 = Sunday (unset is 1-5, Monday to Friday; 6-7 is the weekend). With any other plan it is the legacy window''s days.'
  # --- lane pv --- (PV_ARRAY_KWP, PV_TILT_DEG, PV_AZIMUTH_DEG, PV_STRINGS)
  PV_ARRAY_KWP:
    name: "PV Array Size (kWp)"
    description: "Total nameplate of the solar array in kWp, e.g. 6.4 for sixteen 400 W panels. Leave it empty to keep the built-in reference array (16.8 kWp). The clear-sky model (physics maximum and its score) and the solar learner's noise scale are sized from it. Setting this or any other PV option also moves the PV model onto Site Latitude and Site Longitude (or Home Assistant's home location, see Use Home Assistant's Location), so check those first."
  PV_TILT_DEG:
    name: "PV Array Tilt (°)"
    description: "Tilt of the panels from horizontal in degrees: 0 is flat, 90 is vertical. Leave it empty to keep 25°. Used by the clear-sky model to project sunlight onto the panels."
  PV_AZIMUTH_DEG:
    name: "PV Array Azimuth (°)"
    description: "Direction the panels face, in degrees clockwise from north: 180 is due south, 90 east, 270 west (a southern-hemisphere roof usually faces north, 0 or 360). Leave it empty to keep 180°."
  PV_STRINGS:
    name: "PV Strings per Core"
    description: "The solar strings wired to each Delta Pro Ultra, as hv=<panels>x<watts>,lv=<panels>x<watts>, for example hv=10x400,lv=4x400 (the default when empty). A Core wired differently gets an override after a semicolon, keyed by its panel slot or its name: hv=10x400,lv=4x400; slot2=hv=8x450 — a string the override leaves out keeps the first layout; hv=0 or lv=0 means no string. The Solar page draws and labels each Core's strings from this; it does not change any measurement. A value that cannot be read falls back to the default and raises a repair item."
  SITE_LOCATION_FROM_HA:
    name: "Use Home Assistant's Location"
    description: "When on, the site uses Home Assistant's home latitude and longitude (Settings → System → General) instead of Site Latitude and Site Longitude, for the solar forecast, the storm alerts, the day/night test and the PV model. The add-on reads it in the background after it starts and saves it, so it applies from the following start; a repair item asks for that restart. Leave it off to use the two fields above. With it off, a repair item warns when Home Assistant's home is more than 50 km from those fields."
  # --- lane ev --- (EV_MAX_LOAD_W, EV_CHARGER_COUNT, EV_PLATEAU_MIN_W, EV_CIRCUITS)
  EV_MAX_LOAD_W:
    name: EV Charger Maximum Load (W)
    description: 'Advanced. The most one EV charger draws, in watts. It caps each predicted charging session in the load forecast and the projected draw of a session in progress. Leave empty for 11520 W (48 A at 240 V).'
  EV_CHARGER_COUNT:
    name: EV Chargers
    description: 'How many EV chargers the site has. Empty or 1: predicted charging sessions that overlap are treated as alternatives, and the largest one counts. 2 to 4: overlapping sessions add up, capped at this count times EV Charger Maximum Load. 0: there is no EV charger, so no circuit is treated as EV charging.'
  EV_PLATEAU_MIN_W:
    name: EV Detection Threshold (W)
    description: 'Advanced. Average power, in watts, above which a sustained circuit load counts as an EV charging session. Leave empty for 6000 W, which separates a Level 2 charger from air conditioners; lower it for a smaller charger.'
  EV_CIRCUITS:
    name: EV Charger Circuits
    description: 'Smart Home Panel 2 circuit numbers (1-12, separated by commas) that EV detection scans, for example 11,12. A 240 V circuit is scanned when either of its two channels is listed. Leave empty to scan every circuit.'
  # --- lane devices --- (BENCH_SPARE_SNS, DEVICE_ALIASES)
  BENCH_SPARE_SNS:
    name: "Bench Spare Serials"
    description: "Serials of the Delta Pro Ultras kept off the panel as bench spares, separated by commas (<serial>,<serial>), or none for no spares. A spare being offline is expected, so its offline alarm is shown without a sound or a push, and it is left out of the battery pool. When set, this list replaces the built-in one; it is not added to it. A unit the panel reports as one of its connected sources is never treated as a spare, whatever this list says, and no unit is treated as a spare just because it is missing. A serial that matches no device raises a repair item. Leave it empty to keep the built-in list."
  DEVICE_ALIASES:
    name: "Device Aliases"
    description: "Display names by device serial, as one JSON object, for example {\"<serial>\":\"Core 5\"}. A Core named Core N is numbered N in the alerts and on the cards. These names win over the file device-aliases.json in the add-on's data folder, which wins over the file shipped in the image. Read when the add-on starts; a value that is not a JSON object is ignored and raises a repair item. Leave it empty to keep the names from those files and the EcoFlow app."
  # --- lane limits --- (FORCE_CHARGE_KW_PER_CORE, RUNWAY_POOL_OVERHEAD_FLOOR_W, RUNWAY_CORE_OVERHEAD_W, BMS_RESEED_MIN_GAP_WH, CAPACITY_SCALE_MIN, FORECAST_NIGHT_START_HOUR, FORECAST_NIGHT_END_HOUR, GRID_CO2_INTENSITY_LB_PER_MWH, CYCLING_BASE_WEAR_USD_PER_KWH, OPPORTUNISTIC_LOADS, BATTERY_SOC_LADDER)
  FORCE_CHARGE_KW_PER_CORE:
    name: Force-Charge Rate per Core (kW)
    description: 'Advanced. The power each connected Core takes into its batteries while force-charging, in kW. It times the start of the night charge and sizes the planner''s automatic charge cap. Leave empty or 0 for 5.5 kW. A Grid-Charge Power Cap above 0 still sets the planner''s cap.'
  RUNWAY_POOL_OVERHEAD_FLOOR_W:
    name: Runway Standby Overhead Floor (W)
    description: 'Advanced. The Cores'' own standby consumption, in watts, that the runway adds to the house load while the panel reports a battery pool. Leave empty for 270 W, fitted on a three-Core pool; about 90 W per connected Core is a starting point for another pool. Range 0-1500.'
  RUNWAY_CORE_OVERHEAD_W:
    name: Runway Standby Overhead per Core (W)
    description: 'Advanced. Standby consumption per connected Core, in watts. It raises the overhead above the floor when more Cores are connected than the floor accounts for. Leave empty for 90 W. Range 0-500.'
  BMS_RESEED_MIN_GAP_WH:
    name: Lifetime Energy Re-seed Gap (Wh)
    description: 'Advanced. How far apart, in watt-hours, the stored lifetime energy totals and the batteries'' own counters may drift before the totals are re-seeded from the counters. Leave empty for 50000 Wh, about one Core''s capacity.'
  CAPACITY_SCALE_MIN:
    name: Minimum Capacity Scale
    description: 'Advanced. The lowest measured battery-capacity ratio (full-charge capacity over nameplate) applied to the panel''s energy figures for the runway, the forecast and the idle-pool check. Leave empty for 0.8. Range 0.5-1.'
  FORECAST_NIGHT_START_HOUR:
    name: Forecast Night Start Hour
    description: 'Advanced. First hour (0-23) of the overnight band in which the load forecast is trimmed toward the load measured in the last hours. Leave empty for 21.'
  FORECAST_NIGHT_END_HOUR:
    name: Forecast Night End Hour
    description: 'Advanced. Last hour (0-23) of the overnight band in which the load forecast is trimmed toward the load measured in the last hours. Leave empty for 5.'
  GRID_CO2_INTENSITY_LB_PER_MWH:
    name: Grid CO2 Intensity (lb/MWh)
    description: 'Carbon intensity of the grid''s electricity, in pounds of CO2 per MWh, used for the avoided-CO2 figures. Leave empty for 1100 lb/MWh. Utilities and grid operators publish the figure for their area.'
  CYCLING_BASE_WEAR_USD_PER_KWH:
    name: Battery Wear Cost (per kWh)
    description: 'Advanced. Base cost of battery wear per kWh cycled, in the tariff''s currency (Tariff Currency; the option keeps its USD name), that the dispatch optimiser weighs against the tariff savings. Leave empty for 0.015.'
  OPPORTUNISTIC_LOADS:
    name: Surplus Load Suggestions
    description: 'Loads to suggest when solar power would otherwise be curtailed, as id:watts:category:label entries separated by commas, for example pool_pump:1800:pool:Pool pump,water_heater:4500:water. The category is pool, ev, water, hvac or other (other when left out), and the label is optional. Write none for no suggestions. Leave empty for the built-in examples.'
  BATTERY_SOC_LADDER:
    name: Battery SoC Alarm Levels
    description: 'The state-of-charge levels the battery alarm announces on the way down, as percent:priority entries separated by commas, for example 50:low,30:medium,15:critical. The priority is low, medium, high or critical. Leave empty for 50, 40 and 30 (low), 20 and 15 (medium), and 10, 8, 4 and 2 (critical).'
