name: Power
version: "1.191.7"
slug: ecoflow_panel
description: >-
  Independent, open-source time-of-use arbitrage planning, forecasting and
  life-safety alarms for a grid-tied EcoFlow home that runs with or without the
  grid (Smart Home Panel 2, Delta Pro Ultra), built on more than 40 engines: a
  worst-case night-charge plan scored against the meters, P10–P90 solar
  forecasts, pack-health projection and anomaly detection. Advisory by default;
  automatic device writes are opt-in.
url: https://github.com/tesseractAZ/power
arch:
  - aarch64
  - amd64
# Pre-built multi-arch images on GHCR — built and pushed by .github/workflows/images.yml.
# HA Supervisor substitutes {arch} with the host's CPU arch (aarch64, amd64, …).
image: ghcr.io/tesseractaz/{arch}-ecoflow-panel
startup: services
boot: auto
stage: stable
# HA's `init: true` default wraps the container with Docker's tini, making
# tini PID 1. The HA base image already ships its own s6-overlay init at
# /init; with tini in front, s6-overlay-suexec sees it isn't PID 1 and
# refuses to start (crash loop with "fatal: can only run as pid 1"). Turn
# tini off so our /init (s6) runs as PID 1 — the standard pattern for any
# add-on built on the official HA base images.
init: false
ports:
  8787/tcp: 8787
  2323/tcp: 2323
ports_description:
  8787/tcp: Web dashboard + REST API + WebSocket
  2323/tcp: SSH "control-room" TUI (off by default; password login with the Console Username and Console Password — every login is refused until a Console Password is set)
# v0.9.5 — HA Ingress: makes the panel appear as a sidebar item inside
# Home Assistant (visible in the HA mobile app), authenticated through
# HA's normal session. Same server, same port — HA's hassio_ingress
# reverse-proxies in. Direct LAN access on :8787 still works.
ingress: true
ingress_port: 8787
panel_icon: mdi:home-battery
panel_title: Power
panel_admin: false
map:
  - data:rw
  # v1.107.0 — publish a consistent SQLite snapshot to /share so an
  # external viewer (sqlite-web et al) can open it. /data is private to
  # this add-on and no other add-on can ever read it; /share is the
  # cross-add-on interchange point. We only write the snapshot and the
  # backup hook's journal (ecoflow-panel/backup-window.jsonl) here.
  - share:rw
# v1.187.20 — backups stay HOT: a cold backup stops the add-on, and with it the alarm engine, for
# the whole copy every night. Instead the Supervisor runs these with `docker exec` in the running
# container just before and after it copies /data: `pre` empties the SQLite WAL and holds
# checkpoints still, `post` restores them (server/src/backupWindow.ts), so no checkpoint rewrites
# ecoflow.db while it is copied. The hook always exits 0 (a non-zero exit would drop the add-on
# from the backup) and journals each run to /share/ecoflow-panel/backup-window.jsonl.
backup: hot
backup_pre: /usr/bin/ecoflow-panel-backup-hook pre
backup_post: /usr/bin/ecoflow-panel-backup-hook post
# v0.9.20 — request access to Home Assistant's Core REST API so the
# add-on can call media_player.play_media (HomePod/Sonos broadcasts),
# enumerate media_player entities for the SHIPWIDE INTERCOM discovery
# panel, and check entity states. Without this flag SUPERVISOR_TOKEN
# is not granted access to /core/api/* endpoints — every broadcast
# returns "SUPERVISOR_TOKEN missing or HA unreachable".
homeassistant_api: true
# v0.9.33 — Supervisor API access, so the add-on can list installed add-ons
# (post-install Piper visibility checks). Its role is hassio_role below:
# `homeassistant` since v1.7.0, no longer "manager". The Wyoming Protocol →
# Piper TTS config-flow goes through the Core API (homeassistant_api above).
# The only Supervisor call is a read-only GET /addons (haService.ts
# listAddons, behind /api/admin/addons); nothing installs, uninstalls or
# reconfigures an add-on.
hassio_api: true
# v1.7.0 (security #4, CWE-250) — least privilege: the add-on's only Supervisor
# call is a read-only GET /addons (Piper/speaker visibility survey). `manager`
# also grants add-on start/stop/reconfigure, which a compromised process/token
# would inherit; `homeassistant` retains the Core API + the read it needs. If a
# future feature needs true add-on management, bump this back to manager.
hassio_role: homeassistant
# Per-field labels + help render on the Configuration page from
# translations/en.yaml; every option's default, range and meaning is in
# docs/guide/options.md (grouped by goal in the operator guide, ecoflow_panel/DOCS.md).
# Order below = the order shown in the HA form (essentials first).
options:
  # Credentials & core — the only fields a fresh install must set
  ECOFLOW_ACCESS_KEY: ""
  ECOFLOW_SECRET_KEY: ""
  ECOFLOW_API_HOST: https://api-a.ecoflow.com
  LOG_LEVEL: info
  # Site location — used only for the solar day-ahead forecast
  FORECAST_LAT: 33.4484
  FORECAST_LON: -112.074
  # Notifications — per-alert push (per-field help: docs/guide/options.md)
  NOTIFY_CHANNEL: none
  NOTIFY_MIN_SEVERITY: warning
  NOTIFY_RESOLVED: true
  NOTIFY_HA_PUSH_TARGETS: ""
  NOTIFY_CRITICAL_BYPASS_DND: true
  NOTIFY_QUIET_HOURS: "22-06"
  NOTIFY_DIGEST_HOUR: 7
  # Audible broadcast — spoken alarms + chimes over HA media_player speakers
  BROADCAST_ENABLED: false
  BROADCAST_TARGETS: ""
  BROADCAST_SIP_TARGETS: ""
  BROADCAST_MIN_SEVERITY: critical
  BROADCAST_QUIET_HOURS: "22-06"
  CRITICAL_BREAKS_QUIET_HOURS: false
  BROADCAST_AUDIO_BASE: "http://homeassistant.local:8787"
  BROADCAST_VOLUME: 0.5
  BROADCAST_ANNOUNCE_VOLUME: ""
  BROADCAST_USE_PRE_ANNOUNCE: false
  BROADCAST_LEAD_SILENCE_MS: 1000
  BROADCAST_REPEAT: 2
  BROADCAST_REPEAT_GAP_MS: 1500
  BROADCAST_CHIME_GAP_MS: 1000
  BROADCAST_ANNOUNCE_RETRIES: 1
  BROADCAST_WYOMING_HOST: core-piper
  BROADCAST_WYOMING_PORT: 10200
  BROADCAST_WYOMING_VOICE: ""
  BROADCAST_BILINGUAL: false
  BROADCAST_WYOMING_VOICE_ES: ""
  # Battery & grid alarms
  BATTERY_SOC_ALARM_ENABLED: true
  BATTERY_RUNWAY_ALARM_ENABLED: true
  BATTERY_RUNWAY_ALARM_REANNOUNCE_MIN: 60
  GRID_AVAILABLE: false
  GRID_PRESENCE_ENTITY: ""
  GRID_FLOOR_SLACK_PCT: "1.5"
  CHARGE_NOW_RESPONSE: "advisory"
  HOST_POWER_ENTITY: ""
  # Load-shedding advisor (read + advise only; never actuates)
  LOAD_SHEDDING_ADVISORY_ENABLED: true
  LOAD_SHEDDING_SHED_ENTITIES: ""
  LOAD_SHEDDING_RUNWAY_THRESHOLD_H: 4.0
  LOAD_SHEDDING_RESTORE_MARGIN_H: 2.0
  # Night-charge TOU-arbitrage engine. Write posture per NIGHT_CHARGE_MODE:
  # advisory (default, never writes) | supervised (one announced, cancellable,
  # bounded, auto-reverting reserve write per charge night) | auto (gated).
  # With ARB_OBJECTIVE cost and ARB_COST_MAX_SOC_PCT above 50, a supervised or
  # auto night also sets the panel's force-charge ceiling (80-100, restored
  # afterwards) and switches force charge ON then OFF per Core slot.
  NIGHT_CHARGE_ADVISOR_ENABLED: true
  NIGHT_CHARGE_MODE: advisory
  ARB_OUTAGE_CUSHION_PCT: 15
  ARB_OUTAGE_CUSHION_HOURS: 4
  ARB_ISLANDED_LOAD_SAFETY: 1.25
  ARB_OBJECTIVE: resilience
  ARB_COST_MAX_SOC_PCT: 90
  ARB_MIN_BUY_KWH: 1
  ARB_CHARGE_CAP_KW: 0
  ARB_GRID_INPUT_CAP_KW: 17
  ARB_LOAD_P90_FACTOR: 1.15
  NIGHT_CHARGE_NOTIFY_HOUR: 21
  NIGHT_CHARGE_NOTIFY_MINUTE: 30
  NIGHT_CHARGE_NOTIFY_ON_HOLD: true
  # Heartbeat (dead-man's switch): an outside https ping URL; blank = off
  HEARTBEAT_URL: ""
  HEARTBEAT_INTERVAL_S: 300
  # APS R-EV preset (used when TARIFF_PLAN is unset or aps_r_ev): effective ¢/kWh from a bill;
  # blank = unconfirmed → $ output null
  TARIFF_APS_ONPEAK_SUMMER_CENTS: ""
  TARIFF_APS_ONPEAK_WINTER_CENTS: ""
  TARIFF_APS_OFFPEAK_SUMMER_CENTS: ""
  TARIFF_APS_OFFPEAK_WINTER_CENTS: ""
  TARIFF_APS_OVERNIGHT_CENTS: ""
  TARIFF_APS_SUPEROFFPEAK_WINTER_CENTS: ""
  TARIFF_APS_RATES_CONFIRMED: false
  # Integrations (opt-in): NWS storm alerts + MQTT auto-discovery
  NWS_ENABLED: false
  MQTT_DISCOVERY_ENABLED: false
  MQTT_DISCOVERY_HOST: ""
  MQTT_DISCOVERY_PORT: 1883
  MQTT_DISCOVERY_USER: ""
  MQTT_DISCOVERY_PASS: ""
  MQTT_DISCOVERY_PREFIX: homeassistant
  # SSH control-room TUI (LAN; password login — every login is refused until TUI_PASSWORD is set)
  # v1.7.0 (security #5, CWE-1188) — default OFF: a control plane published on the host
  # LAN is not on by default on a fresh install. Opt in by setting this true.
  SSH_ENABLED: false
  SSH_PORT: 2323
  TUI_USERNAME: ""
  TUI_PASSWORD: ""
  TUI_TRUSTED_ORIGINS: ""
  # Diagnostic / advanced (leave default unless you know you need them)
  RECORDER_RETENTION_DAYS: 30
  ECOFLOW_DEVICE_REACHABILITY: ""
  WRITE_DEBUG_TOKEN: ""
schema:
  # Credentials & core — the only fields a fresh install must set
  ECOFLOW_ACCESS_KEY: password
  ECOFLOW_SECRET_KEY: password
  ECOFLOW_API_HOST: url
  LOG_LEVEL: list(trace|debug|info|warn|error|fatal)
  # Site location — used only for the solar day-ahead forecast
  FORECAST_LAT: float(-90,90)
  FORECAST_LON: float(-180,180)
  # Notifications — per-alert push (per-field help: docs/guide/options.md)
  NOTIFY_CHANNEL: list(none|ha)
  NOTIFY_MIN_SEVERITY: list(warning|critical)
  NOTIFY_RESOLVED: bool
  NOTIFY_HA_PUSH_TARGETS: "str?"
  NOTIFY_CRITICAL_BYPASS_DND: bool
  NOTIFY_QUIET_HOURS: "str?"
  NOTIFY_DIGEST_HOUR: int(0,23)?
  # Audible broadcast — spoken alarms + chimes over HA media_player speakers
  BROADCAST_ENABLED: bool
  BROADCAST_TARGETS: "str?"
  BROADCAST_SIP_TARGETS: "str?"
  BROADCAST_MIN_SEVERITY: list(critical|warning)
  BROADCAST_QUIET_HOURS: "str?"
  CRITICAL_BREAKS_QUIET_HOURS: bool
  BROADCAST_AUDIO_BASE: "str?"
  BROADCAST_VOLUME: float(0,1)
  BROADCAST_ANNOUNCE_VOLUME: "str?"
  BROADCAST_USE_PRE_ANNOUNCE: bool
  BROADCAST_LEAD_SILENCE_MS: int(0,5000)?
  BROADCAST_REPEAT: int(1,3)?
  BROADCAST_REPEAT_GAP_MS: int(0,5000)?
  BROADCAST_CHIME_GAP_MS: int(0,5000)?
  BROADCAST_ANNOUNCE_RETRIES: int(0,3)?
  BROADCAST_WYOMING_HOST: "str?"
  BROADCAST_WYOMING_PORT: port
  BROADCAST_WYOMING_VOICE: "str?"
  BROADCAST_BILINGUAL: bool
  BROADCAST_WYOMING_VOICE_ES: "str?"
  # Battery & grid alarms
  BATTERY_SOC_ALARM_ENABLED: bool
  BATTERY_RUNWAY_ALARM_ENABLED: bool
  BATTERY_RUNWAY_ALARM_REANNOUNCE_MIN: int(5,720)?
  GRID_AVAILABLE: bool
  GRID_PRESENCE_ENTITY: "str?"
  GRID_FLOOR_SLACK_PCT: "str?"
  CHARGE_NOW_RESPONSE: "list(off|advisory|supervised)?"
  HOST_POWER_ENTITY: "str?"
  # Load-shedding advisor (read + advise only; never actuates)
  LOAD_SHEDDING_ADVISORY_ENABLED: bool
  LOAD_SHEDDING_SHED_ENTITIES: "str?"
  LOAD_SHEDDING_RUNWAY_THRESHOLD_H: float(0,168)
  LOAD_SHEDDING_RESTORE_MARGIN_H: float(0,168)
  # Night-charge TOU-arbitrage engine. Writes ONLY when NIGHT_CHARGE_MODE is
  # supervised or auto (default advisory writes nothing): the panel backup-reserve
  # setpoint, clamped to 10-50; and, with ARB_OBJECTIVE cost and
  # ARB_COST_MAX_SOC_PCT above 50, the force-charge ceiling (80-100) and force
  # charge ON/OFF per Core slot. See docs/reference/15-2-night-charge-writes.md
  # “8b. Supervised write mode”; every writer: the operator guide's
  # “What Power changes on your system”.
  NIGHT_CHARGE_ADVISOR_ENABLED: bool
  NIGHT_CHARGE_MODE: list(advisory|supervised|auto)
  ARB_OUTAGE_CUSHION_PCT: int(0,40)
  ARB_OUTAGE_CUSHION_HOURS: float(0,72)
  ARB_ISLANDED_LOAD_SAFETY: float(1,5)
  ARB_OBJECTIVE: list(resilience|cost)
  ARB_COST_MAX_SOC_PCT: int(50,100)
  ARB_MIN_BUY_KWH: float(0,50)
  ARB_CHARGE_CAP_KW: float(0,50)
  ARB_GRID_INPUT_CAP_KW: float(0,100)
  ARB_LOAD_P90_FACTOR: float(1,2)
  NIGHT_CHARGE_NOTIFY_HOUR: int(0,23)
  NIGHT_CHARGE_NOTIFY_MINUTE: int(0,59)
  NIGHT_CHARGE_NOTIFY_ON_HOLD: bool
  # Heartbeat (dead-man's switch)
  HEARTBEAT_URL: "str?"
  HEARTBEAT_INTERVAL_S: "int(60,3600)?"
  # APS R-EV preset (used when TARIFF_PLAN is unset or aps_r_ev): effective ¢/kWh — str? (ships
  # empty; runtime parses number-or-null, same "ship empty, validate at send time" pattern as the
  # NOTIFY_* URLs above).
  TARIFF_APS_ONPEAK_SUMMER_CENTS: "str?"
  TARIFF_APS_ONPEAK_WINTER_CENTS: "str?"
  TARIFF_APS_OFFPEAK_SUMMER_CENTS: "str?"
  TARIFF_APS_OFFPEAK_WINTER_CENTS: "str?"
  TARIFF_APS_OVERNIGHT_CENTS: "str?"
  TARIFF_APS_SUPEROFFPEAK_WINTER_CENTS: "str?"
  TARIFF_APS_RATES_CONFIRMED: bool
  # Integrations (opt-in): NWS storm alerts + MQTT auto-discovery
  NWS_ENABLED: bool
  MQTT_DISCOVERY_ENABLED: bool
  MQTT_DISCOVERY_HOST: "str?"
  MQTT_DISCOVERY_PORT: port
  MQTT_DISCOVERY_USER: "str?"
  MQTT_DISCOVERY_PASS: "password?"
  MQTT_DISCOVERY_PREFIX: "str?"
  # SSH control-room TUI (LAN; password login)
  SSH_ENABLED: bool
  SSH_PORT: port
  TUI_USERNAME: str?
  TUI_PASSWORD: password?
  TUI_TRUSTED_ORIGINS: str?
  # Diagnostic / advanced (leave default unless you know you need them)
  RECORDER_RETENTION_DAYS: int(7,3650)
  ECOFLOW_DEVICE_REACHABILITY: "str?"
  WRITE_DEBUG_TOKEN: "password?"
  # New keys (v1.191.0 and later) are schema-only and optional (`?`): no `options:` default, exported by
  # the run script only under `bashio::config.has_value`, so an unset key leaves the variable absent and
  # the code takes its current path. Each lane appends its keys under its own heading.
  # --- lane site --- (SITE_TIMEZONE, SITE_LOCATION_FROM_HA)
  SITE_TIMEZONE: "str?"
  # --- lane tariff --- (TARIFF_PLAN, TARIFF_PERIODS, TARIFF_RATES, TARIFF_RATES_CONFIRMED, TARIFF_FIXED_DAILY_CENTS, TARIFF_SUMMER_MONTHS, TARIFF_HOLIDAYS, TARIFF_CURRENCY, NIGHT_CHARGE_CHEAP_PERIOD, TARIFF_FLAT_CENTS_PER_KWH, TARIFF_ON_PEAK_CENTS, TARIFF_OFF_PEAK_CENTS, TARIFF_EXPORT_CENTS_PER_KWH, TARIFF_ON_PEAK_HOURS, TARIFF_ON_PEAK_DAYS)
  # The tariff plan: unset is the built-in APS R-EV preset above. An unusable spec fails closed (prices
  # unknown, night charge held, a repair issue), never the APS table.
  TARIFF_PLAN: "list(aps_r_ev|flat|two_tier|custom)?"
  TARIFF_PERIODS: "str?"
  TARIFF_RATES: "str?"
  TARIFF_RATES_CONFIRMED: "bool?"
  TARIFF_FIXED_DAILY_CENTS: "float?"
  TARIFF_SUMMER_MONTHS: "str?"
  TARIFF_HOLIDAYS: "str?"
  TARIFF_CURRENCY: "str?"
  NIGHT_CHARGE_CHEAP_PERIOD: "str?"
  # Tariff settings the code has read since before v1.191.0, now settable here (unset = as before)
  TARIFF_FLAT_CENTS_PER_KWH: "float?"
  TARIFF_ON_PEAK_CENTS: "float?"
  TARIFF_OFF_PEAK_CENTS: "float?"
  TARIFF_EXPORT_CENTS_PER_KWH: "float?"
  TARIFF_ON_PEAK_HOURS: "str?"
  TARIFF_ON_PEAK_DAYS: "str?"
  # --- lane pv --- (PV_ARRAY_KWP, PV_TILT_DEG, PV_AZIMUTH_DEG, PV_STRINGS)
  PV_ARRAY_KWP: "float(0.1,500)?"
  PV_TILT_DEG: "float(0,90)?"
  PV_AZIMUTH_DEG: "float(0,360)?"
  PV_STRINGS: "str?"
  # SITE_LOCATION_FROM_HA (OWNER DECISION 5) is set with the PV site, so it sits in this section.
  SITE_LOCATION_FROM_HA: "bool?"
  # --- lane ev --- (EV_MAX_LOAD_W, EV_CHARGER_COUNT, EV_PLATEAU_MIN_W, EV_CIRCUITS)
  # Each range equals the code's clamp (plan 2.3, CA10): EV_MAX_LOAD_W and EV_PLATEAU_MIN_W are
  # bounded below only.
  EV_MAX_LOAD_W: "int(0,)?"
  EV_CHARGER_COUNT: "int(0,4)?"
  EV_PLATEAU_MIN_W: "int(0,)?"
  EV_CIRCUITS: "str?"
  # --- lane devices --- (BENCH_SPARE_SNS, DEVICE_ALIASES)
  BENCH_SPARE_SNS: "str?"
  DEVICE_ALIASES: "str?"
  # --- lane limits --- (FORCE_CHARGE_KW_PER_CORE, RUNWAY_POOL_OVERHEAD_FLOOR_W, RUNWAY_CORE_OVERHEAD_W, BMS_RESEED_MIN_GAP_WH, CAPACITY_SCALE_MIN, FORECAST_NIGHT_START_HOUR, FORECAST_NIGHT_END_HOUR, GRID_CO2_INTENSITY_LB_PER_MWH, CYCLING_BASE_WEAR_USD_PER_KWH, OPPORTUNISTIC_LOADS, BATTERY_SOC_LADDER)
  # RUNWAY_* accept decimals (float), clamped to the ranges below; CAPACITY_SCALE_MIN is clamped
  # to 0.5..1; the night band hours are rounded and clamped to 0..23. The rest are not clamped.
  FORCE_CHARGE_KW_PER_CORE: "float(0,)?"
  RUNWAY_POOL_OVERHEAD_FLOOR_W: "float(0,1500)?"
  RUNWAY_CORE_OVERHEAD_W: "float(0,500)?"
  BMS_RESEED_MIN_GAP_WH: "int?"
  CAPACITY_SCALE_MIN: "float(0.5,1)?"
  FORECAST_NIGHT_START_HOUR: "int(0,23)?"
  FORECAST_NIGHT_END_HOUR: "int(0,23)?"
  GRID_CO2_INTENSITY_LB_PER_MWH: "float?"
  CYCLING_BASE_WEAR_USD_PER_KWH: "float?"
  OPPORTUNISTIC_LOADS: "str?"
  BATTERY_SOC_LADDER: "str?"
